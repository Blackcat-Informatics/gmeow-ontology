# Nightly Rust is required because gmeow-logic uses `portable_simd` for targeted
# native vector kernels.
#
[toolchain]
channel = "nightly"
components = ["rustfmt", "clippy"]
# The purrdf wasm engine (P10) + the wasm-clean SPARQL leaf compile to
# wasm32-unknown-unknown; `make wasm` builds for it. Listing it here means
# every toolchain consumer provisions the target by default.
targets = ["wasm32-unknown-unknown"]
