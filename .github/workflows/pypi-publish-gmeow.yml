name: Publish gmeow to PyPI

# Publish the ``gmeow`` ontology toolchain via PyPI trusted publishing (OIDC).
# The repository environment ``pypi-gmeow`` must be configured in the PyPI
# project before the first run.
#
# The ``gmeow`` package depends on ``gmeow-gts``, so the engine release should
# already be live on PyPI before the matching ``py/gmeow/v*`` tag is pushed.

permissions: {}

on:
  push:
    tags:
      - "py/gmeow/v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13"
      - id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${GITHUB_REF_NAME#py/gmeow/v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::Tag version ($tag_version) does not match pyproject.toml version ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - run: uv build --package gmeow --out-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-gmeow
          path: dist/*

  gts-availability:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13"
      - name: Poll for matching gmeow-gts release on PyPI
        run: |
          gts_version=$(python -c "import tomllib; print(tomllib.load(open('packages/gts/pyproject.toml','rb'))['project']['version'])")
          deadline=$((SECONDS + 540))
          while true; do
            if pip install --dry-run "gmeow-gts==${gts_version}"; then
              echo "gmeow-gts ${gts_version} is available on PyPI"
              exit 0
            fi
            if [[ $SECONDS -ge $deadline ]]; then
              echo "::error::gmeow-gts ${gts_version} did not become available within 9 minutes"
              exit 1
            fi
            echo "gmeow-gts ${gts_version} not yet available; retrying in 10s"
            sleep 10
          done

  publish:
    needs: [build, gts-availability]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-gmeow
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: dist-gmeow
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  smoke:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GMEOW_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13"
      - run: |
          pip install --upgrade pip
          python scripts/pypi_smoke.py --version "${GMEOW_VERSION}"
