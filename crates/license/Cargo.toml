[package]
name = "gmeow-license"
description = "GMEOW license-token vendoring / axiom-copy policy classifier — the RUST-FIRST single source of truth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
