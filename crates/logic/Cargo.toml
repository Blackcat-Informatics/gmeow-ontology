[package]
name = "gmeow-logic"
description = "GMEOW reasoning engine core: world-indexed RDF 1.2 named-graph store for entailment queries, gated against the language-neutral conformance corpus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "rdf-star", "reasoning", "knowledge-graph", "oxigraph"]

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
# oxigraph in-memory Store only (worlds = named graphs), with RDF 1.2 support.
# default-features off drops the `rocksdb` backend (oxrocksdb-sys, a C/C++ build
# we never use and which oxigraph already excludes on wasm); `rdf-12` enables the
# RDF 1.2 parser/serializer the whole logic layer is built on. One in-memory
# store, one code path on every target — correct dependency configuration.
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
blake3 = "1"

# pyo3 is native-only: it cannot link into wasm targets (platform-correct, not
# an optionality toggle — we have zero degraded fallbacks on native).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py313"] }

[dev-dependencies]
serde_json = "1"
