[profile.default]
# Wall-clock duration is not a correctness gate. The JUnit report remains useful
# as contextual evidence, while correctness failures and the repeated slow-timeout
# runaway backstop remain hard failures.
#
# The default filter keeps exhaustive whole-repository proofs in the maintainer
# lane when focused tests and dedicated drift gates cover their per-commit
# contracts. Membership is architectural, never triggered by crossing an elapsed
# threshold. The maint-heavy profile below re-includes everything.
default-filter = '''
  not (
    (package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/))
    | (package(gmeow-pipeline) & test(/projections::tests::up_project_(recovers_message_superclass_via_prp_dom|never_fabricates_subkind_or_sibling)/))
    | (package(gmeow-pipeline) & binary(fold_parity))
    | test(/corpus_conformance_heavy_offgate/)
    | test(/w3c_rdfc10_heavy_offgate/)
    | (package(gmeow-conformance) & binary(full_divergence_gate) & test(/_heavy_offgate/))
    | (package(gmeow-conformance) & binary(full_decided_gate) & test(/_heavy_offgate/))
    | (package(gmeow-logic) & test(/whole_bundle_.*gate/))
    | (package(gmeow-pipeline) & binary(end_to_end))
    | (package(gmeow-pipeline) & binary(fanout_parity))
    | (package(gmeow-pipeline) & test(/stages::superset::tests::project_bundle_reconstructs_the_committed_tree_and_gate_is_clean/))
    | (package(gmeow-foundation-corpus) & test(/imported_graph_conforms_to_shapes/))
    | (package(gmeow-validate) & (binary(conformance_finance) | binary(conformance_agentic) | binary(conformance_ai_claims) | binary(conformance_music_analysis) | binary(conformance_math_producers) | binary(conformance_affect_producer_union)))
    | (package(gmeow-dev-cli) & binary(cli_parity) & (test(build_writes_serializations) | test(project_view_over_the_snapshot)))
    | (package(gmeow-cli) & binary(cli) & (test(export_respects_language_selector) | test(project_schema_org_view_filter) | test(project_unknown_view_fails) | test(describe_env_language_rejected_if_unknown) | test(describe_resolves_grounding_curies) | test(describe_resolves_grounding_full_iris) | test(describe_known_term_renders_prose) | test(describe_unknown_language_fails_with_available_list) | test(describe_toon_format_emits_toon) | test(describe_json_format_is_valid_card_json)))
    | (package(gmeow-cli) & binary(bundle_smoke) & test(describe_names_a_known_term))
    | (package(gmeow-docs) & binary(extract_roundtrip) & test(rendered_tree_is_disk_faithful))
    | (package(gmeow-pipeline) & test(/quality_assessment_graph_rides_the_self_description_carrier_heavy_offgate/))
    | (package(gmeow-pipeline) & test(/stages::carrier::term_entailments_tests::term_entailments_are_non_vacuous_on_the_real_repo/))
    | (package(gmeow-pipeline) & test(/stages::docs_render::tests::diagnostics_digest_total_is_non_vacuous_on_the_real_repo/))
    | (package(gmeow-pipeline) & test(/stages::docs_render::tests::term_loss_digest_is_non_vacuous_on_the_real_repo/))
    | (package(gmeow-slicetest) & test(/run_structural_file::core\/slice-quality-rubric\/tests\/structural\.ttl/))
    | (package(gmeow-pipeline) & binary(release_verify_roundtrip))
    | (package(gmeow-cli) & binary(self_sufficiency) & (test(transpile_wheel_mode_equals_repo_mode) | test(transpile_blinded_lifts_and_fans_out_without_x_gmeow_leak) | test(project_wheel_mode_equals_repo_mode) | test(describe_wheel_mode_equals_repo_mode) | test(describe_grounding_terms_wheel_mode_equals_repo_mode)))
    | (package(gmeow-docs) & test(/describe::tests::every_grounding_namespace_has_describable_terms_that_render/))
    | (package(gmeow-docs) & binary(render_golden) & test(render_site_is_byte_stable))
    | (package(gmeow-docs) & binary(mdbook_render) & (test(book_bodies_are_rewrite_of_single_authority) | test(book_term_chapter_with_dropped_link_golden) | test(book_no_relative_link_to_dropped_page) | test(book_toml_golden) | test(book_zero_term_slice_renders_valid_chapter)))
    | (package(gmeow-docs) & binary(describe_bundle_language) & test(describe_resolves_carrier_tags_against_shipped_bundle))
    | (package(gmeow-docs) & binary(extract_roundtrip) & test(english_carrier_tree_matches_render_site))
    | (package(gmeow-pipeline) & test(/stages::carrier::ustar_tests::build_docs_archive_packs_the_rendered_site/))
    | (package(gmeow-pipeline) & test(/stages::governance_floors::tests::generated_axis_floors_are_byte_reconstructible_from_the_bundle/))
    | (package(gmeow-pipeline) & test(/mcp::tests::json_rpc_protocol_conformance_round_trip/))
    | (package(gmeow-pipeline) & test(/mcp::tests::verify_graph_.*_heavy_offgate/))
    | (package(gmeow-pipeline) & test(/mcp::tests::explain_quad_.*_heavy_offgate/))
    | (package(gmeow-pipeline) & test(/stages::mappings::tests::projection_report_unions_logic_and_correspondence_rows/))
    | (package(gmeow-pipeline) & binary(product_routing) & test(compiler_products_are_first_class_dag_artifacts))
    | (package(gmeow-pipeline) & test(/stages::export::tests::export_produces_structurally_valid_artifacts/))
  )
'''
slow-timeout = { period = "60s", "terminate-after" = 2, "grace-period" = "30s" }
retries = { backoff = "fixed", count = 2, delay = "1s" }
final-status-level = "slow"
success-output = "never"
failure-output = "immediate-final"

[profile.ci]
inherits = "default"
# Use the runner's natural CPU width. No fixed global or test-group cap throttles
# either CI or a 32+ CPU development server.
junit = { path = "junit.xml" }
fail-fast = false

[profile.maint-heavy]
inherits = "default"
# Exhaustive architectural lane: every test excluded by the default filter runs.
default-filter = 'all()'
junit = { path = "junit.xml" }
fail-fast = false

# Overrides only extend the runaway backstop for exhaustive paths or reserve the
# whole host for tests that create their own full-width worker pool. There are no
# fixed one- or two-thread scheduling ceilings.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & binary(/fold_parity|end_to_end|dag_dogfood|fanout_parity/)'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

# The off-gate `gmeow-dev logic compile --mode M` byte-parity tests each drive the
# WHOLE pipeline (run_full) to prove the CLI's per-mode render matches the committed
# artifact — the same order of magnitude as the pipeline whole-run parity lanes above,
# so they get the same extended runaway backstop rather than the 60s default that only
# fits focused unit tests.
[[profile.default.overrides]]
filter = 'package(gmeow-dev-cli) & test(/dev_logic::compile_tests::mode_(owl_dl|datalog|report)_matches/)'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

# The dev-cli real-repository end-to-end contract tests (docs-distribution manifest
# verify, and the whole-repo slice-quality gate) assemble the full bundle; the
# advice-catalog content pushed them past the 60s default under gate parallelism
# (they pass at ~97-115s). Same 300s backstop the sibling bundle-assembly proofs use.
[[profile.default.overrides]]
filter = 'package(gmeow-dev-cli) & ( binary(docs_distribution_contract) | test(/dev_slice_quality::gate_enforcement_tests::the_real_repository_slice_quality_gate_is_green_end_to_end/) )'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-logic) & binary(ontology_entailments)'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

# Heavy whole-bundle "discharge/parity by execution" proofs: they assemble the merged
# bundle and execute every flagship / SHACL tier / EDOAL+SPARQL lowering against it.
# The advice-catalog merge grew the bundle, and these run with high variance (79-108s)
# close to the 120s ceiling — give them the same 300s backstop as the sibling bundle proofs.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & ( binary(gmn_conformance_discharge) | binary(edoal_sparql_correspondence_parity) | binary(lang_flagship_discharge) )'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# `math_conformance_discharge` gets its own backstop, and its history is the clearest
# statement of why that is not a concession. It used to finish almost instantly because its
# SHACL channel degraded to a non-failing "unverified" bucket when the generated shape
# surface was absent, and its owl-axiom tier had no execution channel at all. A missing shape
# surface now hard-fails, the disjointness conflations are decided from the reasoned closure,
# and — the dominant cost — the reasoned-graph channel takes a REAL DL closure per
# counter-example instead of reading the asserted graph. It has to: the kernel authors an
# existential restriction on `math:withRespectTo`, so the chase invents dimension read-set
# edges no asserted read can see, and the surface-leak half needs the same closure.
#
# Those 188 closures are independent, so they run in parallel and the per-fixture results are
# folded in the fixtures' own sorted order — ~180s, down from ~720s sequential, which had
# overrun even a 2400s ceiling under concurrent gate load. A test that reds on machine load is
# broken rather than flaky, so the work got cheaper instead of the ceiling higher; this budget
# is the sibling bundle-proof one, not a special case.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & binary(math_conformance_discharge)'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

# The whole-bundle superset proof reconstructs the ENTIRE committed generated/ tree
# from gmeow.gts twice — once directly for the projection assertions, once more inside
# `check_superset` (the production entry point, kept so the gate's own composition is
# exercised rather than only its parts) — then reads all 400+ materialized files back
# off disk to compare. A single `project_bundle` over the current bundle measures ~71s,
# so the pair sits past the 60s-x2 default kill by construction, not by load: it is the
# same class as the sibling whole-bundle proofs above and gets the same 300s backstop.
# It is maint-heavy-only (the default filter excludes it), which is why the overrun went
# unseen — `make check` never ran it. Assertions unchanged; only the budget it is allowed.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/stages::superset::tests::project_bundle_reconstructs_the_committed_tree_and_gate_is_clean/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-logic) & binary(coherence_gate)'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-slice-quality) & test(scores_the_logic_slice_green_vs_advisory)'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

# Real-slice batch reasoning parity is a heavy whole-repository proof (purrdf
# 0.8.x parallel SHACL): it runs ~90-120s and starves past the 60s default under
# gate parallelism. Give it the same 300s backstop the sibling bundle-building
# proofs use — it passes on content, it is only slow.
[[profile.default.overrides]]
filter = 'package(gmeow-slice-quality) & test(reasoner::tests::curated_real_slices_batch_matches_scratch)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# Whole-bundle SSSOM lowering parity assembles the merged DSL and lowers every
# SSSOM set against the committed corpus — a ~85-120s bundle-assembly proof that
# likewise starves past the 60s default. Same 300s backstop.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & binary(sssom_correspondence_parity) & test(sssom_lowering_matches_committed_corpus)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# The OBI planned-process bridge proof drives BOTH producer legs — the typed
# correspondence frontend and the SSSOM lowering — over the real corpus, reading
# only authored sources. It measures ~118s uncontended, which lands inside the
# 60s default group's 120s kill by a margin small enough that gate parallelism
# alone decides it: it passed at 118s on a quiet box and timed out here under
# load. That is a red on timing rather than on content, which is the failure the
# host lock exists to prevent and the one that teaches people to re-run reds.
# Same 300s backstop the sibling whole-corpus parity proofs use. The assertions
# are unchanged; only the budget it is allowed.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & binary(obi_planned_process_projection)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-validate) & binary(conformance_affect_producer_union) & test(/twin_/)'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & ( (binary(product_routing) & test(compiler_products_are_first_class_dag_artifacts)) | test(/stages::export::tests::export_produces_structurally_valid_artifacts|stages::governance_floors::tests::generated_axis_floors_are_byte_reconstructible_from_the_bundle|stages::yaml_ld::tests::dist_jsonld_roundtrips_through_carrier|stages::mappings::tests::projection_report_unions_logic_and_correspondence_rows/) )'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/)'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/gts_sink|stages::carrier::ustar_tests::build_docs_archive_packs_the_rendered_site|stages::carrier::native_assembly_tests::authored_default_assembles_natively/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/stages::carrier::docs_try_it_golden/)'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/stages::carrier::term_entailments_tests::term_entailments_are_non_vacuous_on_the_real_repo/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/stages::docs_render::tests::diagnostics_digest_total_is_non_vacuous_on_the_real_repo/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-slicetest) & test(/run_conformance_file::grounding\//)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-validate) & ( (binary(consumer_advisory_shape) & !test(/conformance_support::/)) | (binary(conformance_profiles) & test(/open_value_guard_violates_on_orphan_(dimension|realm)/)) | (binary(conformance_creative_works) & test(frameless_expression_fails_frame_requirement)) )'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/stages::mappings::tests::(sssom_emits_and_overlaps_byte_identically_with_committed|edoal_and_sparql_emit_byte_identically_with_committed|standpoint_and_dsl_stats_emit_byte_identically_with_committed|fno_is_well_formed_ntriples|prefix_set_projections_are_emitted_and_parse|list_functions_are_emitted_and_parse)/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/mcp::tests::verify_graph_accepts_a_normal_small_overlay_over_the_whole_bundle/)'
threads-required = "num-cpus"

# The docs-distribution, scoreboards, slice-brief, translation-rollup, and mappings
# module tests each materialize or verify the WHOLE gmeow.gts bundle (the same order
# of magnitude as the mappings byte-parity lanes above) — purrdf 0.8.x's parallel
# SHACL made that assembly heavier still. As a class they belong in the extended
# runaway backstop rather than the 60s-x2 default that only fits focused unit tests;
# otherwise many bundle-builders running in parallel starve each other past the 120s
# edge under host contention (0 assertion failures — they pass at ~100-118s each). A
# fast test in one of these modules simply never approaches the backstop; the 600s
# ceiling still bounds a genuine runaway.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & ( test(/docs_distribution::tests::/) | test(/scoreboards::tests::/) | test(/stages::slice_brief::tests::/) | test(/stages::lang_docs_rendering::tests::/) | test(/stages::mappings::tests::/) )'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }
