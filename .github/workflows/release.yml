name: Release

# On a version tag, build the reasoned closure, all serializations, metadata,
# documentation, and the CrossRef DOI deposit document, and attach them as build
# artifacts. The DOI is minted by depositing crossref-deposit.xml to CrossRef
# (Blackcat Informatics is the registrant) — this is a deliberate manual step
# after reviewing the generated deposit (see README).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # No cache on the privileged tag-release build: a PR run could write a
          # cache entry this job would otherwise restore (cache-poisoning path).
          # Releases are infrequent — a clean, hermetic build is worth more.
          enable-cache: false

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Pull pinned ROBOT image
        run: |
          ROBOT_IMAGE=$(uv run python -c "from gmeow_tools.config import ROBOT_IMAGE; print(ROBOT_IMAGE)")
          docker pull "$ROBOT_IMAGE"

      - name: Reason (HermiT) + reasoned closure
        run: uv run --package gmeow-dev gmeow-dev reason --reasoner hermit --full

      - name: Build serializations + JSON-LD context + apache.conf
        run: uv run --package gmeow-dev gmeow-dev build

      - name: Generate VoID + DCAT metadata
        run: uv run --package gmeow-dev gmeow-dev regenerate metadata

      - name: Generate CrossRef DOI deposit document
        run: uv run --package gmeow-dev gmeow-dev crossref

      - name: Generate documentation (pyLODE)
        run: uv run --package gmeow-dev gmeow-dev docs

      - name: RDF 1.2 statement artifact gate
        run: uv run --package gmeow-dev gmeow-dev regenerate statements

      - name: Sign gmeow.gts with the release key
        env:
          GMEOW_RELEASE_SIGNING_KEY: ${{ secrets.GMEOW_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$GMEOW_RELEASE_SIGNING_KEY" ]]; then
            echo "::error::GMEOW_RELEASE_SIGNING_KEY secret is not configured"
            exit 1
          fi
          mkdir -p /tmp/gpg
          printf '%s' "$GMEOW_RELEASE_SIGNING_KEY" > /tmp/gpg/signing-key.asc
          uv run --package gmeow-dev gmeow-dev gts compile-full \
            --sign-key /tmp/gpg/signing-key.asc \
            --public-key keys/gmeow-release-key.asc \
            -o dist/gmeow.gts
          rm -f /tmp/gpg/signing-key.asc

      - name: Verify signed gmeow.gts
        run: uv run gmeow verify dist/gmeow.gts

      - name: Upload published artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gmeow-${{ github.ref_name }}
          path: |
            dist/
            docs/_generated/
            metadata/
