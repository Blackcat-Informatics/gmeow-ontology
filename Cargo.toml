[workspace]
# The GTS engine moved to the gmeow-gts repo; its `gts` binary is obtained via
# `cargo install gmeow-gts`. The ontology Rust workspace keeps logic + shacl +
# validate plus shared diagnostics/RDF glue.
members = [
    # Native logic-conformance harness (#785): datatest-stable over the corpus.
    "crates/conformance",
    "crates/diagnostics",
    # Rust-owned typed documentation model built from the slice catalog (#853).
    "crates/docs",
    "crates/logic",
    # The single PyO3 cdylib: all five engine crates fold into `gmeow_native` so
    # the diagnostics `Report`/`Finding` pyclasses are ONE shared type (#630).
    "crates/native",
    "crates/rdf",
    "crates/shacl",
    "crates/slice",
    "crates/slicetest",
    "crates/validate",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Blackcat-Informatics/gmeow-ontology"

# === Build-memory taming for the `nemo` dependency tree ===
# nemo / nemo-physical are generic-heavy: LLVM monomorphizes them into a few
# enormous functions, so peak compile RAM (historically ~64 GB) is dominated by
# (a) full DWARF on debug builds feeding the link step, and (b) opt-level-3 LLVM
# working sets on release builds. These profiles cap both without slowing our own
# crates. Combined with the bundled rust-lld linker (.cargo/config.toml), this
# brings a clean nemo build back into normal-workstation territory.

[profile.dev]
# Full DWARF (the dev default `debug = 2`) is the debug-build RAM/disk hog and is
# almost never needed for a Datalog engine; line tables keep usable backtraces.
debug = "line-tables-only"
# Keep debuginfo out of the object files handed to the linker.
split-debuginfo = "unpacked"

# Release/wheel builds: opt-level 3 on nemo's generics is the RAM driver. opt 2
# keeps ~all the runtime speed; many small codegen units cap per-unit LLVM peak.
[profile.release.package.nemo]
opt-level = 2
codegen-units = 256

[profile.release.package.nemo-physical]
opt-level = 2
codegen-units = 256

# === First-party release tuning (#630 acceleration, Phase 1) ===
# Our own crates carry the runtime hot paths (logic chase, SHACL evaluation,
# validation lints). The default release profile splits each crate into 16
# codegen units, which forfeits cross-function inlining WITHIN the crate.
# codegen-units = 1 lets LLVM optimize each of our crates as a single unit.
#
# This is scoped to FIRST-PARTY crates via per-package overrides on purpose:
#   * nemo / nemo-physical keep their 256-unit caps (their build-RAM budget,
#     historically ~64 GB, is the reason the overrides above exist);
#   * third-party deps (oxigraph, scryer, regex, …) keep the default 16 units,
#     so neither their build RAM nor build time regresses.
# Net effect: only the crates we actually wrote get the tighter codegen, so the
# CI nemo build budget is untouched.
#
# NOTE: workspace-wide LTO is deliberately NOT enabled here. Unlike codegen-units,
# `lto` is a profile-global setting that cannot be scoped away from nemo, and its
# link-step RAM on the nemo graph is unverified against the 16 GB `ubuntu-latest`
# wheel runner. It is deferred to a separately-measured follow-up (plan Phase 1
# fallback: enable `lto = "thin"` only once peak link RSS is confirmed in budget).
[profile.release.package.gmeow-logic]
codegen-units = 1

[profile.release.package.gmeow-shacl]
codegen-units = 1

[profile.release.package.gmeow-validate]
codegen-units = 1

[profile.release.package.gmeow-rdf]
codegen-units = 1

[profile.release.package.gmeow-diagnostics]
codegen-units = 1

[profile.release.package.gmeow-docs]
codegen-units = 1

[profile.release.package.gmeow-native]
codegen-units = 1

[profile.release.package.gmeow-slice]
codegen-units = 1

[profile.release.package.gmeow-slicetest]
codegen-units = 1

[profile.release.package.gmeow-conformance]
codegen-units = 1

# `cargo bench` (used by `make bench`) runs under the `bench` profile, which
# inherits the BASE release settings but NOT the per-package overrides above —
# Cargo profile overrides are per-profile and are not inherited. Mirror the two
# RAM-critical nemo caps so a local benchmark build does not rebuild nemo at the
# default opt-3 / 16-unit settings (the very thing the release caps above avoid).
# Our own crates bench at the release base (opt-level 3); criterion deltas across
# phases are relative, so codegen-units fidelity to the wheel is not required here.
[profile.bench.package.nemo]
opt-level = 2
codegen-units = 256

[profile.bench.package.nemo-physical]
opt-level = 2
codegen-units = 256
