# Nightly deep fuzz of the format frontends (T7, #788). The always-on
# "reject malformed, never panic" contract runs in the normal CI nextest lane via
# the proptest never-panic gate (crates/{rdf,shacl,logic}/tests/never_panic.rs);
# this scheduled job runs cargo-fuzz for a longer, coverage-guided budget. Any
# crash artifact fails the run and is uploaded for triage (must become a checked-in
# regression seed + a parser fix).
name: fuzz

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || cargo install cargo-fuzz
      - name: Fuzz each frontend
        env:
          FUZZ_TIME: ${{ github.event.inputs.max_total_time || '300' }}
        run: make fuzz-smoke
      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
