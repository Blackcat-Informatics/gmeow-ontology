[package]
name = "gmeow-dev-cli"
description = "The repo-maintenance `gmeow-dev` command surface (regenerate, fanout, reason, verify, mappings, i18n, and the developer toolchain)."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "gmeow", "regenerate", "pipeline", "developer"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gmeow-dev"
path = "src/main.rs"

[dependencies]
gmeow-cli-core = { path = "../cli-core" }
clap = { version = "4", features = ["derive"] }
gmeow-diagnostics = { path = "../diagnostics" }
# The repo-maintenance engines the dev toolchain drives (default features, no python).
gmeow-pipeline = { path = "../pipeline" }
gmeow-logic = { path = "../logic" }
gmeow-logic-compile = { path = "../logic-compile" }
gmeow-validate = { path = "../validate" }
gmeow-docs = { path = "../docs" }
gmeow-music = { path = "../music" }
gmeow-foundation-corpus = { path = "../foundation-corpus" }

[dev-dependencies]
assert_cmd = "2"
trycmd = "0.15"
predicates = "3"
