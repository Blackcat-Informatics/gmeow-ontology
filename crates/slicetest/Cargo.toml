[package]
name = "gmeow-slicetest"
description = "GMEOW native slice-test harness (#784): discovers and executes the slice-resident declarative test-DSL specs (competency questions, structural assertions, example-conformance) under cargo-nextest, off rdflib."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# oxigraph in-memory Store with RDF 1.2 (same version + features as the rest of
# the workspace): load slice graphs and run the competency/structural SPARQL.
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
# Store construction (build_store/build_store_from_nt), the SHACL Finding bridge
# (finding_from_shacl -> shacl.<LocalName>), and the scoped-overlay example path.
gmeow-validate = { path = "../validate" }
# SHACL engine: parse_shapes + validate for the ExampleConformance executor.
gmeow-shacl = { path = "../shacl" }
# OWL 2 RL closure (rl_closure) for the reasoned competency graph — the same
# native primary lane tests/test_competency.py reasons over.
gmeow-logic = { path = "../logic" }
# Shared RDF 1.2 kernel: OxigraphStore adapter feeding the merged store into
# rl_closure.
gmeow-rdf = { path = "../rdf", features = ["gts", "oxigraph"] }

[dev-dependencies]
# File-driven test harness: one nextest case per discovered tests/*.ttl spec
# file, run in parallel. The headline speed win of #784 (T3).
datatest-stable = "0.3"

[[test]]
name = "slice_specs"
harness = false
