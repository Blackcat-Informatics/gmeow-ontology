[workspace]
# The GTS engine moved to the gmeow-gts repo; its `gts` binary is obtained via
# `cargo install gmeow-gts`. The ontology Rust workspace keeps logic + shacl +
# validate plus shared diagnostics/RDF glue.
members = [
    # Worktree-local DAG runner for the full developer gate.
    "crates/xtask",
    # Shared CLI foundation (console modes, reporters, tracing, exit codes) both
    # the consumer `gmeow` and the maintenance `gmeow-dev` binaries build on.
    "crates/cli-core",
    # Native logic-conformance harness (#785): datatest-stable over the corpus.
    "crates/conformance",
    # Engine-vs-engine benchmark harness (dedicated LEAF bin). It is the ONLY
    # installer of the gmeow-cost-measure counting #[global_allocator]; as a leaf
    # nothing depends on it, so the allocator never reaches gmeow-cli even though the
    # CLI transitively depends on gmeow-conformance (cli→pipeline→conformance).
    "crates/bench-engines",
    # Harness-scoped deterministic allocation-measurement allocator + measure()
    # helper. Depended on ONLY by bench targets / the future maint harness bin —
    # NEVER by gmeow-cli, since its #[global_allocator] is process-global.
    "crates/cost-measure",
    "crates/errors",
    # Rust-owned typed documentation model built from the slice catalog (#853).
    "crates/docs",
    # Deterministic Typst-source renderer + in-memory byte-reproducible PDF
    # compiler for the print documentation projection.
    "crates/docs-print",
    # Foundation-corpus importer (#364): narrative JSONL corpus → RDF graph +
    # budget report + six lossy projections; the consumer child of EPICs #358/#364.
    "crates/foundation-corpus",
    # The consumer/wheel-only `gmeow` command surface (runs without the repo).
    "crates/gmeow-cli",
    # The repo-maintenance `gmeow-dev` command surface (needs the working tree).
    "crates/gmeow-dev-cli",
    # Native IRI/URI value space (RFC-3987 IRI + RFC-3986 URI parse/validate,
    # reference resolution, syntax normalization, CURIE/prefix expansion): the
    # zero-dep leaf that replaces the oxigraph-family `oxiri` (purrdf S2, EPIC #906).

    # The lang: form AST, content keys, and interning (FORMS): a pure rlib peer of
    # logic-compile with no reasoning-runtime deps, keying forms by structural content.
    "crates/lang-form",
    # The lang: ingester/emitter skeleton (RUNTIME): the shared Bridge abstraction that
    # CARRIES a logic:Correspondence rather than minting a parallel lang: law-spine.
    "crates/lang-bridge",
    # Dependency-free license-token policy classifier (RUST-FIRST single source of
    # truth) shared by the conformance vendoring gate and the Python LinkPolicy shim.
    "crates/license",
    "crates/logic",
    # The pure, wasm-able logic compiler (#664/#732): the parse(RDF 1.2)→IR→project
    # half of the logic stack, split out of crates/logic with zero reasoning-runtime
    # deps. gmeow-logic depends on it.
    "crates/logic-compile",
    # Synchronous LSP server for .ttl and .logic files + sarif CLI (#671).
    "crates/lsp",
    # Reusable exact-rational geometry: an inner-product-space over a metric Gram
    # matrix + the pure math: graph loaders, shared by affect + the native math:
    # conformance gates so the "reusable layer" is genuinely reused, not buried.
    "crates/math",
    # Affect-intensity geometry: exact-rational inner-product-space over a metric
    # Gram matrix, read from an RDF graph, the √(xᵀGx) norm computed OUTSIDE the
    # reasoned core (Principle 12) for the CLI and the EmotionML emitter.
    "crates/affect",
    # Classifier-ingestion producers: captured HuggingFace classifier outputs
    # (GoEmotions / SST-2 / CardiffNLP / j-hartmann / zero-shot) → attributed
    # gmeow:ModelInferenceRun / AffectClassifierOutput / AffectiveClaim evidence,
    # with a blind get-leg round-trip proof of losslessness.
    "crates/affect-ingest",
    # Music-package toolchain: piece model, GTS package I/O, notation renderers,
    # MusicXML import, and loss manifests.
    "crates/music",
    # DAG-driven single-pass build executor (#861): typed stages over an
    # in-memory RDF dataflow, dogfooding the build graph from gmeow: individuals.
    "crates/pipeline",

    # The purrdf semantic C-ABI (purrdf P8 / #842): builds libpurrdf (cdylib +
    # staticlib) via cargo-c — a SemVer-disciplined extern "C" surface over the
    # gmeow-rdf semantic layer. Statically reuses gmeow-gts so a language shim
    # links a single .so. The rich companion to the permissive libgts C-ABI.


    # The permissive (MIT OR Apache-2.0) RDF 1.2 ingestion protocol (purrdf P6):
    # the zero-dep event seam both the container and the engine depend ON.

    # The wasm32, in-memory RDF/JS engine (purrdf P10, #846): compiles the
    # oxigraph-free gmeow-rdf kernel to wasm + an idiomatic DataFactory/Dataset/
    # Stream surface, packaged for npm/ESM as `purrdf`.



    # Authoring-packet brief assembler: gathers, for one batch of a slice's
    # terms, its definition + axioms + bounded neighbourhood + definitional closure,
    # same-slice exemplars, and cross-ontology / cross-lingual grounding, emitted as
    # canonical turtle, JSON, and human text. A leaf library both the pipeline stage
    # and the `gmeow slice brief` CLI call.
    "crates/slice-brief",
    "crates/slicetest",
    # Per-slice quality report + opinionated uplift advisor: the shared kernel
    # that reads the ontology-resident slice-quality rubric and scores a slice
    # across the quality axes, bound by both the dev CLI and the pipeline MCP.
    "crates/slice-quality",
    # Native SPARQL 1.1/1.2 parser → RDF 1.2-native query algebra AST: the
    # wasm-clean leaf that replaces the oxigraph-family `spargebra` (purrdf S5,
    # EPIC #906). Builds only on `crates/iri` + `crates/xsd`.

    # Native, RDF-1.2-first multiset SPARQL evaluator over the rdf-core DatasetView
    # in TermId space: consumes `crates/sparql-algebra` and replaces the
    # oxigraph-family `spareval` on the query path (purrdf S6, EPIC #906).

    # Native W3C SPARQL 1.1 conformance harness: runs mf: manifests
    # against gmeow-sparql-eval and diffs SPARQL Results / canonical N-Quads;
    # federated SERVICE resolves through an in-memory source (no network).

    # Native, wasm-clean serializer for the SPARQL result model → SPARQL Results
    # JSON/XML/CSV/TSV + a provenance-carrying gmeow extension: the canonical
    # results-serialization authority replacing oxigraph-family `sparesults`
    # (purrdf S9, EPIC #906). Depends only on `crates/rdf-core`.

    "crates/validate",
    # wasm32 bindings for the repo-free Tier-1 validator: client-side conformance in
    # editors / browsers / LLM clients, over the wasm-clean gmeow-validate core.
    "crates/validate-wasm",
    # Native XSD value space (parse / value-space equality+ordering / canonical
    # lexical / SPARQL numeric promotion): the zero-dep leaf that replaces the
    # oxigraph-family `oxsdatatypes` (purrdf S1, EPIC #906).

]
resolver = "2"

[workspace.dependencies]
purrdf = { git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "762388c05c27062b8535ebbf2b2f660b1107b690" }

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Blackcat-Informatics/gmeow-ontology"

[profile.dev]
# NO debuginfo. We never run a debugger here, and the DWARF in `target/debug` was the
# dominant disk hog: a built debug tree is 20–40 GB per worktree (vs ~1.4 GB release),
# so across ~10 worktrees it is hundreds of GB of symbols nothing consumes. `debug =
# false` keeps the dev profile otherwise intact — fast unoptimized compile, with
# `debug-assertions` / `overflow-checks` still on (runtime checks, not debuginfo) — so
# the test suite is unchanged; only the unused symbol tables are dropped.
debug = false
debug-assertions = true
overflow-checks = true
# Strip the residual symbol tables from the linked test binaries / bins too (panic
# backtraces lose function names — acceptable, we never debug here).
strip = "symbols"
# opt-level 3, with debug-assertions/overflow-checks kept ON (orthogonal to opt-level —
# release-grade codegen AND the overflow/assert safety net the gate depends on). This is
# a compute engine (native EL/DL/RL reasoner, forward chase, higher-order math kernels),
# so codegen quality is a first-class runtime property of our own crates, not just deps.
# MEASURED 2026-07-05, our-crate opt-3 vs opt-2 with dependencies constant:
# NO build penalty — a full workspace test rebuild is 46s@opt-3 vs 42s@opt-2
# with peak build RSS 7.6 vs 8.2 GB (opt-3 is not the slower or hungrier build). And a
# consistent runtime WIN on our reasoner (gmeow-logic `reason` bench): opt-3 faster in
# every group — el_closure/30-class 126.6ms vs 134.3ms (~5.7%), reason_all ~1.6%,
# materialization ~2.2%. Debug assertions stay on, so coverage is unchanged. (The dep-bound
# whole-bundle canonicalization tests — ~147s in purrdf, already opt-3 — are NOT moved by
# our-crate opt-level: measured 147s@opt-2 ≈ 148s@opt-3; they are handled on their own.)
opt-level = 3

[profile.test]
# `cargo nextest` / `cargo test` build with Cargo's test profile, not `dev`.
# Keep the always-on Rust gate under the same no-debuginfo contract as `dev`;
# otherwise CI silently rebuilds the workspace test binaries with full DWARF in
# `target/debug`, restoring the 20+ GB symbol tree the profile.dev cap removed.
debug = false
debug-assertions = true
overflow-checks = true
strip = "symbols"
# Same opt-3 + checks-on contract as profile.dev above (see that rationale).
opt-level = 3

# Third-party DEPENDENCIES also build at opt-3, but WITHOUT debug-assertions/overflow-
# checks — `package."*"` matches dependencies only, never our own workspace crates (which
# keep the checks-ON contract above). Our crates and deps thus share opt-3 codegen; the
# only difference is that our code additionally carries the runtime safety net. The
# conformance-gated purrdf engine (parse + id-native SHACL + SPARQL eval) is compute-bound
# in the whole-bundle tests, so opt-3 here is load-bearing.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.test.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Workspace-wide thin-LTO was gated on a measurement of peak link RSS against
# the 16 GB `ubuntu-latest` wheel runner. MEASURED 2026-06-24: a cold
# `cargo build --release` with `lto = "thin"` peaked at 7.37 GB RSS
# across the whole build tree at full 32-core local parallelism. A 4-core CI
# runner has fewer concurrent rustc compiles (lower compile-phase peak) and the
# same single-process LTO link, so its peak is ≤ that figure — well under 16 GB
# with >8 GB of headroom. Thin (not fat) LTO keeps the link-step memory bounded
# while still buying cross-crate inlining the per-crate `codegen-units = 1`
# overrides below cannot reach.
[profile.release]
lto = "thin"
# Same no-debug-symbol contract as `[profile.dev]`/`[profile.test]` above: this
# profile-level setting was previously missing here, so every `--release` build
# (wheel builds, `cargo run --release`, ad-hoc release binaries) left full
# symbol tables un-stripped — the identical disk-bloat pattern the dev/test
# comment above describes, just never closed for this profile. `debug` is
# already Cargo's release default (no DWARF); `strip` is not.
strip = "symbols"

# === First-party release tuning (#630 acceleration, Phase 1) ===
# Our own crates carry the runtime hot paths (logic chase, SHACL evaluation,
# validation lints). The default release profile splits each crate into 16
# codegen units, which forfeits cross-function inlining WITHIN the crate.
# codegen-units = 1 lets LLVM optimize each of our crates as a single unit.
#
# This is scoped to FIRST-PARTY crates via per-package overrides on purpose;
# third-party dependencies keep the default 16 units, so neither their build RAM
# nor build time regresses.
# A per-package table inherits every unspecified setting from `[profile.release]`:
# `gmeow-logic` therefore remains at release `opt-level = 3`; this override changes
# ONLY `codegen-units`. Net effect: only the crates we actually wrote get the tighter
# within-crate optimization unit.
# Workspace-wide thin-LTO IS now enabled (see `[profile.release]` above) — its
# peak link RSS was measured at 7.37 GB, well within the 16 GB wheel-runner
# budget (#828 item 3). codegen-units = 1 below still matters: it sets the
# per-crate optimization unit; thin-LTO then inlines ACROSS crate boundaries on
# top of that.
[profile.release.package.gmeow-logic]
codegen-units = 1

[profile.release.package.gmeow-logic-compile]
codegen-units = 1

[profile.release.package.gmeow-lang-form]
codegen-units = 1

[profile.release.package.gmeow-lang-bridge]
codegen-units = 1

[profile.release.package.gmeow-validate]
codegen-units = 1

[profile.release.package.gmeow-errors]
codegen-units = 1

[profile.release.package.gmeow-docs]
codegen-units = 1

[profile.release.package.gmeow-pipeline]
codegen-units = 1

[profile.release.package.gmeow-slicetest]
codegen-units = 1

[profile.release.package.gmeow-conformance]
codegen-units = 1

# The wasm cdylib (purrdf P10, #846). codegen-units = 1 for a single optimization
# unit; binary-size reduction (opt-level "z" + wasm-opt) is applied by the
# wasm-pack build in the crate's own package metadata, not the workspace release
# profile (which native wheels share).
[profile.release.package.gmeow-validate-wasm]
codegen-units = 1

# `cargo bench` (used by `make bench`) runs under the `bench` profile, which
# inherits the BASE release settings but NOT the per-package overrides above.
# Our own crates bench at the release base (opt-level 3); criterion deltas across
# phases are relative, so codegen-units fidelity to the wheel is not required here.
#
# Thin-LTO is the one base-release setting we DROP for bench (#828 item 3): bench
# deltas are relative, so wheel fidelity is explicitly not required here, and a
# cross-crate LTO link on every `make bench` would add build time for no
# measurement benefit. Release/wheel artifacts still get thin-LTO via the base.

[profile.release.package.gmeow-lsp]
codegen-units = 1

[profile.release.package.gmeow-cli-core]
codegen-units = 1

[profile.release.package.gmeow-cli]
codegen-units = 1

[profile.release.package.gmeow-dev-cli]
codegen-units = 1

[profile.release.package.gmeow-slice-quality]
codegen-units = 1

[profile.bench]
lto = false
# Same no-debug-symbol contract as `[profile.dev]`/`[profile.test]`/`[profile.release]`
# above — `bench` does not inherit `[profile.release]`'s settings (Cargo profile
# overrides are per-profile), so it needs its own `strip` closing the same gap.
strip = "symbols"
