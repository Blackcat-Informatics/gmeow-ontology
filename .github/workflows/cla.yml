name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # GITHUB_TOKEN (granted contents: write above) commits the signature
          # file to the cla-signatures branch in THIS repository. No personal
          # access token is needed for same-repository signature storage; a PAT
          # would only be required to store signatures in a separate repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://gist.github.com/paudley/55093187feb1a7cbc231e889ff6dda9e"
          # Signatures are stored off `main` so the bot never needs to push to
          # the protected default branch.
          path-to-signatures: "signatures/version1/cla.json"
          branch: "cla-signatures"
          # Maintainers and bot accounts are exempt from signing.
          allowlist: "paudley,ErinAudley,dependabot[bot],*[bot]"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
