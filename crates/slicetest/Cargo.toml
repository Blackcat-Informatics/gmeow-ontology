[package]
name = "gmeow-slicetest"
description = "GMEOW native slice-test harness (#784): discovers and executes the slice-resident declarative test-DSL specs (competency questions, structural assertions, example-conformance) under cargo-nextest, off rdflib."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
# The shared diagnostic substrate: every genuine error surface in this harness is a
# typed `gmeow_errors::Diag` (the `DiagKind` catalog in `src/error.rs`), never a bare
# string. Non-optional — a hard dependency of the harness's error contract.
gmeow-errors = { path = "../errors" }
# OXIGRAPH-FREE native SPARQL substrate (EPIC #906): parse slice Turtle through the
# canonical native codec (`gmeow_rdf::parse_dataset`) into a frozen `RdfDataset`
# (`gmeow-rdf-core`), then run the competency/structural/RDFS-closure SPARQL through
# the native `NativeSparqlEngine` (`gmeow-sparql-eval`) — no oxigraph Store anywhere.
purrdf.workspace = true
# The SHACL Finding bridge (finding_from_shacl -> shacl.<LocalName>) for the
# example-conformance executor.
gmeow-validate = { path = "../validate" }
# SHACL engine: parse_shapes + validate_dataset (IR-native) for the ExampleConformance executor.
# The canonical logic:ResultShape type contract (validate_bindings / is_satisfiable_by)
# for the cqResultShape / cqInputShape contract check. It lives in the lightweight
# gmeow-logic-compile crate, so the harness gets the canonical authority without
# pulling the full reasoning crate into its build graph.
gmeow-logic-compile = { path = "../logic-compile" }
# The native `logic:` reasoner (`reason_program_closure_dataset`) for the
# gmeow:reasoningLogic competency lane (#1294): the four math: algebra laws run as LIVE
# entailment consumers, deriving their consequents through fixed-arity n-ary predication.
# This pulls the full native reasoner into the build graph for this one lane; the
# default (reasoningNone) and reasoningRdfs lanes stay lightweight (native SPARQL / CONSTRUCT
# fixpoint), so only questions that opt into gmeow:reasoningLogic pay the native chase.
gmeow-logic = { path = "../logic" }

[dev-dependencies]
# File-driven test harness: one nextest case per discovered tests/*.ttl spec
# file, run in parallel. The headline speed win of #784 (T3).
datatest-stable = "0.3"
# The flagship acceptance-manifest cross-check names the frozen dataset and
# term types directly to walk the manifest ⋈ competency union; the same native codec
# the harness already depends on.
purrdf.workspace = true

[[test]]
name = "slice_specs"
harness = false
