[package]
name = "gmeow-music"
description = "GMEOW music-package toolchain: GTS package I/O, notation renderers, and MusicXML import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gmeow", "music", "gts", "musicxml", "notation"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
gmeow-gts = "0.9.10"
gmeow-rdf = { path = "../rdf", features = ["gts", "oxigraph"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"], optional = true }
roxmltree = "0.20"
