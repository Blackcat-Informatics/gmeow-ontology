#
# The helpers ledger: every job the workspace does has ONE implementation, its home.
# `crates/helper-census` reports every copy of a job outside its home, and
# `scripts/check-shared-helpers.py` gates the ledger (`make helpers-hygiene`).
#
# Where PurRDF already implements a job, the home is that PurRDF item, spelt
# `extern:<path>`: GMEOW reaches for the substrate rather than keeping a copy, and
# every workspace match of such a job is a copy to delete. A job is `enforced`
# once its copies reach zero; from then on a new copy fails the gate.
#
# Schema (as PurRDF's helpers-ledger.toml):
# [[job]] id, summary, home, entry_points, spec, vectors, bench, sites,
#   replaces_external, enforced, [job.forbidden] {constants, fingerprints, names},
#   [[job.variant]] {symbol, file, detector, criterion (a|b|c|layering), anchor, reason}
# [[distinct]] sanctions exactly one census group by its exact member set.

