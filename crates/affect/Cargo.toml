edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "affect", "geometry", "gram-matrix", "norm"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
purrdf = "0.3"
