[package]
name = "gmeow-cli"
description = "The consumer/wheel-only `gmeow` command-line surface (verify, validate, describe, project, export, convert, music)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "gmeow", "ontology", "validate", "verify"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gmeow"
path = "src/main.rs"

[dependencies]
gmeow-cli-core = { path = "../cli-core" }
clap = { version = "4", features = ["derive"] }
gmeow-errors = { path = "../errors" }
# The registered term namespaces and the ONE definition of a subsumption edge.
gmeow-ns = { path = "../ns" }
# Consumer-facing engines the `gmeow` commands drive. These are the runtime
# libraries a wheel ships — NEVER a repo-maintenance crate (the wheel-only razor).
gmeow-validate = { path = "../validate" }
gmeow-logic = { path = "../logic" }
gmeow-logic-compile = { path = "../logic-compile" }
gmeow-music = { path = "../music" }
# The affect-intensity geometry engine (exact-rational metric-tensor norm over a
# Gram matrix). A pure-Rust runtime rlib the wheel ships — drives `gmeow affect`.
gmeow-affect = { path = "../affect" }
# The classifier-ingestion producer: captured GoEmotions output → attributed GMEOW
# evidence, and its inverse. Drives `gmeow affect ingest-goemotions` / `recover-goemotions`.
gmeow-affect-ingest = { path = "../affect-ingest" }
# The `math:` ingestion bridges: a real R script / `.onnx` export / TSTP derivation →
# `math:` structures. Wheel-safe: a pure-Rust rlib with hand-written readers, no reasoning
# runtime, no repo checkout, and no filesystem of its own (it takes bytes and an IRI base).
# Live runtime consumer: `src/passthrough.rs::math`, wired to `gmeow math lift-r` /
# `lift-onnx` / `lift-proof` — a genuine consumer capability, never a repo-maintenance
# crate (the wheel-only razor holds).
gmeow-math-lift = { path = "../math-lift" }
gmeow-pipeline = { path = "../pipeline" }
# The CONSUMER MCP engine: `gmeow mcp`'s server, and the shared conjecture /
# candidate / authoring-brief cores the corresponding `gmeow` subcommands run
# through so the CLI and the MCP tool are one implementation. A leaf over
# gmeow-bundle-view — the repo-reading dev tools live in `gmeow-mcp-dev`, which this
# binary deliberately does NOT link.
gmeow-mcp = { path = "../mcp" }
# The GMN-1 codec + digest/witness/pack layer. A pure-Rust runtime rlib the wheel
# ships (in the tree transitively via gmeow-pipeline): its `gmn1_write`/`gmn1_read`,
# `codebook_digest`/`content_digest`/`pack_root`, and per-claim/idempotence witnesses
# are the conformance surface `gmeow gmn` exposes so an independent GMN-1
# implementation can conform against the shipped CLI, not only the gates/tests.
gmeow-lang-bridge = { path = "../lang-bridge" }
# The slice-quality scoring engine. Wheel-safe: it is already in the wheel's tree
# transitively via gmeow-pipeline, and its zero-config `score_external_slice_bytes`
# scores an external slice directory against the embedded bundle standards (a
# BundleStandards flattened from BUNDLE_GTS) with no repo checkout. Live runtime
# consumer: `src/commands.rs::slice_quality`, wired to the `gmeow slice quality`
# subcommand — a genuine consumer runtime capability, never a repo-maintenance
# crate (the wheel-only razor holds).
gmeow-slice-quality = { path = "../slice-quality" }
# The authoring-brief assembly engine. Wheel-safe pure-Rust rlib (in the tree
# transitively via gmeow-pipeline): `completeness_tiers` + `assemble_packet` build
# and render a gmeow:AuthoringPacket over a slice directory's own sources. Live
# runtime consumer: `src/commands.rs::slice_brief`, wired to `gmeow slice brief` —
# a genuine consumer capability, never a repo-maintenance crate.
gmeow-slice-brief = { path = "../slice-brief" }
# The consumer `describe` / `docs-on` term-card engine. A pure-Rust rlib (its
# `python` feature stays OFF here) — a runtime library the wheel ships, not a
# repo-maintenance crate.
gmeow-docs = { path = "../docs" }
# The RDF-1.2 / GTS substrate the consumer commands read and serialize through
# (`gts::read`, `flattened_dataset_from_bytes`, `serialize_dataset`). A published
# runtime dependency, never a repo-maintenance one.
purrdf.workspace = true
# TOCTOU/symlink-safe staging of the embedded bundle to a temp path for the
# external `gts` passthrough (atomic create + remove-on-drop).
tempfile.workspace = true
# (De)serialize the GoEmotions capture envelope for `gmeow affect ingest-goemotions`
# / `recover-goemotions`.
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
trycmd = "0.15"
predicates = "3"
serde_json.workspace = true
# The shared MEDIUM negative controls (crates/pipeline/tests/support/medium_tamper.rs)
# rewrite a real emitted bundle's CBOR items and re-derive its prev/id hash chain, so the
# breach fixtures stay valid GTS files that are wrong about exactly ONE medium claim.
ciborium = "0.2"
# The whole-DAG run the medium CLI suite drives needs a temp dir too; `tempfile` is
# already declared once below for the console session-replay lane, so it is not
# redeclared here — a second key in this table is a TOML duplicate.
# Mints an ephemeral Ed25519 signing key for the bundle_smoke.rs positive/negative
# real-crypto verify test, in-process — never a production dependency, `purrdf`
# (already a normal dependency above) is what `gmeow verify` actually uses.
ed25519-dalek = "2"
# RAII temp directories for the console session-replay lane's scratch trees. Every
# scratch path is removed on drop — including on panic and early return — so a gate run
# never leaves `gmeow-*` litter behind in the system temp dir. Hand-rolling a path under
# `std::env::temp_dir()` is banned by the repo-static guard (`check_no_unmanaged_temp_dir`
# in crates/validate/src/repo_static.rs).
tempfile.workspace = true
