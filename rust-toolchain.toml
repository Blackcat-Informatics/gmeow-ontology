# Nightly Rust is required because gmeow-logic uses `portable_simd` for targeted
# native vector kernels.
#
# Machine policy (Patrick, 2026-09-10): Rust is ALWAYS the floating stage
# nightly. RUSTUP_TOOLCHAIN=nightly is enforced machine-wide, so this file
# cannot select anything else locally; it exists so CI and other checkouts
# follow the same floating channel. Old Rust versions are used only via
# `rust-validate <ver> <cmd>` for validating specific external packages.
#
# Every `toolchain:` input in .github/workflows/ must name this exact channel;
# `the_ci_toolchain_matches_the_pinned_channel` enforces that lockstep.
[toolchain]
channel = "nightly"
components = ["rustfmt", "clippy"]
# The purrdf wasm engine (P10) + the wasm-clean SPARQL leaf compile to
# wasm32-unknown-unknown; `make wasm` builds for it. Listing it here means
# every toolchain consumer provisions the target by default.
targets = ["wasm32-unknown-unknown"]
