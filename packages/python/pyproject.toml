# The GMEOW ontology, distributed as an importable Pydantic v2 model package.
#
# The `gmeow_models/` package under this directory is GENERATED by the pipeline
# (`gmeow-dev sync --mode update --outputs generated` writes it here; it is drift-checked like every other
# generated artifact). This file only PACKAGES that generated tree into the
# `gmeow-ontology` wheel published to PyPI — reading/importing the models IS
# reading the ontology, validating data with them IS using it.
#
# Version-bump policy: the wheel version is the ontology's `owl:versionInfo`
# (`ontology/gmeow.ttl`), read by hatchling from the GENERATED
# `gmeow_models/__about__.py` (see `[tool.hatch.version]` below). To release a
# new wheel version, bump `owl:versionInfo` in `ontology/gmeow.ttl` and run
# `make check` — never hand-edit `__about__.py` or set `version` here.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmeow-ontology"
dynamic = ["version"]
description = "The GMEOW ontology as a fully-documented, validating Pydantic v2 model package (a functional documentation surface)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Blackcat Informatics® Inc.", email = "paudley@blackcatinformatics.ca" }]
keywords = ["ontology", "pydantic", "knowledge-graph", "rdf", "shacl", "validation"]
dependencies = ["pydantic>=2"]

[tool.hatch.version]
# The single source of the wheel version: the GENERATED module stamping the
# ontology's owl:versionInfo verbatim (crates/pipeline/src/stages/pydantic.rs).
path = "gmeow_models/__about__.py"

[tool.hatch.build.targets.wheel]
# The generated package tree — a FLAT single-module package (`models.py`, `_base.py`,
# `__init__.py`, `py.typed`, `__about__.py`), emitted by
# `purrdf::shapes::pydantic::emit_pydantic` — packaged verbatim.
packages = ["gmeow_models"]
