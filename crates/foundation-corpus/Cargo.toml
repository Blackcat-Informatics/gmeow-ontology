[package]
name = "gmeow-foundation-corpus"
description = "Foundation-corpus importer: reads a narrative JSONL corpus into a GMEOW RDF graph and emits foundation.ttl, a flat-vs-reified budget report, and six lossy projections (DraCor/Syuzhet/schema.org/TEI/Web-Annotation/training-manifest)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "narrative", "corpus", "knowledge-graph", "projection"]

[lib]
# rlib-only: a pure-Rust engine crate consumed by the workspace.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# Native RDF 1.2 graph building over the IR (no rdflib, no oxigraph).
purrdf.workspace = true
serde = { version = "1", features = ["derive"] }
# Keep serde_json's workspace-wide default map semantics. Ordered JSON-LD
# projection keys are emitted by a crate-local writer in projections.rs.
serde_json = "1"
# NFKD normalization for _slug (matches Python unicodedata.normalize("NFKD", ...)).
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
# Acceptance-spine parity test: whole-ontology native SHACL + native SPARQL
# over the imported foundation.ttl — OXIGRAPH-FREE. The fixture parses
# through the canonical native codec (`gmeow_rdf::parse_dataset`) into a frozen
# `RdfDataset` (`gmeow-rdf-core`), validated IR-natively via `validate_dataset_graphs`
# and queried through the native `NativeSparqlEngine` (`gmeow-sparql-eval`).
