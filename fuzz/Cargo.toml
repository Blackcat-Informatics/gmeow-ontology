# cargo-fuzz harness for the RDF, shape, and logic format frontends. Deep,
# coverage-guided fuzzing enforces the "reject malformed, never panic" contract
# across the same public parser boundaries used by production.

[package]
name = "gmeow-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

# A standalone workspace: cargo-fuzz carries its own nightly + sanitizer profile
# and must NOT join the parent workspace (whose explicit `members` list excludes
# this directory).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# Must stay byte-identical to the root [workspace.dependencies] pin (repo-static gate):
# a rev rather than a tag, because the ownership analyzer's term-namespace scoping fix is
# on purrdf main but not yet in a tagged release.
purrdf = { git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "ac2805fd790b4a8f7e9e6df64dcb87a51289d6e7" }
gmeow-logic = { path = "../crates/logic" }
gmeow-logic-compile = { path = "../crates/logic-compile" }

[[bin]]
name = "nquads"
path = "fuzz_targets/nquads.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gts"
path = "fuzz_targets/gts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shacl"
path = "fuzz_targets/shacl.rs"
