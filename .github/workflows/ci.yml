name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The quality gate is split into independent jobs that run in parallel; each
# restores the uv cache (setup-uv) so `uv sync` is fast. ruff/format live only
# in the lint job's pre-commit run (not duplicated here).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Cache pre-commit hook environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Pre-commit (format, spelling, YAML/MD/shell/actions, secrets)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Type-check (mypy)
        run: uv run mypy

      # Build the gmeow_logic PyO3 extension into the same venv so that the
      # AC2/AC4 tests in test_logic_engine.py cannot silently skip in CI.
      # VIRTUAL_ENV tells maturin develop which interpreter to target without
      # activating the shell; uv sync above has already created .venv.
      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install gmeow_logic extension (AC2 / AC4)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/logic/Cargo.toml

      - name: gmeow_logic extension imports (AC2/AC4 are now un-skippable)
        run: uv run python -c "import gmeow_logic; print('gmeow_logic at', gmeow_logic.__file__)"

      # Pure-Python tests only. Docker-backed checks run through explicit
      # gmeow/Make lanes in parallel jobs below, not through pytest. Network
      # tests are auto-skipped (conftest) unless GMEOW_RUN_NETWORK=1.
      # test_logic_engine.py and test_logic_oracle_engine_parity.py run here:
      # the gmeow_logic extension above ensures importorskip no longer skips
      # (AC2/AC4 and the oracle≡engine parity gate run in every CI build).
      - name: Unit tests (pure Python)
        run: uv run pytest -q -n auto -m "not docker and not pyoxigraph_ci"

      # Logic conformance suite: Python oracle self-consistency over the corpus.
      # Verifies that every committed golden artifact matches the live runner
      # output (materialized.nq, verdicts.json, projection outputs).
      # Principle 7 gate: oracle ≡ engine is enforced by test_logic_oracle_engine_parity.py above.
      - name: Logic conformance (oracle self-consistency, Principle 7)
        run: uv run --package gmeow-dev gmeow-dev conformance

  # The Rust format engine (crates/gts, #277) gates against the SAME frozen
  # conformance corpus (generated/gts-vectors/) as the Python oracle — both
  # implementations must fold identical bytes to identical expectations.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Nightly is required: the Nemo engine (hard dep of gmeow-logic) uses
      # unstable Rust features (macro_metavar_expr, iter_intersperse, etc.).
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format gate
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Conformance corpus + CLI tests
        run: cargo test

      - name: wasm target builds (gmeow-logic in-browser reasoner)
        run: cargo build -p gmeow-logic --target wasm32-unknown-unknown

  # The Go GTS engine (go/gts, #339) gates against the same frozen corpus and
  # exposes the same files-profile CLI surface as the Rust engine.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5
        with:
          go-version-file: go/gts/go.mod
          cache-dependency-path: go/gts/go.sum

      - name: Build (no CGO)
        working-directory: go/gts
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        working-directory: go/gts
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
          working-directory: go/gts

      - name: golangci-lint
        uses: golangci/golangci-lint-action@db582008a42febd596419635a5abc9d9815daa9c # v9.2.1
        with:
          version: v2.12.2
          working-directory: go/gts
          args: --timeout=5m

      - name: Conformance corpus + CLI tests (no CGO)
        working-directory: go/gts
        run: CGO_ENABLED=0 go test ./...

  ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Validate (syntax, lint, SHACL, DSL SHACL)
        run: uv run --package gmeow-dev gmeow-dev validate

      - name: Engine cross-check (rdflib ≡ pyoxigraph on every query)
        run: uv run --package gmeow-dev gmeow-dev crosscheck-queries

      - name: Full-registry drift gate (statements has its own Docker-backed job)
        run: uv run --package gmeow-dev gmeow-dev check-generated --skip statements

      - name: Constitution check (every principle has live enforcement)
        run: uv run --package gmeow-dev gmeow-dev constitution-check

      - name: Mappings → axioms + linksets, QID syntax
        run: uv run --package gmeow-dev gmeow-dev mappings

      - name: Wikidata QID/PID syntax gate
        run: uv run --package gmeow-dev gmeow-dev wikidata

      - name: Coverage gaps
        run: uv run --package gmeow-dev gmeow-dev coverage --gaps

      - name: Alignment direction lint
        run: uv run --package gmeow-dev gmeow-dev lint-alignment

      - name: Claim audit gates on the worked fixture (#55)
        run: uv run --package gmeow-dev gmeow-dev audit tests/fixtures/coverage/hallucination-kg.ttl

      - name: Compliance report (per-principle gate evidence)
        run: uv run --package gmeow-dev gmeow-dev compliance-report

  reason:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Pull pinned ROBOT image
        run: |
          ROBOT_IMAGE=$(uv run python -c "from gmeow_tools.config import ROBOT_IMAGE; print(ROBOT_IMAGE)")
          docker pull "$ROBOT_IMAGE"

      - name: Reason (ELK) + OWL 2 DL profile
        run: uv run --package gmeow-dev gmeow-dev reason --reasoner ELK

      - name: Reasoned-graph negative tests (verify)
        run: uv run --package gmeow-dev gmeow-dev verify --reasoner ELK

  reason-hermit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Pull pinned ROBOT image
        run: |
          ROBOT_IMAGE=$(uv run python -c "from gmeow_tools.config import ROBOT_IMAGE; print(ROBOT_IMAGE)")
          docker pull "$ROBOT_IMAGE"

      - name: Reason (HermiT) — sound + complete consistency
        run: uv run --package gmeow-dev gmeow-dev reason --reasoner hermit

  # The Docker-backed reasoning cases (HermiT inconsistency cases + the ELK
  # fixture-coherence check) as their own parallel job. The owlrl positive
  # entailment tests stay in the pure-Python `python` job; live Docker is owned
  # by the gmeow CLI so pytest never pulls or runs containers.
  reasoning-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Pull pinned ROBOT image
        run: |
          ROBOT_IMAGE=$(uv run python -c "from gmeow_tools.config import ROBOT_IMAGE; print(ROBOT_IMAGE)")
          docker pull "$ROBOT_IMAGE"

      - name: Reasoning inconsistency + fixture-coherence cases (Docker)
        run: uv run python scripts/reasoning_cases.py

  statements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Build the pinned Jena image (RDF 1.2 engine) + pull ROBOT
        run: |
          JENA_IMAGE=$(uv run python -c "from gmeow_tools.config import JENA_IMAGE; print(JENA_IMAGE)")
          docker build -t "$JENA_IMAGE" docker/jena
          ROBOT_IMAGE=$(uv run python -c "from gmeow_tools.config import ROBOT_IMAGE; print(ROBOT_IMAGE)")
          docker pull "$ROBOT_IMAGE"

      - name: RDF 1.2 round-trip / lossless / reasoning checks
        run: uv run python scripts/statements_docker_check.py

  statements-pyoxigraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: RDF 1.2 + OWL-form no-drift gate (pyoxigraph cross-check)
        run: uv run --package gmeow-dev gmeow-dev compile-statements-pyoxigraph

      - name: pyoxigraph projection / normalization / round-trip tests
        run: uv run pytest -q tests/test_pyoxigraph_crosscheck.py

  # Aggregator gate. Branch protection requires the "quality" context; this job
  # keeps that single required check stable while the work runs in parallel
  # above. `if: always()` guarantees it reports a definite success/failure
  # (never a merge-blocking "skipped") and fails if any parallel job did not.
  quality:
    needs: [lint, python, rust, go, ontology, reason, reason-hermit, reasoning-tests, statements, statements-pyoxigraph]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality jobs to have succeeded
        env:
          LINT: ${{ needs.lint.result }}
          PYTHON: ${{ needs.python.result }}
          RUST: ${{ needs.rust.result }}
          GO: ${{ needs.go.result }}
          ONTOLOGY: ${{ needs.ontology.result }}
          REASON: ${{ needs.reason.result }}
          REASON_HERMIT: ${{ needs.reason-hermit.result }}
          REASONING_TESTS: ${{ needs.reasoning-tests.result }}
          STATEMENTS: ${{ needs.statements.result }}
          STATEMENTS_PYOXIGRAPH: ${{ needs.statements-pyoxigraph.result }}
        run: |
          echo "results: lint=$LINT python=$PYTHON rust=$RUST go=$GO ontology=$ONTOLOGY reason=$REASON reason-hermit=$REASON_HERMIT reasoning-tests=$REASONING_TESTS statements=$STATEMENTS statements-pyoxigraph=$STATEMENTS_PYOXIGRAPH"
          for r in "$LINT" "$PYTHON" "$RUST" "$GO" "$ONTOLOGY" "$REASON" "$REASON_HERMIT" "$REASONING_TESTS" "$STATEMENTS" "$STATEMENTS_PYOXIGRAPH"; do
            if [ "$r" != "success" ]; then
              echo "::error::a quality job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all quality jobs succeeded"
