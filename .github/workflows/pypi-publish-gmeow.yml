name: Publish gmeow to PyPI

# Publish the ``gmeow`` ontology toolchain via PyPI trusted publishing (OIDC).
# The repository environment ``pypi-gmeow`` must be configured in the PyPI
# project before the first run.
#
# The ``gmeow`` package depends on ``gmeow-gts``, so the engine release should
# already be live on PyPI before the matching ``py/gmeow/v*`` tag is pushed.

permissions: {}

on:
  push:
    tags:
      - "py/gmeow/v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13"
      - id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${GITHUB_REF_NAME#py/gmeow/v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::Tag version ($tag_version) does not match pyproject.toml version ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - run: uv sync --all-packages --frozen

      - name: Sign gmeow.gts with the release key
        env:
          GMEOW_RELEASE_SIGNING_KEY: ${{ secrets.GMEOW_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$GMEOW_RELEASE_SIGNING_KEY" ]]; then
            echo "::error::GMEOW_RELEASE_SIGNING_KEY secret is not configured"
            exit 1
          fi
          mkdir -p /tmp/gpg
          printf '%s' "$GMEOW_RELEASE_SIGNING_KEY" > /tmp/gpg/signing-key.asc
          uv run --package gmeow-dev gmeow-dev gts compile-full \
            --sign-key /tmp/gpg/signing-key.asc \
            --public-key keys/gmeow-release-key.asc \
            -o generated/dist/gmeow.gts
          rm -f /tmp/gpg/signing-key.asc

      - name: Verify signed gmeow.gts
        run: uv run gmeow verify generated/dist/gmeow.gts

      - run: uv build --package gmeow --out-dir dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/*

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-gmeow.spdx.json
          upload-artifact: false

      - name: Upload attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attestation-gmeow
          path: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-gmeow
          path: sbom-gmeow.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-gmeow
          path: dist/*

  gts-availability:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13"
      - name: Poll for a matching gmeow-gts release on PyPI
        # gmeow-gts is an external package (repo: gmeow-gts) resolved from PyPI.
        # Verify that the version range gmeow requires is satisfiable before we
        # publish gmeow, so a fresh install of gmeow cannot fail on its engine.
        run: |
          gts_spec=$(python -c "import tomllib; deps = tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; print(next(d for d in deps if d.replace('_','-').lower().startswith('gmeow-gts')))")
          echo "gmeow requires: ${gts_spec}"
          deadline=$((SECONDS + 540))
          while true; do
            if pip install --dry-run "${gts_spec}"; then
              echo "A gmeow-gts matching '${gts_spec}' is available on PyPI"
              exit 0
            fi
            if [[ $SECONDS -ge $deadline ]]; then
              echo "::error::No gmeow-gts matching '${gts_spec}' became available within 9 minutes"
              exit 1
            fi
            echo "No gmeow-gts matching '${gts_spec}' yet; retrying in 10s"
            sleep 10
          done

  publish:
    needs: [build, gts-availability]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-gmeow
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-gmeow
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  smoke:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GMEOW_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13"
      - run: |
          pip install --upgrade pip
          python scripts/pypi_smoke.py --version "${GMEOW_VERSION}"
