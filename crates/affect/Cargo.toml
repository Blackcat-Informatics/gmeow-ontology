[package]
name = "gmeow-affect"
description = "GMEOW affect-intensity geometry: exact-rational inner-product-space over a metric Gram matrix, read from an RDF graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "affect", "geometry", "gram-matrix", "norm"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
purrdf.workspace = true
# The diagnostic substrate: the affect graph readers raise typed `Diag` kinds
# (never ad-hoc `String` errors) so a malformed affect graph carries a stable code.
gmeow-errors = { path = "../errors" }
# The reusable exact-rational inner-product-space + pure math: graph loaders. The
# affect-specific readers compute THROUGH this shared engine rather than owning it.
gmeow-math = { path = "../math" }
