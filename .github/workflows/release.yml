name: Release

# On a version tag, build the reasoned closure, all serializations, metadata,
# documentation, the CrossRef DOI deposit document, and the one self-contained
# `gmeow` binary embedding the signed bundle. `build` produces, signs, verifies and
# attests them; `publish-release` attaches the binary, the bundle, its ingestion
# companion, the checksum manifest and the binary's identity to the GitHub Release
# for the tag; `npm` proves native≡wasm parity and then publishes the npm packages.
# The DOI is minted by depositing crossref-deposit.xml to CrossRef (Blackcat
# Informatics® is the registrant) — a deliberate manual step after reviewing the
# generated deposit (see README).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Release artifacts must not inherit the repo's local `target-cpu=native` default.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zunstable-options -Clink-self-contained=+linker -Clinker-features=+lld -Ctarget-cpu=x86-64-v3"
  CARGO_ENV_CFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CXXFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CFLAGS_FORCE: "true"
  CARGO_ENV_CXXFLAGS_FORCE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nightly to match the workspace toolchain, with the wasm32 target that
      # rust-toolchain.toml declares.
      - name: Install Rust (nightly + wasm32)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05
          targets: wasm32-unknown-unknown

      # `make release` -> `make build` -> the $(RUST_READY_STAMP) prereq runs
      # `cargo nextest run --no-run --workspace`, so the release runner needs
      # cargo-nextest just like the ci.yml jobs do.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-nextest

      - name: Build release artifacts
        run: make release

      - name: Sign gmeow.gts with the release key
        env:
          GMEOW_RELEASE_SIGNING_KEY: ${{ secrets.GMEOW_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$GMEOW_RELEASE_SIGNING_KEY" ]]; then
            echo "::error::GMEOW_RELEASE_SIGNING_KEY secret is not configured"
            exit 1
          fi
          mkdir -p /tmp/gpg
          printf '%s' "$GMEOW_RELEASE_SIGNING_KEY" > /tmp/gpg/signing-key.asc
          make release-sign-gts SIGN_KEY=/tmp/gpg/signing-key.asc GTS_OUT=dist/gmeow.gts
          rm -f /tmp/gpg/signing-key.asc

      # The same forced portable recipe as `cargo xtask cli build`, embedding the SIGNED
      # bundle: the build stages dist/bin/gmeow with its receipt only after the binary,
      # run with a cleared environment, reports the digests and revision it was built
      # from.
      - name: Build the gmeow CLI
        env:
          GMEOW_BUNDLE_PATH: ${{ github.workspace }}/dist/gmeow.gts
        run: make consumer-cli-build-materialized

      - name: Verify signed gmeow.gts
        run: dist/bin/gmeow verify dist/gmeow.gts

      # Recorded before the checksum manifest so SHA256SUMS covers both files.
      - name: Record the gmeow identity and the target-named binary
        run: |
          set -euo pipefail
          dist/bin/gmeow version --verbose --format json > dist/gmeow.identity.json
          cat dist/gmeow.identity.json
          target="$(jq -er .target dist/gmeow.identity.json)"
          test "$target" = x86_64-unknown-linux-gnu
          cp dist/bin/gmeow "dist/gmeow-${target}"

      # The manifest lists exactly the four files published as Release assets, so the
      # check in publish-release covers what a consumer receives and nothing else (hidden
      # build locks under dist/ are not transferred). The bundle is regenerated from
      # canonical sources by `make release` (it is a
      # git-ignored product, not a committed input), so publish a checksum manifest that
      # pins the exact validated bytes a consumer receives.
      - name: Generate SHA-256 checksums for the release artifacts
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          # Clean up on EVERY exit path, not just the happy one: under `set -o pipefail`
          # a failure in the checksum pipeline below aborts before the `mv` consumes the
          # file, which would otherwise leave it behind. Mirrors the `trap ... EXIT`
          # idiom the Makefile's own mktemp sites use. `rm -f` after a successful `mv`
          # is a no-op, so the trap is safe on the success path too.
          trap 'rm -f "$tmp"' EXIT
          ( cd dist && sha256sum gmeow-x86_64-unknown-linux-gnu gmeow.gts gmeow.gts.ingestion.cbor gmeow.identity.json ) > "$tmp"
          mv "$tmp" dist/SHA256SUMS
          cat dist/SHA256SUMS

      # Provenance attestation over the regenerated bundle and the consumer binary that
      # embeds it — so a clean-checkout build's outputs are independently verifiable.
      - name: Attest release bundle + CLI provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.1.0
        with:
          subject-path: |
            dist/gmeow.gts
            dist/gmeow.gts.ingestion.cbor
            dist/bin/gmeow
            dist/gmeow-x86_64-unknown-linux-gnu
            dist/gmeow.identity.json

      - name: Upload published artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmeow-${{ github.ref_name }}
          path: |
            dist/
            ontology-docs/
            metadata/

      # The npm job runs on a fresh runner: hand it the producer state `make release`
      # materialized here, so its parity lanes read the same bundle and fixtures.
      - name: Upload the producer state for the npm job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmeow-producer-state-${{ github.ref_name }}
          path: |
            generated/
            .cache/gmeow-sync/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: gmeow-${{ github.ref_name }}
          path: .

      # `--verify-tag` refuses to create a tag: the Release attaches to the pushed tag
      # this run built, or fails.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ( cd dist && sha256sum --check --strict SHA256SUMS )
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "GMEOW $GITHUB_REF_NAME" \
            --notes "The self-contained gmeow binary for x86_64 Linux (glibc, x86-64-v3 CPU baseline) with the signed gmeow.gts bundle embedded; the bundle and its ingestion companion; SHA256SUMS; and gmeow.identity.json, the binary's own \`gmeow version --verbose --format json\`. Verify provenance with \`gh attestation verify gmeow-x86_64-unknown-linux-gnu --repo $GH_REPO\`." \
            dist/gmeow-x86_64-unknown-linux-gnu \
            dist/gmeow.gts \
            dist/gmeow.gts.ingestion.cbor \
            dist/SHA256SUMS \
            dist/gmeow.identity.json

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wasm32 target is REQUIRED here: `make wasm-parity` builds the five wasm engine
      # npm packages, and `make wasm` hard-fails when the target is absent in CI. Kept in
      # lockstep with the ci.yml `wasm` job, which provisions it the same way.
      - name: Install Rust (nightly + wasm32)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05
          targets: wasm32-unknown-unknown

      # node + npm are needed twice over: the native≡wasm parity witness lanes run under
      # `node --test`, and the registry upload below is an npm command. `registry-url` is
      # what makes `NODE_AUTH_TOKEN` reach npm, and it is also what enables provenance.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The SAME pin ci.yml uses; the packaging contract test enforces it.
      - name: Install wasm-bindgen-cli (pinned to the crate version)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      # DERIVED from the Makefile exactly as ci.yml derives it, never a literal.
      - name: Install binaryen (wasm-opt) — pinned release
        run: |
          set -euo pipefail
          BINARYEN_VER="$(make --no-print-directory print-binaryen-ver)"
          echo "pinned binaryen: ${BINARYEN_VER}"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VER}/binaryen-${BINARYEN_VER}-x86_64-linux.tar.gz"
          mkdir -p /tmp/binaryen
          tar xzf /tmp/binaryen.tar.gz -C /tmp/binaryen --strip-components=1
          echo "/tmp/binaryen/bin" >> "$GITHUB_PATH"
          /tmp/binaryen/bin/wasm-opt --version

      # Parity reads the bundle, fixtures and producer the build job produced; this job
      # never runs a production of its own.
      - name: Download the release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: gmeow-${{ github.ref_name }}
          path: .

      - name: Download the producer state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: gmeow-producer-state-${{ github.ref_name }}
          path: .

      - name: Restore executable modes
        run: chmod +x dist/bin/gmeow dist/bin/gmeow-dev

      # ── npm distribution ──────────────────────────────────────────────────────────
      #
      # Parity BEFORE publish, always. `make wasm-parity` BUILDS all five wasm engine npm
      # packages (release wasm + pinned wasm-bindgen bindings + `wasm-opt -Oz`) and then
      # RUNS each package's Node witness lane against the real wasm over the bundle
      # `make release` just materialized, asserting byte-identity to the native engine.
      # Publishing bytes that never passed parity is exactly the failure this ordering
      # forbids, so the step is a prerequisite of the publish rather than a sibling of it
      # — and `crates/gmeow-dev-cli/tests/npm_packaging_contract.rs` asserts the ORDERING
      # of these two steps, not merely that both exist.
      - name: Native≡wasm parity — build the engine packages and prove them (make wasm-parity)
        run: make wasm-parity

      # Fail-closed on the secret, exactly like the GPG signing step above: an unset token
      # is a NAMED hard error, never a skipped publish that leaves a tagged release with
      # no packages on the registry. `--access public` is required because every package
      # is scoped; `--provenance` uses this job's `id-token: write` permission.
      - name: Publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is not configured"
            exit 1
          fi
          # The package set is DISCOVERED from the shipped bytes (every non-private
          # package.json), never a list restated here.
          node scripts/npm-package-dirs.mjs | while read -r dir; do
            echo "== npm publish $dir =="
            ( cd "$dir" && npm publish --access public --provenance )
          done
