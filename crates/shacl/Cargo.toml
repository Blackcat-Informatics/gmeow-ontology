[package]
name = "gmeow-shacl"
description = "GMEOW SHACL validation engine core: native RDF 1.2 SHACL Core validator, gated against the SHACL conformance corpus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "shacl", "validation", "knowledge-graph", "rdf-12"]

[lib]
# rlib-only: this crate no longer ships a standalone PyO3 extension. Its bindings
# are linked into the single `gmeow_native` cdylib (crates/native, #630).
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# Native SPARQL parser (purrdf S5, #911). Used at shape-load to reject non-SELECT
# SHACL-SPARQL queries (ASK/CONSTRUCT/DESCRIBE) — they parse but cannot bind ?this
# and would panic at eval. Use SparqlParser to parse and match Query::Select.
# Replaces the oxigraph-family SPARQL parser.
gmeow-sparql-algebra = { path = "../sparql-algebra" }
# Native SPARQL engine (crates/sparql-eval): the single SparqlEngine impl over the
# frozen IR. Replaces oxigraph's SPARQL 1.1 engine for SHACL-AF sh:sparql /
# sh:SPARQLTarget evaluation (EPIC #906).
gmeow-sparql-eval = { path = "../sparql-eval" }
# sh:pattern regex constraint.
regex = "1"
# JSON Schema / OpenAPI emitter (#700). NO `preserve_order` feature: we rely on
# serde_json's default BTreeMap-backed Map so object keys serialize sorted for
# deterministic, byte-stable output.
serde_json = "1"
# Shared PyO3-free RDF 1.2 kernel and native GTS/text-codec boundary (#648).
gmeow-rdf = { path = "../rdf", features = ["gts"] }

# pyo3 native-only: cannot link into wasm. The engine core is PyO3-free; only
# py.rs uses it, so the rlib links into the future Rust compiler without Python.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }

[dev-dependencies]
gmeow-gts = "0.9.10"
proptest = "1"
# Test-only: prove `sh:prefixes gmeow:CorePrefixes` resolves through the
# production reader by parsing the REAL emitted prefix set (#1009 §2 dogfood).
# gmeow-slice does not depend on gmeow-shacl, so this introduces no cycle.
gmeow-slice = { path = "../slice" }
# Acceleration-program baselines (#630, Phase 0); light feature set, see crates/logic.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "validate"
harness = false
