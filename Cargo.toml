[workspace]
# The GTS engine moved to the gmeow-gts repo; its `gts` binary is obtained via
# `cargo install gmeow-gts`. The ontology Rust workspace keeps logic + shacl +
# validate plus shared diagnostics/RDF glue.
members = [
    # Native logic-conformance harness (#785): datatest-stable over the corpus.
    "crates/conformance",
    "crates/diagnostics",
    # Rust-owned typed documentation model built from the slice catalog (#853).
    "crates/docs",
    # Foundation-corpus importer (#364): narrative JSONL corpus → RDF graph +
    # budget report + six lossy projections; the consumer child of EPICs #358/#364.
    "crates/foundation-corpus",
    # Native IRI/URI value space (RFC-3987 IRI + RFC-3986 URI parse/validate,
    # reference resolution, syntax normalization, CURIE/prefix expansion): the
    # zero-dep leaf that replaces the oxigraph-family `oxiri` (purrdf S2, EPIC #906).
    "crates/iri",
    "crates/logic",
    # Synchronous LSP server for .ttl and .logic files + sarif CLI (#671).
    "crates/lsp",
    # The single PyO3 cdylib: all five engine crates fold into `gmeow_native` so
    # the diagnostics `Report`/`Finding` pyclasses are ONE shared type (#630).
    "crates/native",
    # DAG-driven single-pass build executor (#861): typed stages over an
    # in-memory RDF dataflow, dogfooding the build graph from gmeow: individuals.
    "crates/pipeline",
    "crates/rdf",
    # The purrdf semantic C-ABI (purrdf P8 / #842): builds libpurrdf (cdylib +
    # staticlib) via cargo-c — a SemVer-disciplined extern "C" surface over the
    # gmeow-rdf semantic layer. Statically reuses gmeow-gts so a language shim
    # links a single .so. The rich companion to the permissive libgts C-ABI.
    "crates/rdf-capi",
    "crates/rdf-core",
    # The permissive (MIT OR Apache-2.0) RDF 1.2 ingestion protocol (purrdf P6):
    # the zero-dep event seam both the container and the engine depend ON.
    "crates/rdf-events",
    # The wasm32, in-memory RDF/JS engine (purrdf P10, #846): compiles the
    # oxigraph-free gmeow-rdf kernel to wasm + an idiomatic DataFactory/Dataset/
    # Stream surface, packaged for npm/ESM as `purrdf`.
    "crates/rdf-wasm",
    "crates/shacl",
    "crates/slice",
    "crates/slicetest",
    # Native SPARQL 1.1/1.2 parser → RDF 1.2-native query algebra AST: the
    # wasm-clean leaf that replaces the oxigraph-family `spargebra` (purrdf S5,
    # EPIC #906). Builds only on `crates/iri` + `crates/xsd`.
    "crates/sparql-algebra",
    # Native, RDF-1.2-first multiset SPARQL evaluator over the rdf-core DatasetView
    # in TermId space: consumes `crates/sparql-algebra` and replaces the
    # oxigraph-family `spareval` on the query path (purrdf S6, EPIC #906).
    "crates/sparql-eval",
    # Post-run JUnit per-test duration budget gate (#1045): hard-fails the suite if
    # any default/ci-profile test exceeds the 25 s always-on budget. Std-only leaf,
    # no gmeow deps.
    "crates/test-budget",
    # Native, wasm-clean serializer for the SPARQL result model → SPARQL Results
    # JSON/XML/CSV/TSV + a provenance-carrying gmeow extension: the canonical
    # results-serialization authority replacing oxigraph-family `sparesults`
    # (purrdf S9, EPIC #906). Depends only on `crates/rdf-core`.
    "crates/sparql-results",
    "crates/validate",
    # Native XSD value space (parse / value-space equality+ordering / canonical
    # lexical / SPARQL numeric promotion): the zero-dep leaf that replaces the
    # oxigraph-family `oxsdatatypes` (purrdf S1, EPIC #906).
    "crates/xsd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Blackcat-Informatics/gmeow-ontology"

# === Build-memory taming for the `nemo` dependency tree ===
# nemo / nemo-physical are generic-heavy: LLVM monomorphizes them into a few
# enormous functions, so peak compile RAM (historically ~64 GB) is dominated by
# (a) full DWARF on debug builds feeding the link step, and (b) opt-level-3 LLVM
# working sets on release builds. These profiles cap both without slowing our own
# crates. Combined with the bundled rust-lld linker (.cargo/config.toml), this
# brings a clean nemo build back into normal-workstation territory.

[profile.dev]
# Full DWARF (the dev default `debug = 2`) is the debug-build RAM/disk hog and is
# almost never needed for a Datalog engine; line tables keep usable backtraces.
debug = "line-tables-only"
# Keep debuginfo out of the object files handed to the linker.
split-debuginfo = "unpacked"

# Workspace-wide thin-LTO (#828 item 3). `lto` is profile-global — it cannot be
# scoped away from nemo the way codegen-units is — so enabling it was gated on a
# measurement of peak link RSS against the 16 GB `ubuntu-latest` wheel runner.
# MEASURED 2026-06-24: a cold `cargo build --release -p gmeow-native` (the full
# nemo graph + the unified cdylib link) with `lto = "thin"` peaked at 7.37 GB RSS
# across the whole build tree at full 32-core local parallelism. A 4-core CI
# runner has fewer concurrent rustc compiles (lower compile-phase peak) and the
# same single-process LTO link, so its peak is ≤ that figure — well under 16 GB
# with >8 GB of headroom. Thin (not fat) LTO keeps the link-step memory bounded
# while still buying cross-crate inlining the per-crate `codegen-units = 1`
# overrides below cannot reach.
[profile.release]
lto = "thin"

# Release/wheel builds: opt-level 3 on nemo's generics is the RAM driver. opt 2
# keeps ~all the runtime speed; many small codegen units cap per-unit LLVM peak.
[profile.release.package.nemo]
opt-level = 2
codegen-units = 256

[profile.release.package.nemo-physical]
opt-level = 2
codegen-units = 256

# === First-party release tuning (#630 acceleration, Phase 1) ===
# Our own crates carry the runtime hot paths (logic chase, SHACL evaluation,
# validation lints). The default release profile splits each crate into 16
# codegen units, which forfeits cross-function inlining WITHIN the crate.
# codegen-units = 1 lets LLVM optimize each of our crates as a single unit.
#
# This is scoped to FIRST-PARTY crates via per-package overrides on purpose:
#   * nemo / nemo-physical keep their 256-unit caps (their build-RAM budget,
#     historically ~64 GB, is the reason the overrides above exist);
#   * third-party deps (oxigraph, scryer, regex, …) keep the default 16 units,
#     so neither their build RAM nor build time regresses.
# Net effect: only the crates we actually wrote get the tighter codegen, so the
# CI nemo build budget is untouched.
#
# Workspace-wide thin-LTO IS now enabled (see `[profile.release]` above) — its
# peak link RSS was measured at 7.37 GB, well within the 16 GB wheel-runner
# budget (#828 item 3). codegen-units = 1 below still matters: it sets the
# per-crate optimization unit; thin-LTO then inlines ACROSS crate boundaries on
# top of that.
[profile.release.package.gmeow-logic]
codegen-units = 1

[profile.release.package.gmeow-shacl]
codegen-units = 1

[profile.release.package.gmeow-validate]
codegen-units = 1

[profile.release.package.gmeow-rdf]
codegen-units = 1

[profile.release.package.gmeow-rdf-capi]
codegen-units = 1

[profile.release.package.gmeow-diagnostics]
codegen-units = 1

[profile.release.package.gmeow-docs]
codegen-units = 1

[profile.release.package.gmeow-native]
codegen-units = 1

[profile.release.package.gmeow-pipeline]
codegen-units = 1

[profile.release.package.gmeow-slice]
codegen-units = 1

[profile.release.package.gmeow-slicetest]
codegen-units = 1

[profile.release.package.gmeow-conformance]
codegen-units = 1

[profile.release.package.gmeow-xsd]
codegen-units = 1

[profile.release.package.gmeow-iri]
codegen-units = 1

[profile.release.package.gmeow-sparql-algebra]
codegen-units = 1

[profile.release.package.gmeow-sparql-eval]
codegen-units = 1

[profile.release.package.gmeow-sparql-results]
codegen-units = 1

# The wasm cdylib (purrdf P10, #846). codegen-units = 1 for a single optimization
# unit; binary-size reduction (opt-level "z" + wasm-opt) is applied by the
# wasm-pack build in the crate's own package metadata, not the workspace release
# profile (which native wheels share).
[profile.release.package.gmeow-rdf-wasm]
codegen-units = 1

# `cargo bench` (used by `make bench`) runs under the `bench` profile, which
# inherits the BASE release settings but NOT the per-package overrides above —
# Cargo profile overrides are per-profile and are not inherited. Mirror the two
# RAM-critical nemo caps so a local benchmark build does not rebuild nemo at the
# default opt-3 / 16-unit settings (the very thing the release caps above avoid).
# Our own crates bench at the release base (opt-level 3); criterion deltas across
# phases are relative, so codegen-units fidelity to the wheel is not required here.
#
# Thin-LTO is the one base-release setting we DROP for bench (#828 item 3): bench
# deltas are relative, so wheel fidelity is explicitly not required here, and a
# cross-crate LTO link on every `make bench` would add build time for no
# measurement benefit. Release/wheel artifacts still get thin-LTO via the base.

[profile.release.package.gmeow-lsp]
codegen-units = 1
[profile.bench]
lto = false

[profile.bench.package.nemo]
opt-level = 2
codegen-units = 256

[profile.bench.package.nemo-physical]
opt-level = 2
codegen-units = 256
