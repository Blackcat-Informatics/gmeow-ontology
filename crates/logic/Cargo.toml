[package]
name = "gmeow-logic"
description = "GMEOW reasoning engine core: world-indexed RDF 1.2 named-graph store for entailment queries, gated against the language-neutral conformance corpus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "rdf-star", "reasoning", "knowledge-graph"]

[lib]
# rlib-only: this crate no longer ships a standalone PyO3 extension. Its bindings
# are linked into the single `gmeow_native` cdylib (crates/native, #630).
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# Shared RDF 1.2 adapter boundary for loading GTS/sidecar-aware datasets into
# world-indexed logic stores (#648, supports #630/#667). The world-store now holds
# the native `MutableDataset`/`RdfDataset` IR directly — oxigraph-free (EPIC #906).
# The `python` feature exposes `gmeow_rdf::py_store::quad_to_py`, so the native RL
# closure returns live `gmeow_rdf.Quad` objects directly instead of an N-Triples
# string the Python adapter would have to re-parse (#630 seam removal). `gmeow-logic`
# is only ever built as a PyO3 extension submodule, so this adds no non-Python path.
gmeow-rdf = { path = "../rdf", features = ["gts", "python"] }
# The native SPARQL engine over `Arc<RdfDataset>` (#906): the world-store's `select`
# and the reasoned-graph governance/verify queries evaluate here, replacing the
# retired oxigraph `SparqlEvaluator`. A leaf-ish crate (rdf-core/sparql-algebra/xsd
# — no edge back to logic), so this introduces no layering cycle.
gmeow-sparql-eval = { path = "../sparql-eval" }
# First-class diagnostics model (Finding/Report) so the native verify lane builds
# its findings in Rust and hands Python a report via JSON (#695).
gmeow-diagnostics = { path = "../diagnostics" }
# SPARQL property-path algebra: the projection target for logic:PathShape (#1010).
# A leaf-ish crate (gmeow-iri/gmeow-xsd only) — no layering cycle.
gmeow-sparql-algebra = { path = "../sparql-algebra" }
# The pure, wasm-able logic compiler (#732): the runtime consumes its parse→IR→
# project surface (frontend / ir / projections) and bridges its IR into the runtime
# EvalRule via crate::lower; certify + the PyO3 compile_logic entrypoint call into it.
gmeow-logic-compile = { path = "../logic-compile" }
serde_json = "1"
blake3 = "1"
# rayon: data-parallel iterators for foundation multi-world chase (#822).
# Worlds are independent: each `chase_world` call is pure and produces its own
# Vec<FoundationQuad> with no shared mutable state.  Only invoked when
# store.worlds().len() > 1 to avoid thread-pool overhead for single-world inputs.
rayon = "1"
sha1 = "0.10"
# sha2: the canonical-rdf12 projection mints content-stable reifier IRIs as
# sha256(sort_key)[:12], matching the Python compiler byte-for-byte.
sha2 = "0.10"

# pyo3: PyO3 Python bindings. Hard dependency — HARD FAIL if absent.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }

# nemo: forward-chaining existential-rule reasoner. Hard dependency — the build
# MUST succeed with the full Nemo reasoner linked; there is no fallback.
nemo = { git = "https://github.com/knowsys/nemo", rev = "4415bc2e180adf33a7a4b98ddc41be9914b7584e" }

# tokio is required to drive Nemo's async chase API (load_string / reason /
# predicate_rows).  We match the exact feature set Nemo itself declares
# (features = ["rt", "macros"]) and rely on Cargo's existing lock resolution
# (1.52.x series) to avoid a duplicate tokio in the tree.  current_thread
# flavour is used (same as nemo-cli's #[tokio::main(flavor = "current_thread")]).
tokio = { version = "1", features = ["rt", "macros"] }

# scryer-prolog: embedded Prolog (SLD + tabling) for v4 backward goal
# resolution over the materialized EDB (facts-as-DB). Hard dependency — HARD
# FAIL if absent; no degraded fallback. Upstream master makes ring-backed
# crypto optional; default-features = false keeps the embedding surface to the
# core machine plus library(tabling)/library(iso_ext) without pulling ring.
scryer-prolog = { git = "https://github.com/mthom/scryer-prolog", branch = "master", default-features = false }

[dev-dependencies]
# Also a dev-dependency so the integration tests (tests/never_panic.rs,
# proptest_invariants.rs) can `use gmeow_logic_compile::` directly (#732).
gmeow-logic-compile = { path = "../logic-compile" }
proptest = "1"
serde_json = "1"
# S8 #914 parity harness (tests/sparql_path_parity.rs): the wasm-clean in-engine
# SPARQL property-path evaluator + the IR dataset builder, used to assert in-engine
# ≡ Scryer-lowered over the corpus path shapes. `gmeow-sparql-eval` is now a normal
# dependency (#906), so the harness reaches it through the lib graph.
gmeow-rdf-core = { path = "../rdf-core", default-features = false }
# insta: snapshot goldens for the projection back-ends + explanation prose (T8,
# #789). The `.snap` files ARE the byte-exact unit goldens (the native
# crates/conformance harness owns cross-engine corpus parity). Pinned to match
# crates/docs. `json` feature drives `assert_json_snapshot!` where used.
insta = { version = "1.48", features = ["json"] }
# Acceleration-program baselines (#630, Phase 0). Light feature set: criterion's
# plotters/rayon defaults are off so `make bench` builds fast; the cargo-bench
# stdout summary is all the baseline needs.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "probabilistic"
harness = false

[[bench]]
name = "reduct"
harness = false

[[bench]]
name = "reason"
harness = false
