[package]
name = "gmeow-gts-producer"
description = "Rust-native GTS producer for GMEOW, exposed to Python via PyO3 (#645)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "gts", "producer", "oxigraph", "pyo3"]

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
# oxigraph in-memory Store with RDF 1.2 (same version + features as crates/shacl and crates/validate).
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
# GTS format engine: the Rust-native producer builds on gmeow_gts::writer::Writer.
gmeow-gts = "0.9.0"
# Force zlib backend for flate2 so gzip output matches Python's zlib (byte-identical).
flate2 = { version = "1", features = ["zlib"], default-features = false }
# Shared RDF 1.2 kernel: GTS/oxigraph store construction and diagnostics.
gmeow-rdf = { path = "../rdf", features = ["gts", "oxigraph"] }
# PyO3 bindings for the Python extension module.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }
# CBOR serialization (used directly for header metadata and deterministic encoding parity).
ciborium = "0.2"
# Ed25519 signing for the transport-key signing path (raw 32-byte secret).
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
