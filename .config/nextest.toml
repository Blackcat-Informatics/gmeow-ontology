# language and then compare the two trees path-for-path — a full render plus a full
# cross-language walk, ~42s each standalone. That is under the default in isolation
# and over it under gate parallelism, which is the shape that reds for machine load
# rather than for a broken assertion. Same backstop as the sibling whole-tree proofs.
[[profile.default.overrides]]
filter = 'package(gmeow-docs) & test(/french_tree_shares_the_english_path_graph|translated_tree_preserves_the_no_dangling_link_invariant/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# The schema.org HowTo projection drives the prescription spine over the whole
# assembled bundle — ~101s standalone, i.e. already past the default before any
# contention. It belongs with the bundle-assembly class above.
[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & test(/the_schema_org_howto_profile_projects_the_prescription_spine/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# Assign the whole-bundle CONSUMER crates to the bounded `bundle-consumers` group above, so no
# more than a handful hold the bundle resident at once. Memory-bound concurrency, not per-test
# full-width pools, so a shared group budget is the right instrument rather than reserving each
# binary. Two exclusions avoid a threads-required conflict with the 3-slot group budget: the
# MCP `verify_graph_accepts_…_whole_bundle` case and gmeow-cli's `medium_cli` binary both already
# reserve the whole host (`threads-required = num-cpus`). The gmeow-cli side is scoped by
# `!binary(medium_cli)` rather than an enumerated binary list, because enumerating binaries missed
# real whole-bundle consumers (slice_lint_cli, slice_quality_cli, slice_quality_bundle,
# slice_brief_cli, gmn_conformance, self_sufficiency, and the console/explain cases) which then
# ran UNBOUNDED at full width and starved the already-grouped bundle-view/affect tests into
# timeouts. Excluding only the conflicting binary admits every genuine consumer; cheap gmeow-cli
# unit tests pass straight through the group (fast, releasing their slot). No global cap and no
# slow-timeout change: this is purely a membership correction.
[[profile.default.overrides]]
filter = 'package(gmeow-mcp) & !test(/verify_graph_accepts_a_normal_small_overlay_over_the_whole_bundle/) | package(gmeow-mcp-dev) | package(gmeow-mcp-core-wasm) | package(gmeow-bundle-view) | package(gmeow-lsp) | package(gmeow-affect) | (package(gmeow-cli) & !binary(medium_cli))'
test-group = "bundle-consumers"
