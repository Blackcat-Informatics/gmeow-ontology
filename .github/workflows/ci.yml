name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The quality gate is split into independent jobs that run in parallel; each
# restores the uv cache (setup-uv) so `uv sync` is fast. The lint job runs the
# canonical `make lint` target; the python job keeps a separate mypy invocation
# only to emit per-category diagnostics SARIF.
#
# Diagnostics SARIF taxonomy (#662): each job's per-category SARIF is uploaded to
# code scanning under a category == the JOB name, and its artifacts land under
# `dist/diagnostics/<category>/`. Wired here: `python` (mypy via the external-tool
# wrapper). Still a
# documented follow-up — `lint` and `rust` need the native `gmeow_diagnostics`
# extension / a Python toolchain added to those jobs, and `ontology` a dedicated
# feedback run; that work is coordinated with #666, which restructures the
# reason/statements jobs into `native` + `classic-cross-check`. Per the owner's
# rule, whichever of #662/#666 lands second renames the categories in one place.
# Uploads are fork-safe: only push + same-repo PRs hit code scanning; fork PRs
# fall back to a workflow artifact (their token lacks security-events: write).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Cache pre-commit hook environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Lint gate
        run: make lint

  python:
    runs-on: ubuntu-latest
    # security-events: write lets this job's per-category (python/mypy) SARIF
    # surface in the Security tab via upload-sarif (#662).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Type-check (mypy)
        run: uv run mypy

      # Build the gmeow_logic PyO3 extension into the same venv so that the
      # AC2/AC4 tests in test_logic_engine.py cannot silently skip in CI.
      # VIRTUAL_ENV tells maturin develop which interpreter to target without
      # activating the shell; uv sync above has already created .venv.
      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install the unified gmeow_native extension (#630)
        # One cdylib folds in rdf + diagnostics + shacl + validate + logic, so the
        # diagnostics Report/Finding pyclasses are a single shared type. The legacy
        # import names (gmeow_logic etc.) are Python shims aliasing the submodules.
        run: make native-py

      - name: gmeow_logic extension imports (AC2/AC4 are now un-skippable)
        run: uv run python -c "import gmeow_logic; print('gmeow_logic at', gmeow_logic.__file__)"

      - name: gmeow_diagnostics extension imports
        run: uv run python -c "import gmeow_diagnostics; print('gmeow_diagnostics at', gmeow_diagnostics.__file__)"

      - name: gmeow_shacl extension imports
        run: uv run python -c "import gmeow_shacl; print('gmeow_shacl at', gmeow_shacl.__file__)"

      # Per-category diagnostics (#662): re-run mypy through the external-tool
      # wrapper purely to emit a `python`-category SARIF of any type errors. The
      # AUTHORITATIVE mypy gate is the "Type-check (mypy)" step above (which runs
      # before the native exts, against the stubs); this step is continue-on-error
      # so it never gates — it only projects findings for code scanning.
      - name: mypy diagnostics SARIF (per-category python, non-gating)
        continue-on-error: true
        env:
          GMEOW_DIAGNOSTICS_DIR: dist/diagnostics/python
        run: uv run --package gmeow-dev gmeow-dev external-tool --name mypy --diagnostics-category python -- uv run mypy

      # Upload to code scanning only for push + same-repo PRs (a fork PR's token
      # lacks security-events: write). Fork PRs fall back to a workflow artifact.
      - name: Upload python diagnostics SARIF (#662)
        uses: ./.github/actions/upload-diagnostics-sarif
        with:
          sarif_file: dist/diagnostics/python/gmeow-feedback.sarif
          artifact_path: dist/diagnostics/python/
          category: python
          artifact_name: diagnostics-python

      - name: gmeow-lsp rust diagnostics SARIF (per-category rust, non-gating)
        continue-on-error: true
        run: make diagnostics-rust-sarif

      - name: Upload rust diagnostics SARIF (#671)
        uses: ./.github/actions/upload-diagnostics-sarif
        with:
          sarif_file: dist/diagnostics/rust/gmeow-feedback.sarif
          artifact_path: dist/diagnostics/rust/
          category: rust
          artifact_name: diagnostics-rust

      # Pure-Python tests only. Docker-backed checks run through explicit
      # gmeow/Make lanes in parallel jobs below, not through pytest. Network
      # tests are auto-skipped (conftest) unless GMEOW_RUN_NETWORK=1.
      # test_logic_engine.py and test_logic_oracle_engine_parity.py run here:
      # the gmeow_logic extension above ensures importorskip no longer skips
      # (AC2/AC4 and the oracle≡engine parity gate run in every CI build).
      - name: Unit tests (pure Python)
        timeout-minutes: 60
        # --durations=25 surfaces the slowest tests in every run — the migration
        # worklist for moving the pytest suite into high-performance Rust (#781/#867).
        run: make test-fast

  # Sharded across 3 runners via nextest's `--partition count:N/3` (balances the
  # test set across shards). All shards share the same Swatinem rust-cache key, so
  # each restores the same compiled `target/` and only pays an incremental recompile
  # plus ~1/3 of the test runtime. The whole-workspace gates (fmt/clippy/doctests)
  # run ONLY on shard 1 — they need not run 3×. Each shard is its own runner, so the
  # nextest `engine = { max-threads = 2 }` OOM cap is honored per shard (3×2 across
  # shards is fine — the cap is a per-process bound, not a cluster bound).
  rust:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Nightly is required: the Nemo engine (hard dep of gmeow-logic) uses
      # unstable Rust features (macro_metavar_expr, iter_intersperse, etc.).
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2
        with:
          tool: cargo-nextest

      - name: Format gate
        if: ${{ matrix.shard == 1 }}
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        if: ${{ matrix.shard == 1 }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Workspace tests (cargo-nextest) (shard ${{ matrix.shard }}/3)
        run: cargo nextest run --profile ci --partition count:${{ matrix.shard }}/3

      # 25s per-test budget gate (#1045): hard-fail if any test on this shard's slice
      # of the ci profile exceeded the always-on budget. Runs against the exact
      # junit.xml the nextest step above produced for this shard.
      - name: Test duration budget gate (25s)
        run: cargo run -q -p gmeow-test-budget -- target/nextest/ci/junit.xml

      - name: Doctests
        if: ${{ matrix.shard == 1 }}
        run: cargo test --doc

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-report-rust-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Rust Tests (shard ${{ matrix.shard }}/3)
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  # libpurrdf C-ABI (purrdf P8 / #842): build via cargo-c, verify the committed
  # purrdf.h ABI header is current (drift gate), and compile + link + run the C
  # smoke test against the real shared library.
  capi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-c
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2
        with:
          # PINNED: the committed purrdf.h ABI header is generated by cargo-c's
          # bundled cbindgen, whose enum ordering/formatting changes between
          # releases. An unpinned cargo-c would make the drift gate compare the
          # committed header against a different-versioned generation and fail.
          # Bump this in lockstep with regenerating + committing purrdf.h.
          tool: cargo-c@0.10.23

      - name: libpurrdf C-ABI gate (header drift + C smoke)
        run: make capi-check

  # === ONTOLOGY GATE LANES ===
  # The single `ontology` job was split into four parallel jobs that each pay the
  # shared setup (checkout + uv sync + the `maturin develop` gmeow_native build +
  # caches) but run a disjoint slice of the gmeow-dev gates. GitHub Actions has no
  # native step-reuse, so the setup block is copied verbatim into each job. Grouping
  # balances wall-time, isolating the two long poles (validate ~250s,
  # check-generated ~178s) into separate jobs.
  #
  # Every original gate lands in exactly one job:
  #   ontology-validate  : validate
  #   ontology-generated : maint-crosscheck, check-generated, constitution-check
  #   ontology-reason    : verify --mode native, acceptance, coverage
  #   ontology-misc      : mappings, wikidata, lint-alignment, audit, compliance-report
  ontology-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cache generator stamps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .stamps/generators
          key: generator-stamps-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/**/*.py', 'ontology/**/*.ttl', 'slices/**/*.ttl', 'slices/**/*.md', 'dsl/**/*.ttl', 'shapes/**/*.ttl', 'queries/**/*.rq', 'metadata/**/*.ttl', 'generated/**/*') }}
          restore-keys: |
            generator-stamps-${{ runner.os }}-

      - name: Cache ontology-docs build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/ontology-docs
          key: ontology-docs-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/ontology_docs.py', 'generated/dist/gmeow.gts', 'generated/references/references.md', 'generated/statements/gmeow.rdf12.ttl', 'dsl/mappings/**/*.ttl', 'slices/*/*/manifest.ttl', 'slices/*/*/docs.md', 'slices/*/*/design/*.md', 'slices/*/*/mappings/*.ttl') }}
          restore-keys: |
            ontology-docs-${{ runner.os }}-

      - name: Sync environment
        run: uv sync --all-packages --frozen

      # The validate gate now runs SHACL through the gmeow_shacl extension
      # (#578), so it must be built into this job's venv before validate.
      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # One cdylib folds in rdf + diagnostics + shacl + validate + logic (#630):
      # the logic generator (#664), SHACL/validate orchestration (#578/#579), and
      # statement codec (#667) all now live in the single gmeow_native extension.
      - name: Build + install the unified gmeow_native extension (#630)
        run: make native-py

      - name: Validate (syntax, lint, SHACL, DSL SHACL)
        run: make validate

  ontology-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cache generator stamps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .stamps/generators
          key: generator-stamps-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/**/*.py', 'ontology/**/*.ttl', 'slices/**/*.ttl', 'slices/**/*.md', 'dsl/**/*.ttl', 'shapes/**/*.ttl', 'queries/**/*.rq', 'metadata/**/*.ttl', 'generated/**/*') }}
          restore-keys: |
            generator-stamps-${{ runner.os }}-

      - name: Cache ontology-docs build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/ontology-docs
          key: ontology-docs-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/ontology_docs.py', 'generated/dist/gmeow.gts', 'generated/references/references.md', 'generated/statements/gmeow.rdf12.ttl', 'dsl/mappings/**/*.ttl', 'slices/*/*/manifest.ttl', 'slices/*/*/docs.md', 'slices/*/*/design/*.md', 'slices/*/*/mappings/*.ttl') }}
          restore-keys: |
            ontology-docs-${{ runner.os }}-

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install the unified gmeow_native extension (#630)
        run: make native-py

      - name: Engine cross-check (rdflib ≡ gmeow_rdf on every query)
        run: make maint-crosscheck

      - name: Full-registry drift gate (statements run natively via gmeow-rdf, #667)
        run: make check-generated

      - name: Constitution check (every principle has live enforcement)
        run: make constitution-check

  ontology-reason:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cache generator stamps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .stamps/generators
          key: generator-stamps-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/**/*.py', 'ontology/**/*.ttl', 'slices/**/*.ttl', 'slices/**/*.md', 'dsl/**/*.ttl', 'shapes/**/*.ttl', 'queries/**/*.rq', 'metadata/**/*.ttl', 'generated/**/*') }}
          restore-keys: |
            generator-stamps-${{ runner.os }}-

      - name: Cache ontology-docs build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/ontology-docs
          key: ontology-docs-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/ontology_docs.py', 'generated/dist/gmeow.gts', 'generated/references/references.md', 'generated/statements/gmeow.rdf12.ttl', 'dsl/mappings/**/*.ttl', 'slices/*/*/manifest.ttl', 'slices/*/*/docs.md', 'slices/*/*/design/*.md', 'slices/*/*/mappings/*.ttl') }}
          restore-keys: |
            ontology-docs-${{ runner.os }}-

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install the unified gmeow_native extension (#630)
        run: make native-py

      - name: Reasoned-graph negative tests (native verify, Docker-free — #695)
        run: make verify

      - name: Transpile acceptance — hard aggregate recall floor (#579)
        run: make acceptance

      - name: Vendored-entity coverage — hard class/predicate floors (#579)
        run: make coverage

  ontology-misc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cache generator stamps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .stamps/generators
          key: generator-stamps-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/**/*.py', 'ontology/**/*.ttl', 'slices/**/*.ttl', 'slices/**/*.md', 'dsl/**/*.ttl', 'shapes/**/*.ttl', 'queries/**/*.rq', 'metadata/**/*.ttl', 'generated/**/*') }}
          restore-keys: |
            generator-stamps-${{ runner.os }}-

      - name: Cache ontology-docs build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/ontology-docs
          key: ontology-docs-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/ontology_docs.py', 'generated/dist/gmeow.gts', 'generated/references/references.md', 'generated/statements/gmeow.rdf12.ttl', 'dsl/mappings/**/*.ttl', 'slices/*/*/manifest.ttl', 'slices/*/*/docs.md', 'slices/*/*/design/*.md', 'slices/*/*/mappings/*.ttl') }}
          restore-keys: |
            ontology-docs-${{ runner.os }}-

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install the unified gmeow_native extension (#630)
        run: make native-py

      - name: Mappings → axioms + linksets, QID syntax
        run: make mappings

      - name: Wikidata QID/PID syntax gate
        run: make wikidata

      - name: Alignment direction lint
        run: make lint-alignment

      - name: Claim audit gates on the worked fixture (#55)
        run: make audit

      - name: Compliance report (per-principle gate evidence)
        run: make compliance-report

  # === CLASSIC-CROSS-CHECK LANE (#666/#695, Principle 18) ===
  # The Java+Docker oracle lane (ELK/HermiT/ROBOT/Jena/rdflib + native-vs-ROBOT
  # cross-check) lives in its OWN workflow — `.github/workflows/classic-cross-check.yml`
  # — and runs ONLY on a schedule, via workflow_dispatch, or when the
  # `classic-cross-check` label is applied to a PR. It is never part of branch
  # protection, so Docker/Java never executes on a normal PR. The authoritative
  # gate is the native, Docker-free reasoning lane in the required `quality`
  # aggregator below.

  # purrdf wasm build + Node real-execution lane (P10, #846). The in-memory RDF/JS
  # engine MUST compile to wasm32-unknown-unknown (`make wasm` hard-fails if the
  # target is absent in CI), and the actual wasm is exercised through the public
  # RDF/JS surface in Node — including the RDF-1.2 wedge (directional literals +
  # quoted-triple terms) that no incumbent RDF/JS library carries.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Nightly to match the workspace toolchain; the wasm32 target is provisioned
      # explicitly (rust-toolchain.toml also lists it, kept in lockstep here).
      - name: Install Rust (nightly + wasm32)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build purrdf for wasm32 (engine + bindings)
        run: make wasm

      # wasm-bindgen CLI must match the pinned `wasm-bindgen` crate (=0.2.125) byte
      # for byte, or it refuses to generate the JS bindings.
      - name: Install wasm-bindgen-cli (pinned to the crate version)
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2
        with:
          tool: wasm-bindgen-cli@0.2.125

      # ubuntu-latest ships a current Node; `make wasm-pkg-test` builds the npm
      # package and runs the Node round-trip suite against the real wasm.
      - name: Build the npm package + Node real-execution round-trip
        run: make wasm-pkg-test

  # Aggregator gate. Branch protection requires the "quality" context; this job
  # keeps that single required check stable while the work runs in parallel
  # above. `if: always()` guarantees it reports a definite success/failure
  # (never a merge-blocking "skipped") and fails if any parallel job did not.
  #
  # The classic-cross-check lane is DELIBERATELY in its own workflow
  # (.github/workflows/classic-cross-check.yml), NOT in this aggregator's `needs:`
  # (#666/#695, Principle 18): the Docker/Java oracle lane is a separately-observed
  # cross-check, never a requirement to merge or to use the repo. The required
  # gate stays Docker-free and Java-free. Statements now run natively via the
  # gmeow-rdf codec inside the `ontology` job's `check-generated` (#667) — there
  # is no separate statements lane.
  quality:
    needs: [lint, python, rust, wasm, ontology-validate, ontology-generated, ontology-reason, ontology-misc]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality jobs to have succeeded
        env:
          LINT: ${{ needs.lint.result }}
          PYTHON: ${{ needs.python.result }}
          RUST: ${{ needs.rust.result }}
          WASM: ${{ needs.wasm.result }}
          ONTOLOGY_VALIDATE: ${{ needs.ontology-validate.result }}
          ONTOLOGY_GENERATED: ${{ needs.ontology-generated.result }}
          ONTOLOGY_REASON: ${{ needs.ontology-reason.result }}
          ONTOLOGY_MISC: ${{ needs.ontology-misc.result }}
        run: |
          echo "results: lint=$LINT python=$PYTHON rust=$RUST wasm=$WASM ontology-validate=$ONTOLOGY_VALIDATE ontology-generated=$ONTOLOGY_GENERATED ontology-reason=$ONTOLOGY_REASON ontology-misc=$ONTOLOGY_MISC"
          for r in "$LINT" "$PYTHON" "$RUST" "$WASM" "$ONTOLOGY_VALIDATE" "$ONTOLOGY_GENERATED" "$ONTOLOGY_REASON" "$ONTOLOGY_MISC"; do
            if [ "$r" != "success" ]; then
              echo "::error::a quality job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required quality jobs succeeded (classic-cross-check oracle lane is non-blocking by design)"
