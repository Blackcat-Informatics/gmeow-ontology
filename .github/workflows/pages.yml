name: Pages

# Publish the ontology documentation site to GitHub Pages. The site is the
# self-contained static HTML tree rendered by the source-backed Rust `sync`
# pipeline. Documentation remains external to `gmeow.gts`, but is derived from
# the same canonical source model and pipeline run rather than maintained as a
# separate copy. `ontology-docs/` is gitignored and rebuilt on every deploy.

on:
  push:
    branches: [main]
    # The site is rendered from CANONICAL SOURCES (`make maint-mdbook-smoke` owns the docs
    # sync plus rendered-book proof), not from the git-ignored generated/ product — so
    # trigger on the sources the bundle and site are projected from, the
    # renderer/CLI/pipeline, or this workflow, never on a generated/ path.
    paths:
      - slices/**
      - shapes/**
      - dsl/**
      - imports/**
      - metadata/**
      - queries/**
      - i18n/**
      - ontology/**
      - crates/docs/**
      - crates/gmeow-dev-cli/**
      - crates/pipeline/**
      - Makefile
      - .github/workflows/pages.yml
  workflow_dispatch:

# Least privilege: the build job needs only read; the deploy job needs the Pages
# OIDC token. Set per-job below so the build job cannot touch Pages.
permissions:
  contents: read

# Never cancel an in-progress Pages deploy (a half-applied deploy is worse than a
# queued one); let a newer run wait for the current publish to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Resolve pinned mdBook version
        id: mdbook-version
        run: echo "version=$(make --no-print-directory print-mdbook-ver)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned mdBook lane tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gmeow-tools/mdbook/${{ steps.mdbook-version.outputs.version }}
          key: mdbook-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mdbook-version.outputs.version }}

      # Render every documentation projection from canonical repository sources, then
      # build and audit the packed mdBook with the Makefile-pinned lane binary. This is an
      # off-gate publication proof: required PR CI and `make check` never install or invoke
      # mdBook, while Pages refuses to publish a source tree whose rendered links or four
      # interactive engines do not close.
      - name: Render and smoke-test ontology docs
        run: make maint-mdbook-smoke

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ontology-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to the Pages site
      id-token: write # verify the deploy originates from this workflow (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
