[package]
name = "gmeow-rdf"
description = "GMEOW RDF 1.2 kernel: PyO3-free model, diagnostics, store traits, and GTS/oxigraph adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "rdf-12", "gts", "oxigraph", "diagnostics"]

[lib]
path = "src/lib.rs"

[features]
default = []
gts = ["dep:ciborium", "dep:gmeow-gts"]
oxigraph = ["dep:oxigraph"]

[dependencies]
ciborium = { version = "0.2", optional = true }
gmeow-gts = { version = "0.9.0", optional = true }
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"], optional = true }

[dev-dependencies]
ciborium = "0.2"
gmeow-gts = "0.9.0"
