name: Release

# On a version tag, build the reasoned closure, all serializations, metadata,
# documentation, and the CrossRef DOI deposit document, and attach them as build
# artifacts. The DOI is minted by depositing crossref-deposit.xml to CrossRef
# (Blackcat Informatics® is the registrant) — this is a deliberate manual step
# after reviewing the generated deposit (see README).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Release artifacts must not inherit the repo's local `target-cpu=native` default.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zunstable-options -Clink-self-contained=+linker -Clinker-features=+lld -Ctarget-cpu=x86-64-v3"
  CARGO_ENV_CFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CXXFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CFLAGS_FORCE: "true"
  CARGO_ENV_CXXFLAGS_FORCE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nightly to match the workspace toolchain. The wasm32 target is REQUIRED here, not
      # optional: this job now builds and publishes the five wasm engine npm packages, and
      # `make wasm` hard-fails when the target is absent in CI. Kept in lockstep with the
      # ci.yml `wasm` job, which provisions it the same way.
      - name: Install Rust (nightly + wasm32)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown

      # `make release` -> `make build` -> the $(RUST_READY_STAMP) prereq runs
      # `cargo nextest run --no-run --workspace`, so the release runner needs
      # cargo-nextest just like the ci.yml jobs do.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest

      # node + npm are needed twice over: the native≡wasm parity witness lanes run under
      # `node --test`, and the registry upload below is an npm command. `registry-url` is what
      # makes `NODE_AUTH_TOKEN` reach npm, and it is also what enables provenance.
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # wasm-bindgen CLI must match the pinned `wasm-bindgen` crate byte for byte, or it
      # refuses to generate the JS bindings. The SAME pin ci.yml uses — the packaging
      # contract test reads ci.yml's pin and fails if these two ever diverge, so release
      # bytes can never be generated by a different toolchain than the gate proved.
      - name: Install wasm-bindgen-cli (pinned to the crate version)
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: wasm-bindgen-cli@0.2.125

      # wasm-opt (binaryen) is a REQUIRED build step: every `*-wasm-pkg` lane hard-fails
      # without it. DERIVED from the Makefile exactly as ci.yml derives it, never repeated
      # as a literal here: the two drifted once — this workflow provisioned a release
      # predating `--enable-bulk-memory-opt`, so every wasm-opt rule died on an unknown
      # option — and a second copy of the version is what made that possible.
      - name: Install binaryen (wasm-opt) — pinned release
        run: |
          set -euo pipefail
          BINARYEN_VER="$(make --no-print-directory print-binaryen-ver)"
          echo "pinned binaryen: ${BINARYEN_VER}"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VER}/binaryen-${BINARYEN_VER}-x86_64-linux.tar.gz"
          mkdir -p /tmp/binaryen
          tar xzf /tmp/binaryen.tar.gz -C /tmp/binaryen --strip-components=1
          echo "/tmp/binaryen/bin" >> "$GITHUB_PATH"
          /tmp/binaryen/bin/wasm-opt --version

      - name: Build release artifacts
        run: make release

      - name: Sign gmeow.gts with the release key
        env:
          GMEOW_RELEASE_SIGNING_KEY: ${{ secrets.GMEOW_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$GMEOW_RELEASE_SIGNING_KEY" ]]; then
            echo "::error::GMEOW_RELEASE_SIGNING_KEY secret is not configured"
            exit 1
          fi
          mkdir -p /tmp/gpg
          printf '%s' "$GMEOW_RELEASE_SIGNING_KEY" > /tmp/gpg/signing-key.asc
          make release-sign-gts SIGN_KEY=/tmp/gpg/signing-key.asc GTS_OUT=dist/gmeow.gts
          rm -f /tmp/gpg/signing-key.asc

      - name: Build the gmeow CLI
        run: make cli-build

      - name: Verify signed gmeow.gts
        run: dist/bin/gmeow verify dist/gmeow.gts

      # The bundle is regenerated from canonical sources by `make release` (it is a
      # git-ignored product, not a committed input), so publish a checksum manifest that
      # pins the exact validated bytes a consumer receives.
      - name: Generate SHA-256 checksums for the release artifacts
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          # Clean up on EVERY exit path, not just the happy one: under `set -o pipefail`
          # a failure in the checksum pipeline below aborts before the `mv` consumes the
          # file, which would otherwise leave it behind. Mirrors the `trap ... EXIT`
          # idiom the Makefile's own mktemp sites use. `rm -f` after a successful `mv`
          # is a no-op, so the trap is safe on the success path too.
          trap 'rm -f "$tmp"' EXIT
          ( cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum ) > "$tmp"
          mv "$tmp" dist/SHA256SUMS
          cat dist/SHA256SUMS

      # Provenance attestation over the regenerated bundle and the consumer binary that
      # embeds it — so a clean-checkout build's outputs are independently verifiable.
      - name: Attest release bundle + CLI provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.1.0
        with:
          subject-path: |
            dist/gmeow.gts
            dist/bin/gmeow

      # ── npm distribution ──────────────────────────────────────────────────────────
      #
      # Parity BEFORE publish, always. `make wasm-parity` BUILDS all five wasm engine npm
      # packages (release wasm + pinned wasm-bindgen bindings + `wasm-opt -Oz`) and then
      # RUNS each package's Node witness lane against the real wasm over the bundle
      # `make release` just materialized, asserting byte-identity to the native engine.
      # Publishing bytes that never passed parity is exactly the failure this ordering
      # forbids, so the step is a prerequisite of the publish rather than a sibling of it
      # — and `crates/gmeow-dev-cli/tests/npm_packaging_contract.rs` asserts the ORDERING
      # of these two steps, not merely that both exist.
      - name: Native≡wasm parity — build the engine packages and prove them (make wasm-parity)
        run: make wasm-parity

      # Fail-closed on the secret, exactly like the GPG signing step above: an unset token
      # is a NAMED hard error, never a skipped publish that leaves a tagged release with
      # no packages on the registry. `--access public` is required because every package
      # is scoped; `--provenance` composes with the `id-token: write` permission this job
      # already holds for the build-provenance attestation.
      - name: Publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is not configured"
            exit 1
          fi
          # The package set is DISCOVERED from the shipped bytes (every non-private
          # package.json), never a list restated here.
          node scripts/npm-package-dirs.mjs | while read -r dir; do
            echo "== npm publish $dir =="
            ( cd "$dir" && npm publish --access public --provenance )
          done

      - name: Upload published artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gmeow-${{ github.ref_name }}
          path: |
            dist/
            ontology-docs/
            metadata/
