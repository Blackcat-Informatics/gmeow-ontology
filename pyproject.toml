[project]
name = "gmeow"
version = "1.0.2"
description = "GMEOW ontology tooling: refine, validate, reason over, document, and publish the Global Metadata and Entity Ontology for the Web."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [{ name = "Blackcat Informatics® Inc." }]
keywords = ["ontology", "owl", "rdf", "linked-data", "gmeow", "fair"]
dependencies = [
    # NB: gmeow's own code is rdflib-free — it runs on the native
    # `purrdf.compat.rdflib` facade. `rdflib` is NOT a direct dependency. The
    # RDF/slice/SHACL Python surface (parse/canonicalize/Store/SPARQL, the
    # compat.rdflib shim, SliceCatalog, SHACL validate) is provided by the
    # external `purrdf` package (not the `gmeow_native` cdylib).
    # `rdflib` still arrives transitively via `linkml` (tracked separately); the
    # dev-only `gmeow_tools.oracles` lane pins it explicitly through the
    # `crosscheck` extra below.
    "purrdf>=0.2,<0.3",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "markdown>=3.10",
    "linkml>=1.11",
    "PyYAML>=6.0",
    "duckdb>=1.5.3",
    "jsonschema>=4.23",
    "blake3>=0.4",
    # the GTS format engine — now an external package (repo: gmeow-gts),
    # resolved from PyPI; the narrow-waist glue (gts_producer/views/db/gen)
    # consumes this published `gts` library.  0.9.0 ships the stable codec
    # (producer zstd-rsyncable path) plus the gts.verify module and
    # Signer.from_gpg_secret_key that cli/cli_dev's verify+sign commands need.
    # 0.9.2 ships gts.trig.to_trig, which write_trig() delegates to.
    # 0.9.11 makes reifies/annot rows graph-scoped (row-array `[rid,s,p,o,g?]`),
    # restoring per-named-graph RDF 1.2 reification/annotation partitioning.
    "gmeow-gts>=0.9.11,<0.10",
]

[project.optional-dependencies]
# The classic_cross_check oracle lane — the ONLY place gmeow uses upstream
# rdflib/owlrl, as the independent reasoner/engine oracle. Installed via
# `pip install '.[crosscheck]'` for `make -C validations/classic-cross-check validate`; never needed for
# normal repo use. The gmeow_tools.oracles engine_crosscheck / rl_agreement tests
# pytest.importorskip these, so the default `make check`/`make test` lanes pass
# without them.
crosscheck = [
    "rdflib>=7.6",
    "owlrl>=6.0.2",  # pure-Python OWL 2 RL oracle
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "types-jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
    "owlrl>=6.0.2",  # OWL 2 RL oracle for the classic_cross_check lane; also
    # surfaced as the `crosscheck` extra. Kept in dev so the lane runs in local dev.
    "rdflib>=7.6",  # upstream rdflib — the classic_cross_check ORACLE only; no
    # first-party module imports it. Pinned here so `make -C validations/classic-cross-check validate` has it.
    "xmlschema>=4.3",  # Crossref 5.4.0 XSD validation
    "cryptography>=44.0",  # Ed25519 keys for GTS signature/trust tests
    "mlcroissant>=1.0",  # Croissant JSON-LD validation — un-skippable (no importorskip)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmeow_tools"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
# generated/ is owned by registered generators; never lint outputs.
# validations/ holds standalone external validator-zoo lanes, deliberately
# outside the repo's normal workflow (their own Makefile/pytest, never make
# check / CI); fenced off from mainline lint exactly like generated/.
extend-exclude = ["generated", "validations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib (enforce Path over os.path strings)
    "RUF", # ruff-specific
    "D",   # pydocstyle (Google docstrings)
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # docstrings not required in tests
"slices/*/*/tests/*" = ["D"] # slice-local tests, same rule

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src", "tests"]
# Resolve the gmeow_logic and gmeow_rdf stubs (the legacy-name shim packages
# under crates/native/python/*/__init__.pyi) from the source tree, so
# type-checking does not depend on the unified `gmeow_native` extension being
# `develop`-installed first (CI runs mypy before that build). Single-cdylib
# unification folded all five extensions into crates/native.
mypy_path = ["crates/native/python"]

[[tool.mypy.overrides]]
# Third-party libraries without complete type information.
module = ["markdown.*", "owlrl.*", "linkml.*", "linkml_runtime.*", "yaml", "mlcroissant.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The untyped native-extension shims (gmeow_diagnostics) and the external
# purrdf native extension (purrdf.purrdf_native — the SHACL / slice engine the
# ontology tooling calls). Single-cdylib unification put every legacy-name shim
# package under mypy_path = crates/native/python, so mypy now *finds* the shim
# sources — but they only do a runtime `sys.modules` swap and carry no API stub;
# purrdf's compiled `purrdf_native.abi3.so` ships no submodule stub either.
# `follow_imports = skip` / ignore_missing_imports makes mypy treat them as `Any`
# (the pre-unification behaviour when they were simply not on mypy_path), so call
# sites type-check unchanged.
# gmeow_logic / gmeow_validate are deliberately NOT here: they ship typed stubs
# (__init__.pyi) beside their shims so their call sites stay checked.
# gmeow_docs carries no API stub yet; skip it like the other stub-less shims.
# gmeow_native.pipeline is the run_pipeline submodule on the unified cdylib;
# it carries no API stub yet, so skip it like the other stub-less shims.
module = [
    "gmeow_diagnostics.*",
    "gmeow_docs.*",
    "gmeow_native.*",
    "purrdf.purrdf_native",
    "purrdf.purrdf_native.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "slices"]
addopts = "-ra --strict-markers"
# Upstream self-deprecations we cannot fix from here (pinned rdflib/linkml):
# rdflib's own nquads parser and Dataset internals still touch the deprecated
# Dataset.default_context / Dataset.identifier attributes; LinkML's generators
# emit a dataclass-extension-patch deprecation. Our code uses the modern API
# (Dataset + quads, default_graph.add). Revisit on dependency upgrade.
filterwarnings = [
    "ignore:Dataset.default_context is deprecated:DeprecationWarning",
    "ignore:Dataset.identifier is deprecated:DeprecationWarning",
    # rdflib's own json-ld parser still constructs a ConjunctiveGraph internally.
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
    "ignore:The LinkML dataclass extension patch is deprecated:DeprecationWarning",
]
markers = [
    "network: tests that require network access (Wikidata/OOPS!/FOOPS!)",
    "docker: tests that require Docker (ROBOT/Jena)",
    "maintainer: heavy / kept-Python-module tests (export/okf read-library, the mapping & statement compilers, transpiler). The Rust pipeline (crates/pipeline) is the build authority and covers committed generated output via byte-parity + `check-generated`, so these are a SEPARATE maintainer-only suite — EXCLUDED from CI and EVERY required `make` target; run on demand with `make maint-test-heavy`.",
]

[tool.codespell]
# Spell-check prose and identifiers; skip generated/binary/lock artifacts, the
# vendored gUFO import, the vendored public-data fixtures (upstream content, not
# ours to correct), the i18n translation catalogs (*.po — foreign-language
# msgstr is not English prose to spell-check; their English msgids are already
# checked at the .ttl/.md source), the vendored openEHR Blutdruck.opt (an
# upstream Apache-2.0 archetype with German prose, not ours to correct), and
# the vendored openEHR TestAllDatatypes.opt (an upstream Apache-2.0 OPT with a
# vendor prose typo, not ours to correct).
# Patterns are fnmatch'd against repo-relative paths.
skip = "uv.lock,Cargo.lock,*.svg,*.png,*.po,imports,imports/*,tests/fixtures/coverage/external,tests/fixtures/coverage/external/*,ontology-docs,ontology-docs/*,validations/openehr-bloodpressure/Blutdruck.opt,validations/openehr-test-datatypes/TestAllDatatypes.opt,validations/common-logic-fol/clif2tptp/Cargo.lock"
# False positives: LOD (Linked Open Data), "derails" (valid word), domain tokens,
# opNe (the not-equal expression operator in the mapping DSL algebra),
# ser (Rust serde/ciborium module path `ciborium::ser`),
# Beng (ISO 15924 script code for Bengali), fo (ISO 639-1 Faroese),
# te (ISO 639-1 Telugu), intensional (the IDB term in logic/databases, opp. of
# extensional), intensionally (its adverb form, e.g. a set given intensionally
# by a defining condition, opp. of extensionally), intension (the
# concept-theory term — a concept's defining properties, opp. of extension),
# Hendler / Pease (author surnames in the logic references), vor (Crossref
# AccessIndicators applies_to value = "version of record"), notin (the VS Code
# `notIn` language-configuration key in editors/vscode), fof (the TPTP
# `fof(...)` first-order-formula keyword in the SZS fixtures), lits (the
# `lits` parameter name = "literals" in the language-tag bindings), ot (the
# object-term local in the CLIF writer triple codec, parallel to st/pt).
ignore-words-list = "lod,derails,gmeow,nmo,gufo,nd,opne,ned,intoto,crate,ser,fpr,beng,fo,te,intensional,intensionally,intension,hendler,pease,vor,ans,notin,fof,ehr,sme,ore,lits,ot"
