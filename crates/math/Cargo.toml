[package]
name = "gmeow-math"
description = "GMEOW reusable exact-rational geometry: an inner-product-space over a metric Gram matrix plus the pure math: graph loaders, computed OUTSIDE the reasoned core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "geometry", "gram-matrix", "norm", "inner-product"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
purrdf.workspace = true
# The diagnostic substrate: every exact-rational / graph-loading failure is a
# typed `Diag` under the `math.*` code namespace, not a bare string. Non-optional —
# the substrate is the standard error surface for this grounding crate.
gmeow-errors = { path = "../errors" }
# The single mandatory GTS authorship profile: `index_turtle` normalizes through
# the GTS snapshot codec, so its bytes are production GTS bytes and must carry
# `zstd-rsyncable` @ L12 like every other GMEOW-authored frame.
gmeow-gts-profile = { path = "../gts-profile" }
# gmeow-math-lift: the executable R / ONNX / proof ingestion front-ends. The three
# lift producers in `src/producers.rs` call the SAME `r::lift` / `onnx::lift` /
# `proof::lift` entrypoints the shipped CLI calls, over the crate's real committed
# fixtures embedded at COMPILE TIME (`include_str!` / `include_bytes!`), so the
# in-bundle producer stays pure (no disk read, no arguments, no clock) while the
# bundle carries the output of the ACTUAL parsers rather than a hand-typed
# imitation of them. One implementation, two byte sources. Acyclic: math-lift
# depends on purrdf + gmeow-errors + gmeow-term-arena and never on gmeow-math.
gmeow-math-lift = { path = "../math-lift" }
