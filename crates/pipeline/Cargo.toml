[package]
name = "gmeow-pipeline"
description = "GMEOW DAG-driven single-pass build executor: typed stages over an in-memory RDF dataflow, dogfooding the build graph from gmeow: slice individuals (#861)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pipeline", "dag", "build", "rdf", "gmeow"]

[lib]
# rlib-only: this crate does NOT ship a standalone PyO3 extension. Its bindings
# (added in #861 P6) are linked into the single `gmeow_native` cdylib
# (crates/native, #630). The `python` feature gates `src/py.rs`.
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
# Builds the PyO3 binding (`src/py.rs`) exposing `run_pipeline` to Python,
# linked into the unified `gmeow_native` cdylib (#861 P6). Without it the crate
# is a pure rlib (no pyo3).
python = ["dep:pyo3"]

[dependencies]
# The RDF 1.2 kernel: stages exchange an in-memory dataset / bundle and stamp
# provenance through this crate; the content store backs the pipeline cache.
gmeow-rdf = { path = "../rdf", features = ["oxigraph", "gts"] }
# The export leaf reads the folded gts Graph model directly and reuses the
# gmeow-gts N-Quads/TriG serializers (the lossless dataset forms) + the columnar
# blob model for the parquet leaf (#861 P4). Same pin as gmeow-rdf links.
gmeow-gts = "0.9.5"
# The `reason` stage wires the native EL/DL reasoner + artifact builders directly
# (gmeow_logic::reason::reason_all + reason::artifacts) — no Python, no PyO3.
gmeow-logic = { path = "../logic" }
# The structured snapshot's verify-attestation graph reads the native verify
# lane's `Report` findings (severity / `verify.<stem>` codes) to build the
# `gmeow:graph/verify` attestation (#861 P6, two-pass like build_snapshot_bytes).
gmeow-diagnostics = { path = "../diagnostics" }
# The statement feedback surface folds the native statement-stage output through
# the Rust invariant and lossless checks so Python remains only an interface.
gmeow-validate = { path = "../validate" }
# The `mappings` stage wires the slice-resident SSSOM + FnO emitters directly
# (gmeow_slice::emit_sssom_sets / emit_fno) — the SSSOM/FnO halves are Rust.
gmeow-slice = { path = "../slice" }
# The `docs_render` stage wires the typed documentation model + RDF projection
# (gmeow_docs::DocsModel::discover / to_gmeow_rdf / render_site) — no port (#853).
gmeow-docs = { path = "../docs" }
# The `json_schema` export leaf compiles the SHACL shape union into JSON Schema +
# OpenAPI natively (gmeow_shacl::shape_union::load_shapes + json_schema::compile),
# replacing the Python LinkML JSON-Schema/OpenAPI generators (#700).
gmeow-shacl = { path = "../shacl" }
# The DAG loader reads the dogfooded build graph from the same lenient oxigraph
# Turtle parser the slice crate uses (accepts @x-gmeow-* language tags). Mirror
# the slice/rdf crates' exact oxigraph build for a clean lockfile resolution.
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
# Stage DAG: cycle detection (tarjan_scc) + topological levelling. `petgraph` is
# a published registry crate (no `path`), so it is an external boundary, not a
# first-party layering edge — the crate-layering gate (#820 S0) is unaffected.
petgraph = { version = "0.8", default-features = false }
# Level-parallel scheduling: independent stages within a topological level run
# concurrently; only Reason stages serialize under the process-wide ENGINE_LOCK.
rayon = "1"
sha2 = "0.10"
# SHA-1 only for the content-addressed statement reifier mint (mirrors the
# Python `mint_reifier`); never for security.
sha1 = "0.10"
# blake3 for the eval span verifier's current-content digest (mirrors the
# Python `_current_digest`); the corpus digests pin the scored source version.
blake3 = "1"
# The parquet leaf (#861 P4) writes the 5 dictionary-encoded gts_db tables as
# columnar Parquet. arrow builds the in-memory record batches; parquet serializes
# them. Deterministic: fixed row order, no writer timestamps in metadata.
arrow-array = "56"
arrow-schema = "56"
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }
serde = { version = "1", features = ["derive"] }
# Stage products are serialized to bytes for the content-addressed cache.
serde_json = "1"
# YAML-LD-star emission: deterministic, anchor-free YAML from the JSON-LD-star lead.
serde_yaml = "0.9"
# pyo3 is pulled ONLY by the `python` feature (maturin builds the unified
# `gmeow_native` cdylib). Same version/abi3 as the other engine crates.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"], optional = true }

[dev-dependencies]
tempfile = "3"
# The parquet leaf's round-trip test re-reads written bytes through the parquet
# reader, which takes a `ChunkReader` — `bytes::Bytes` is the simplest in-memory
# one (already in the tree as a parquet dependency).
bytes = "1"
