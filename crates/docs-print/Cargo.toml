[package]
name = "docs-print"
description = "Deterministic Typst-source renderer and byte-reproducible in-memory PDF compiler for the GMEOW print documentation projection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["documentation", "ontology", "typst", "pdf", "gmeow"]

[lib]
# rlib-only: a pure-Rust engine crate consumed by the workspace.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
gmeow-docs = { path = "../docs" }
gmeow-errors = { path = "../errors" }
# The embedded Typst stack, pinned EXACTLY. typst / typst-pdf / typst-assets are
# published in lockstep on one version line, so the identical `=0.13.1` pin on
# all three is a mutually-compatible set by construction (typst-pdf and
# typst-assets both depend on `typst =0.13.1` internally). Pinning exactly keeps
# the PDF byte-reproducible: a patch bump to any of the three could perturb the
# rendered bytes or the embedded-font set.
#
# The 0.13 line is pinned deliberately: the rendered PDF and embedded-font set
# are committed byte-for-byte outputs, so dependency drift requires an explicit
# golden review rather than an incidental patch update.
typst = "=0.13.1"
typst-pdf = "=0.13.1"
typst-assets = { version = "=0.13.1", features = ["fonts"] }
# BLAKE3 for the embedded-font-set digest; the resulting digest is pinned by the
# golden test, so compatible 1.x implementation updates do not need a manifest pin.
blake3 = "1"

[dev-dependencies]
insta = "1.48"
