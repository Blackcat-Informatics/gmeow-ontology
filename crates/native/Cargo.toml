# The single unified PyO3 extension. Folding all five engine crates into ONE
# cdylib makes the diagnostics `Report`/`Finding` pyclasses a single shared type
# across the whole extension: a `Report` built by the validate orchestration is
# accepted by every diagnostics method, closing the cross-cdylib
# `TypeError: 'Report' object is not an instance of 'Report'` that separate
# cdylibs caused (#630).

[package]
name = "gmeow-native"
description = "GMEOW unified PyO3 extension: rdf + diagnostics + shacl + validate + logic folded into one cdylib (#630)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pyo3", "rdf", "shacl", "validation", "reasoning"]

[lib]
crate-type = ["cdylib"]
name = "gmeow_native"
path = "src/lib.rs"

[dependencies]
# The five engine crates. `gmeow-rdf` needs its `python` feature so its `register`
# fn (and the py_store oxigraph surface) is compiled in; the other crates already
# carry pyo3 unconditionally.
gmeow-rdf = { path = "../rdf", features = ["python", "gts", "oxigraph"] }
gmeow-diagnostics = { path = "../diagnostics" }
# `gmeow-docs` ships the typed documentation model + its register fn (#853);
# it consumes the pure-Rust slice catalog (no `python` feature needed).
gmeow-docs = { path = "../docs" }
gmeow-shacl = { path = "../shacl" }
gmeow-validate = { path = "../validate" }
gmeow-logic = { path = "../logic" }
# `gmeow-slice` needs its `python` feature so its `register` fn (the SliceCatalog
# discovery + ownership analyzer surface) is compiled in (#820 S8).
gmeow-slice = { path = "../slice", features = ["python"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }
