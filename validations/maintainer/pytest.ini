#
# Suite-local pytest config for the maintainer/OKF lane. Its presence makes THIS
# directory pytest's rootdir, so the repository-root conftest.py is NOT loaded —
# this lane is self-contained and imports gmeow_tools directly from the installed
# package.
[pytest]
minversion = 8.0
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    ignore:Dataset.default_context is deprecated:DeprecationWarning
    ignore:Dataset.identifier is deprecated:DeprecationWarning
    ignore:ConjunctiveGraph is deprecated:DeprecationWarning
    ignore:The LinkML dataclass extension patch is deprecated:DeprecationWarning
markers =
    network: tests that require network access
    docker: tests that require Docker
    maintainer: heavy / kept-Python-module tests
    okf: tests that require an OKF-capable gts binary
