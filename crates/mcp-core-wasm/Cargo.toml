[package]
name = "gmeow-mcp-core-wasm"
description = "wasm32 bindings for the LEAN core of the GMEOW consumer MCP engine: the whole 38-tool / 5-resource JSON-RPC surface, with the reasoning segment demand-loaded on first use rather than carried in the first-load image"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "mcp", "agent", "wasm", "knowledge-graph"]

[lib]
# cdylib for the wasm-bindgen build (the shipped npm/ESM artifact); rlib so the thin
# binding logic still compiles + unit-tests on the native workspace gate
# (`cargo nextest` / clippy --all-targets) — the rlib half is what the deferral witness
# (`tests/witness_core.rs`) calls, so the attestation is produced by the very functions
# the browser exports rather than by a re-implementation of them.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# The consumer MCP engine with the reasoning segment selected OUT
# (`default-features = false`): the DL reasoner (`gmeow-logic`) and the rubric kernel over
# it (`gmeow-slice-quality`) are not linked into this image at all — that omission IS the
# first-load byte win this crate exists for. The tool surface is NOT reduced: all 38 tools
# are advertised and dispatchable, and the 15 reasoning-segment tools answer with the
# typed `mcp.segment-not-loaded` signal the host re-dispatches against `gmeow-mcp-wasm`.
# (The counts are gated against `gmeow_mcp`'s own constants by
# `the_shipped_prose_states_the_derived_tool_counts`; a TOML comment cannot read them.)
gmeow-mcp = { path = "../mcp", default-features = false, features = ["core"] }
# EXACTLY pinned ONCE, in `[workspace.dependencies]`: the `wasm-bindgen` CLI that
# generates the JS bindings refuses to run unless it matches the library version
# byte-for-byte, and this image's glue must stay loadable by the same CLI install the
# reasoning-segment image's does. `make mcp-core-wasm-pkg` and the CI Node lane install
# the `wasm-bindgen-cli` matching the workspace version.
wasm-bindgen.workspace = true

[dev-dependencies]
gmeow-bundle-import = { path = "../bundle-import" }
# The deferral witness parses the JSON-RPC response frame back to assert the ROUTING
# fields (`code` / `tool` / `segment`) rather than matching prose, so a signal that lost
# its structure fails as a contract defect rather than passing on a substring.
serde_json.workspace = true
