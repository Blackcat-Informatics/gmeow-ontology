[profile.default]
# Always-on per-test budget: every test on this profile must complete under
# 25 s real wall time, enforced AFTER the run by the JUnit duration gate
# (`cargo run -p gmeow-test-budget`, wired into `make rust-test`/`rust-gate`). Tests
# that are still over budget are carved out of this profile via `default-filter`
# below and run on the `maint-heavy` profile instead — so the gate has NO
# legitimate >25 s test to allowlist. Correctness failures stay in the normal
# profile even when they were discovered during maint-heavy evaluation.
# The slow-timeout stays at the original 120 s terminate cliff purely as a
# runaway/hang backstop; the 25 s POLICY is the JUnit gate, not this timeout.
#
# `default-filter` is the set of tests run when no filter is given on the CLI. Keep
# this expression as the single source of truth for what the always-on gate excludes;
# `maint-heavy` re-includes everything. Each excluded group MUST be justified here and
# in AGENTS.md's test-budget section (the off-gate allowlist). The post-run JUnit
# budget gate verifies nothing >25 s slipped THROUGH this filter onto the gate.
#
# Off-gate groups (reevaluated 2026-06-29 via `make maint-rust-heavy`).
# Most former exclusions now pass well under the 25 s policy and are back on the
# default/ci profile. The remaining exclusions are still over budget:
