[package]
name = "gmeow-validate"
description = "GMEOW validation in Rust: the wasm-clean repo-free Tier-1 conformance core (SHACL + OntoUML disciplines over a gmeow.gts bundle) plus the native slice-authoring dev gate (rlib)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "validation", "lint", "knowledge-graph", "rdf-12"]

[lib]
# rlib-only: a pure-Rust engine crate consumed by the workspace.
crate-type = ["rlib"]
path = "src/lib.rs"

# Dependencies of the wasm-clean Tier-1 core (compiled on EVERY target, including
# wasm32-unknown-unknown). Only what data_validate/store/gufo/findings/report_bridge
# and the JSON entry actually need — every one is oxigraph-free, PyO3-free, and
# thread-free.
[dependencies]
# Report JSON export at the wasm/CLI boundary; timing/result serde on the native side.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHACL engine: the Rust-native validation reuses parsed shapes and validates the
# frozen dataset directly. The engine core is PyO3-free; only the py modules touch PyO3.
purrdf.workspace = true
# Shared RDF 1.2 kernel: native GTS/text-codec ingress and diagnostics. The `gts`
# feature is oxigraph-free and already cross-compiles to wasm32 (the purrdf engine).
# Canonical Finding/Report model. Its surface is pure serde, so it is wasm-clean.
gmeow-ns = { path = "../ns" }
gmeow-errors = { path = "../errors" }
# GTS CONTAINER engine: the Tier-1 shape-archive read walks `Graph::blob_meta`/`blobs`.
# CONTAINER symbols only (no codec feature) — the same wasm-clean surface gmeow-rdf's
# `gts` feature builds; pure-Rust structured-zstd, no C/duckdb/zstd-sys linkage.
# CBOR reader for the bundle blob metadata: `Graph::blob_meta` values are
# `ciborium::value::Value`, read to resolve a blob by its `rep` label.
ciborium = "0.2"

# Native-only dependencies: the slice-authoring dev gate, repo-lint guards, DSL
# phases, and the Tier-2 `--deep` reasoner path. None of these cross-compile to wasm
# (gmeow-logic is the full reasoning stack, rayon needs threads, ureq needs sockets),
# so they are excluded from the wasm target entirely — the modules that use them are
# `#[cfg(not(target_arch = "wasm32"))]` in lib.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Regex engine for the native-only lint / constitution / repo-static gate modules
# (version pin kept in lockstep with shacl).
regex = "1"
# Cargo manifest parsing for the native crate-layering DAG gate.
toml = "0.8"
# JSON Schema draft-2020-12 instance validator. default-features off drops the
# network/file remote-$ref resolvers (reqwest/rustls/resolve-http): the GMEOW JSON
# Schema is fully self-contained ($defs-local refs only), so we never fetch remote
# schemas. No optional resolver feature is enabled — a capability cfg would be
# optionality, not compliance.
jsonschema = { version = "0.46", default-features = false }
# YAML instance parsing: serde_yaml deserializes straight into serde_json::Value,
# so a YAML instance validates identically to its JSON twin.
serde_yaml = "0.9"
# SHA-256 for content-addressed validation cache keys (parity with Python hashlib).
sha2 = "0.10"
# Data parallelism: the per-example SHACL pass (the dominant cost of `validate`) is
# embarrassingly parallel across the ~100 slice examples, and the three DSL SHACL
# phases are independent — both fan out over rayon against the shared read-only store.
rayon = "1"
# Blocking HTTP client for the maintainer-only Wikidata live existence lane.
ureq = "3"
# Native slice catalog + S6a semantic Merkle cache: the whole-ontology merged-SHACL
# source key is the path-independent, comment-insensitive product key over the slice
# composition. gmeow-slice depends only on gmeow-rdf, keeping the crate DAG acyclic.
# Dependency-free license-token policy classifier (RUST-FIRST single source of truth):
# the `license_policy_for` pyfunction surfaces it to the Python `LinkPolicy` shim.
gmeow-license = { path = "../license" }
# Native reasoning engine: the `validate --deep` semantic pass reasons over the bundle
# (`gmeow_logic::reason::reason_all`) and reads the shared logic:ReasoningResult.
# The edge remains acyclic because logic does not depend on validate.
gmeow-logic = { path = "../logic" }
# The canonical validation-shape IR + the shape-subsumption enforcement
# pre-order (equivalent/subsumes/residue_normal_form): the equivalence ORACLE
# (`shape_oracle`) inverts the SHACL emitter over this IR and decides equivalence via
# the subsumption lattice. Comparison-only; never wired into a slices/** writer.
gmeow-logic-compile = { path = "../logic-compile" }
# The reusable exact-rational geometry engine: the native math: dimension gate
# reuses its exact `Rational` (the single source of truth, no duplicate rational
# type), and the math:Norm conformance gate computes a norm/distance THROUGH its
# `InnerProductSpace`. Native-only: the lint module is `cfg(not(wasm32))`.
gmeow-math = { path = "../math" }
# Structured, subscriber-controlled sink for the native cache's lenient
# missing-input notice — telemetry with no reporter in scope, never a gate.
tracing = "0.1"
# Read-only XML DOM parser for the authoring-integrity catalog gate: the generated
# OASIS `catalog-v001.xml` is parsed properly (comments/CDATA/entities handled),
# never by a naive substring scan. Pure-Rust, parse-only (pin matches logic-compile).
roxmltree = "0.20"

[dev-dependencies]
# Native RDF 1.2 dataset used directly by integration tests that query generated Turtle.
purrdf.workspace = true
# The classifier-ingestion producers under test: the conformance twin runs each
# real captured classifier output through the unmodified whole-ontology SHACL
# corpus and asserts the blind round-trip end-to-end.
gmeow-affect-ingest = { path = "../affect-ingest" }
# JSON deserialization of the captured classifier fixtures the producer ingests.
serde_json = "1"
# Ed25519 signing material for deterministic GTS signature tests (#646).
ed25519-dalek = "2"
# Acceleration-program baselines (#630, Phase 0); light feature set, see crates/logic.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Hermetic temp slices trees for the S6a merged-SHACL Merkle key integration test.
tempfile = "3"
# Snapshot goldens for the constitution parity regression test (#939 Gap 4).
insta = { version = "1.48", features = ["json"] }
# Parameterized #[case] rows for the conformance_*.rs SHACL twins (#1051). rstest
# subsumes test-case; test-case is deliberately NOT a dependency.
rstest = "0.26"
# Deterministic retired-instruction backend for the whole-ontology-union conformance
# cost-partition bench. Pin MUST equal crates/logic/Cargo.toml (the out-of-tree
# iai-callgrind-runner is version-locked to it). MAINT-ONLY: needs valgrind + the
# runner, invoked via `make maint-bench-instructions`, never `make check`.
iai-callgrind = "0.16.1"
# Deterministic allocation accounting (bytes / count / peak-live) for the same
# cost-partition bench — the always-available half that needs no valgrind. Leaf
# bench dep only; the CountingAllocator never reaches the shipped gmeow CLI.
gmeow-cost-measure = { path = "../cost-measure" }

[[bench]]
name = "lint"
harness = false

[[bench]]
name = "validate_all"
harness = false

# Whole-ontology-union conformance cost-partition (setup S vs per-twin scan V),
# grounding the off-gate decision in deterministic instructions + allocations rather
# than flaky wall time. Both MAINT-ONLY (`make maint-bench-instructions`).
[[bench]]
name = "conformance_union_cost_iai"
harness = false

[[bench]]
name = "conformance_union_cost_alloc"
harness = false
