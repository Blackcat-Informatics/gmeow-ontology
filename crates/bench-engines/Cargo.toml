[package]
name = "gmeow-bench-engines"
description = "Engine/reference benchmark harness: drives every committed mini bench case through the native engine and its applicable live or captured reference. Emits deterministic cost/agreement evidence plus a report-only wall/RSS advisory table."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The engine-vs-engine benchmark harness binary. `src/main.rs` installs the
# counting `#[global_allocator]`; that process-global install is confined to THIS
# leaf binary and reaches NO other crate (verified by `cargo tree -p gmeow-cli -i
# gmeow-cost-measure` returning nothing).
[[bin]]
name = "bench-engines"
path = "src/main.rs"

[dependencies]
# The committed bench-corpus loader (bench_corpus::load_bench_corpora{,_from}),
# the shared divergence-ledger emitters (divergence::{emit_divergence_nq,
# agreement_tally}), and the typed error kinds the harness surfaces. Reused rather
# than re-implemented — the SAME emitters the conformance pipeline stage drives.
# NOTE: gmeow-conformance itself does NOT depend on gmeow-cost-measure, so pulling
# it in here does not create a conformance→cost-measure edge; the CLI's transitive
# path (cli→pipeline→conformance) therefore never reaches the counting allocator.
gmeow-conformance = { path = "../conformance" }
# The native logic engine seams the harness drives each engine through:
# cost::run_native_forward,
# materialize::materialize_routed and dispatch::dispatch_query, plus the query IR,
# store, seam, provenance, result,
# / reason (divergence-ledger) surfaces.
gmeow-logic = { path = "../logic" }
# The typed diagnostic substrate the harness raises hard-fail conditions on (a
# missing/undrivable engine is an error, never a silent skip).
gmeow-errors = { path = "../errors" }
# Harness-scoped deterministic allocation measurement (bytes / count / peak-live).
# THIS binary is the ONLY installer of its counting `#[global_allocator]` (a single
# `static` in `src/main.rs`); as a dedicated leaf crate nothing depends on it, so
# the allocator type never reaches the shipped `gmeow` CLI, directly or transitively.
gmeow-cost-measure = { path = "../cost-measure" }
# Native RDF text codecs: parse the world-scoped EDB N-Quads into the frozen
# `RdfDataset` IR (`purrdf::parse_dataset`) the forward/existential seams consume.
purrdf.workspace = true
# Canonical JSON (sorted BTreeMap keys — NO `preserve_order`) for the deterministic
# cost/agreement artifact: identical inputs ⇒ identical bytes, the drift-gate form.
serde_json.workspace = true
# blake3 fingerprints of canonically-sorted engine result rows / answer bindings,
# the stable verdict-agreement tokens the divergence ledger folds.
blake3.workspace = true
# The R1 pool-quiesce discipline: the MEASURED native run is `install`ed on a
# single-thread Rayon pool so the engine's parallel work executes on the measuring
# thread. That makes the thread-local allocation counters (bytes / count / peak-live)
# CAPTURE every engine allocation and be byte-deterministic — no stolen-closure
# pollution. The determinism doctrine guarantees the 1-thread pool changes no emitted
# byte or count (commit order is sorted), only the completeness of the MEASUREMENT.
rayon = "1"

[dev-dependencies]
# RAII temp directories/files for tests. Every scratch path a test creates is
# removed on drop — including on panic and early return — so a gate run never
# leaves `gmeow-*` litter behind in the system temp dir. Hand-rolling a path
# under `std::env::temp_dir()` is banned by the repo-static guard
# (`check_no_unmanaged_temp_dir` in crates/validate/src/repo_static.rs).
tempfile = "3"
