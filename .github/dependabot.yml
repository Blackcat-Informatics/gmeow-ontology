# Dependabot version updates. Security updates are enabled separately in the
# repository security settings. The pinned Java toolchain (ROBOT, WIDOCO, Jena)
# is referenced as Docker images in src/gmeow_tools/config.py rather than via a
# Dockerfile, so those are bumped manually when a new pinned tag is adopted.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
