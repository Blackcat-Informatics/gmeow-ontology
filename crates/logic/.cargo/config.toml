# getrandom 0.3 on wasm32-unknown-unknown requires an explicit backend cfg flag.
# Without this the build fails with "no wasm backend" at link time.
# "wasm_js" delegates to the browser's crypto.getRandomValues() — the correct
# and standard backend for the wasm32-unknown-unknown target.
# This is a portable, required config that belongs in VCS (not machine-specific).
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
