[package]
name = "gmeow-cost-measure"
description = "Harness-scoped deterministic allocation-measurement allocator + measure() helper — bench/maint-harness ONLY, NEVER linked into the shipped gmeow CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["allocator", "benchmark", "determinism", "measurement", "gmeow"]

[lib]
# Pure, dependency-free std-only rlib. Provides the allocator TYPE + measure()
# helper; the `#[global_allocator]` install is done by each consuming BINARY, so
# merely depending on this crate installs NOTHING. Never a dependency of gmeow-cli.
crate-type = ["rlib"]
path = "src/lib.rs"
