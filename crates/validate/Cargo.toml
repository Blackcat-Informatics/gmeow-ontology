[package]
name = "gmeow-validate"
description = "GMEOW validation-path lints in Rust: oxigraph-backed Turtle syntax check and the Principle 5 owl:sameAs ban, exposed to Python via PyO3 (#579)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "validation", "lint", "knowledge-graph", "oxigraph"]

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
# oxigraph in-memory Store with RDF 1.2 (same version + features as crates/shacl):
# default-features off drops the rocksdb C/C++ backend we never use.
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
# Reserved for future lint ports that need regex (kept in lockstep with shacl).
regex = "1"
# Serialization for timing records and JSON result export (#634).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for content-addressed validation cache keys (parity with Python hashlib).
sha2 = "0.10"
# SHACL engine: the Rust-native validation orchestration reuses parsed shapes
# and validates the shared store directly (#634). The engine core is PyO3-free;
# only the py modules on both sides touch PyO3.
gmeow-shacl = { path = "../shacl" }
# Shared RDF 1.2 kernel: GTS/oxigraph store construction and diagnostics (#648).
gmeow-rdf = { path = "../rdf", features = ["gts", "oxigraph"] }
# Canonical Finding/Report model (#654). The RDF/SHACL -> Finding bridge lives
# here, NOT in the PyO3-free gmeow-rdf kernel: gmeow-diagnostics links pyo3
# unconditionally, and gmeow-validate already links pyo3, so this dependency
# keeps the kernel clean while threading wire-coordinate findings end-to-end.
gmeow-diagnostics = { path = "../diagnostics" }
# GTS format engine: cache-key derivation reads `gmeow_gts::model::Graph::segment_heads`,
# and the toolchain salt mixes `gmeow_gts::wire::VERSION`. Runtime GTS ingestion itself
# lives in gmeow-rdf (#683).
gmeow-gts = "0.9.0"
# pyo3 is an UNCONDITIONAL native-only dependency: this crate is native-only and
# carries NO architecture cfgs (never a [target.'cfg(...)'] table). A capability
# cfg would be optionality, not compliance (#579). The engine core
# (store.rs/model.rs) stays PyO3-free; only py.rs imports pyo3, so the rlib links
# into a future Rust compiler without Python.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }

[dev-dependencies]
# Ed25519 signing material for deterministic GTS signature tests (#646).
ed25519-dalek = "2"
