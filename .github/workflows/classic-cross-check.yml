name: classic-cross-check

# === CLASSIC-CROSS-CHECK LANE (#666/#695, Principle 18) ===
# The SOLE Java+Docker surface, consolidated into ONE job: ELK + verify, HermiT,
# the Docker reasoning cases, the Jena/ROBOT statement checks, the native-vs-ROBOT
# SLME/verify cross-check, and the rdflib engine cross-check. It is a separately
# observed ORACLE cross-check, NEVER a requirement to merge or to use the repo —
# the authoritative gate is the native, Docker-free reasoning lane in ci.yml's
# required `quality` aggregator. This lane therefore lives in its own workflow and
# is NOT part of branch protection. It runs only when explicitly requested:
#   * weekly on a schedule (drift watch against the classic OWL reasoners),
#   * on demand via workflow_dispatch, and
#   * on a pull request ONLY when the `classic-cross-check` label is applied.
# Docker/Java never executes on a normal PR.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: classic-cross-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classic-cross-check:
    # Schedule + manual dispatch always run; a PR runs the lane only when the
    # `classic-cross-check` label is present on the triggering `labeled` event.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'classic-cross-check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      # statements_docker_check.py validates the statement DSL through gmeow_shacl
      # (#578) / gmeow_validate (#579); build those native extensions on the host.
      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install native extensions the lane imports
        # The lane natively reasons (gmeow_logic), classifies the divergence
        # ledger (gmeow_logic.build_divergence_ledger), validates (gmeow_shacl /
        # gmeow_validate), and emits the gate-taxonomy SARIF/JSON via
        # gmeow_diagnostics — all four must be built or `make classic-cross-check`
        # dies with ModuleNotFoundError after the long Docker image build.
        run: |
          VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/diagnostics/Cargo.toml
          VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/shacl/Cargo.toml
          VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/validate/Cargo.toml
          VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/logic/Cargo.toml

      - name: Build the pinned Jena image (RDF 1.2 engine) + pull ROBOT
        run: |
          JENA_IMAGE=$(uv run python -c "from gmeow_tools.config import JENA_IMAGE; print(JENA_IMAGE)")
          docker build -t "$JENA_IMAGE" docker/jena
          ROBOT_IMAGE=$(uv run python -c "from gmeow_tools.config import ROBOT_IMAGE; print(ROBOT_IMAGE)")
          docker pull "$ROBOT_IMAGE"

      - name: Classic cross-check lane (ELK / HermiT / ROBOT / Jena / rdflib) — NOT required
        run: make classic-cross-check
