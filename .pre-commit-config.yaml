# Pre-commit linter suite — the single source of truth for repo hygiene, run
# locally (`pre-commit install`) and in CI (`pre-commit run --all-files`). The
# repo is Rust-only: this file covers Rust formatting/lint, spelling, YAML,
# Markdown, shell, GitHub Actions (lint + security), and secrets. (Full
# REUSE/SPDX license-header compliance is tracked separately, outside this suite.)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Whitespace fixers skip vendored (gUFO, public fixtures), generated
      # (metadata), license texts, and tab-delimited data (TSV) so they stay
      # byte-faithful — stripping a trailing space inside a vendored string
      # literal or a TSV column tab would corrupt content.
      - id: trailing-whitespace
        exclude: &keep-verbatim >
          (?x)^(
            imports/.*|
            vendor/.*|
            generated/metadata/.*|
            generated/schemas/.*|
            generated/lpg/.*|
            ontology-docs/.*|
            LICENSE.*|
            tests/fixtures/coverage/external/.*|
            crates/validate/tests/goldens/crossref/.*|
            crates/rdf/tests/corpus/w3c/.*|
            crates/lang-bridge/tests/fixtures/.*|
            crates/slice-quality/tests/fixtures/goldens/.*|
            .*\.(tsv|svg|conllu)
          )$
      - id: end-of-file-fixer
        exclude: *keep-verbatim
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # Frozen SPARQL-oracle goldens (committed CONSTRUCT N-Quads) are
        # large by nature and must stay byte-faithful; excluded alongside
        # the other generated/golden data trees — including the committed
        # per-term content-address provenance manifest under generated/catalog/,
        # which spans one canonical digest per documented term. The vendored
        # purrdf wasm engine (the offline docs SPARQL playground) is a pinned
        # binary asset refreshed by `make maint-refresh-purrdf-asset`.
        # The correspondence-laws N-Triples fanout is a generated projection of
        # gmeow.gts (the discharged SectionLaw / correspondence-mapping cells)
        # and is large by nature — it must stay a byte-faithful projection.
        # The quality-assessment N-Triples fold is likewise a generated
        # projection of gmeow.gts (the QualityAssessment graph riding the
        # carrier) and is large by nature.
        # The authoring-packet briefs N-Triples fold is likewise a generated
        # projection of gmeow.gts (the per-slice gmeow:AuthoringPacket corpus
        # riding the carrier): one packet per slice batch, with a
        # grounding-coverage cell per present cross-lingual/cross-ontology
        # incidence across every slice — large by nature.
        # The purrdf LPG projection (generated/lpg/, incl. the GraphML fold) and
        # the flat pydantic package (packages/python/gmeow_models/models.py) are
        # likewise generated byte-faithful projections of gmeow.gts and are large
        # by nature.
        exclude: '^(generated/schemas/.*|generated/catalog/.*|generated/briefs/.*|generated/lpg/.*|generated/logic/gmeow\.correspondence-laws\.nt|generated/quality/.*|packages/python/gmeow_models/.*|ontology-docs/.*|crates/sparql-conformance/tests/goldens/.*|crates/docs/assets/purrdf/.*)$'
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: *keep-verbatim

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        exclude: '^(crates/rdf/tests/corpus/w3c/|generated/briefs/|vendor/)'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        exclude: '^(ontology-docs/|crates/rdf/tests/corpus/w3c/|vendor/)'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.5.2
    hooks:
      - id: zizmor

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # Rust formatting gate — mirrors the CI "Format gate" step exactly.
  # Runs `cargo fmt --check` so unformatted Rust cannot reach CI.
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        language: system
        entry: cargo fmt --check
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^crates/
      - id: lint-issue-refs
        name: lint issue/PR references
        entry: ./scripts/lint-issue-refs.sh
        language: system
        pass_filenames: false
        always_run: true
