name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI artifacts must not inherit the repo's local `target-cpu=native` default.
  # This target-specific env appends after .cargo/config.toml; the last
  # -Ctarget-cpu wins while wasm/cross-target jobs stay unaffected.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
    -Zunstable-options -Clink-self-contained=+linker
    -Clinker-features=+lld -Ctarget-cpu=x86-64-v3
  CARGO_ENV_CFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CXXFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CFLAGS_FORCE: "true"
  CARGO_ENV_CXXFLAGS_FORCE: "true"

# The quality gate is split into independent jobs that run in parallel. The repo
# is Rust-only: every job builds the gmeow-dev / gmeow-lsp binaries from the Rust
# workspace (nightly toolchain + Swatinem rust-cache); there is no Python surface,
# Python package environment, or prebuilt CPython extension wheel anymore.
#
# Diagnostics SARIF taxonomy: each job's per-category SARIF is uploaded to code
# scanning under a category == the JOB name, and its artifacts land under
# `dist/diagnostics/<category>/`. Wired here: `rust` (gmeow-lsp rust diagnostics).
# Uploads are fork-safe: only push + same-repo PRs hit code scanning; fork PRs
# fall back to a workflow artifact (their token lacks security-events: write).
jobs:
  # === SOURCE-BUILT PRODUCER BINARY ===
  # Build gmeow-dev once for the exact Rust source + toolchain contract. Ontology-only
  # changes reuse that immutable producer binary; Rust changes miss the exact-source
  # cache and rebuild it. No consumer is compiled before
  # generated/dist/gmeow.gts exists.
  producer-build:
    runs-on: ubuntu-latest
    # Every long job carries an explicit budget. Without one, a job that is OOM-killed
    # and a job that hangs are INDISTINGUISHABLE from the outside — both surface only as
    # a runner that stopped responding. A named timeout makes "it ran out of time" a
    # different signal from "the kernel killed it", which is what a 16 GB runner does to
    # a build whose peak residency grows with the corpus.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Fingerprint the resolved Rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          sha256=$(rustc -Vv | sha256sum | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the exact producer implementation closure
        id: producer-inputs
        run: |
          set -euo pipefail
          sha256=$(./scripts/rust-producer-input-digest.sh crates/gmeow-dev-cli)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "producer input sha256=$sha256"

      - name: Restore exact-source producer binary
        id: producer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/bin/gmeow-dev
          key: producer-bin-v2-${{runner.os}}-${{runner.arch}}-${{steps.toolchain.outputs.sha256}}-${{steps.producer-inputs.outputs.sha256}}

      - name: Cache Cargo dependencies
        if: steps.producer-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the producer (gmeow-dev only)
        if: steps.producer-cache.outputs.cache-hit != 'true'
        run: make producer-build

      - name: Verify the producer binary
        run: |
          set -euo pipefail
          chmod +x dist/bin/gmeow-dev
          dist/bin/gmeow-dev version

      - name: Upload the exact producer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin/gmeow-dev
          if-no-files-found: error
          retention-days: 1

  # === TWO INDEPENDENT COLD GENERATIONS ===
  # Both runners start without generated/ or a pipeline cache and reconstruct the
  # complete generated tree from the same source-built producer. They run concurrently,
  # so the hard two-generation determinism proof costs one generation on the critical
  # path rather than two additional serial generations.
  generation:
    name: generation (${{ matrix.generation }})
    needs: [producer-build]
    strategy:
      fail-fast: false
      matrix:
        generation: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact producer binary
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin

      - name: Make the producer executable
        run: chmod +x dist/bin/gmeow-dev

      # Update mode runs the superset, declared-inventory completeness, fanout-
      # bijection, drift, orphan, and internal-tag-leak gates while materializing.
      # SYNC_VERBOSE=1 streams each DAG stage as it starts and ends. On a runner that
      # dies mid-pipeline the last streamed stage NAMES the resident stage, which is the
      # difference between a diagnosable failure and a bare `Killed`.
      - name: Cold-materialize the generated product
        env:
          SYNC_VERBOSE: "1"
          SYNC_TIMINGS_JSON: dist/sync/update-timings.json
        run: |
          mkdir -p dist/sync
          make check-sync GMEOW_DEV=./dist/bin/gmeow-dev SYNC_MODE=update

      - name: Strict sync fixed-point + drift/orphan gate (read-only)
        env:
          SYNC_TIMINGS_JSON: dist/sync/check-timings.json
        run: make check-sync GMEOW_DEV=./dist/bin/gmeow-dev SYNC_MODE=check

      - name: GTS frame/profile gate
        run: make gts-frame-profile-gate GMEOW_DEV=./dist/bin/gmeow-dev

      # The medium axis over the same materialized bundle: every payload frame
      # decoded through its declared chain, every envelope re-derived (including the
      # snapshot's stratum), every dictionary paying for itself, and the declared
      # reader contract matched against what the wire actually demands.
      - name: Medium gate
        run: make medium-gate GMEOW_DEV=./dist/bin/gmeow-dev

      - name: Capture the immutable sync manifest
        run: >-
          cp .cache/gmeow-sync/manifests/generated-default.json
          dist/sync/manifest.json

      - name: Upload independent generated tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-tree-${{ github.sha }}-${{ matrix.generation }}
          path: generated
          if-no-files-found: error
          retention-days: 1

      - name: Upload independent producer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generation-evidence-${{ github.sha }}-${{ matrix.generation }}
          path: |
            dist/sync/manifest.json
            dist/sync/update-timings.json
            dist/sync/check-timings.json
          if-no-files-found: error
          retention-days: 3

  # === SINGLE PRODUCER AUTHORITY ===
  # Byte-compare both independently reconstructed trees, publish generation A as the
  # one immutable artifact, and expose its bundle digest. Every downstream job consumes
  # this exact authority artifact and never regenerates it.
  producer:
    needs: [generation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bundle_digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generation A
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}-a
          path: ${{ runner.temp }}/generated-a

      - name: Download generation B
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}-b
          path: ${{ runner.temp }}/generated-b

      - name: Download generation A evidence
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generation-evidence-${{ github.sha }}-a
          path: ${{ runner.temp }}/evidence-a

      - name: Download generation B evidence
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generation-evidence-${{ github.sha }}-b
          path: ${{ runner.temp }}/evidence-b

      - name: Prove byte-identical independent generations
        run: >-
          diff --recursive --brief --no-dereference
          "${RUNNER_TEMP}/generated-a" "${RUNNER_TEMP}/generated-b"

      - name: Compute the bundle digest (artifact identity)
        id: digest
        run: |
          set -euo pipefail
          sha256=$(
            sha256sum "${RUNNER_TEMP}/generated-a/dist/gmeow.gts" |
              cut -d' ' -f1
          )
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "producer bundle sha256=$sha256"

      - name: Emit the immutable producer receipt
        run: >-
          ./scripts/producer-receipt.sh write
          "${RUNNER_TEMP}/generated-a" "${RUNNER_TEMP}/evidence-a/manifest.json"
          "${RUNNER_TEMP}/generated-b" "${RUNNER_TEMP}/evidence-b/manifest.json"
          dist/producer-receipt.json "${GITHUB_SHA}"

      - name: Upload the authoritative generated tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: ${{ runner.temp }}/generated-a
          if-no-files-found: error
          retention-days: 3

      - name: Upload the authoritative producer receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: producer-receipt-${{ github.sha }}
          path: dist/producer-receipt.json
          if-no-files-found: error
          retention-days: 3

  lint:
    needs: [producer]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05
          components: rustfmt

      # Commit hygiene is source-only. Compiled all-target clippy is owned exactly
      # once by rust-static below, on a runner that already has generated/ and Cargo
      # state for rustdoc/doctests.
      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # `make lint` runs scripts/lint-issue-refs.sh, which hard-requires ripgrep;
      # it is not present on the runner image by default.
      - name: Install ripgrep
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: ripgrep

      - name: Lint gate
        run: make lint

  # === ONE RUST TEST BUILD LINEAGE ===
  # Compile producer-independent test units while the two independent generations run.
  # The archive authority then restores that exact run-scoped Cargo target, completes
  # the two consumers whose binaries embed the producer artifact, primes fixtures once,
  # and authenticates the archive before any test runner starts. A missing target cache
  # is a normal Cargo rebuild; restored units remain subject to Cargo's fingerprints.
  rust-prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - name: Install cargo-nextest (pinned build inventory semantics)
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest@0.9.137

      - name: Resolve exact Rust toolchain cache identity
        id: rust-prebuild-identity
        run: |
          set -euo pipefail
          echo "rustc=$(rustc -Vv | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      # The run/attempt suffix makes every producer save a fresh, complete cache rather
      # than restoring an immutable exact key that can never be advanced.
      # Restore prefixes admit exact-source first, then compatible-source Cargo
      # reuse; Cargo itself validates
      # every unit against source, dependency, flags, and compiler fingerprints. The key
      # deliberately binds runner OS + architecture, not the rolling image patch
      # revision: same-run jobs can land on adjacent ubuntu-latest revisions, and
      # the authenticated
      # archive is itself replayed across that same ABI-compatible runner family.
      - name: Restore producer-independent Rust build products
        id: rust-prebuild-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-${{github.sha}}-
            rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-

      - name: Restore producer-independent typed fixtures
        id: fixture-prebuild-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gmeow-sync/actions
            .cache/gmeow-sync/test-fixture-manifest-v2.json
          key: test-actions-v3-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml')}}-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            test-actions-v3-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml')}}-${{github.sha}}-
            test-actions-v3-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml')}}-

      - name: Compile producer-independent CI tests and shared fixture tool
        run: make rust-prebuild

      - name: Produce test-profile corpus fixtures before any test runner starts
        run: >-
          make produce-producer-independent-test-fixtures
          FIXTURE_TIMINGS_JSON=dist/nextest/fixture-timings-producer-independent.json

      - name: Upload producer-independent fixture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-prebuild-evidence-${{ github.sha }}
          path: dist/nextest/fixture-timings-producer-independent.json
          if-no-files-found: error
          retention-days: 1

  # The receipt binds the
  # source revision + tracked tree, Rust/nextest identities, build configuration,
  # authoritative generated tree, archive bytes, and canonical test inventory. It also
  # proves that the configured slice partitions are disjoint and their union is exact.
  rust-archive:
    needs: [producer, rust-prebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      # The transfer accelerator may miss; provision the runner before the fallback
      # so a miss always recomputes the complete requested build rather than failing
      # on an absent Cargo subcommand.
      - name: Install cargo-nextest (pinned archive format and partition semantics)
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest@0.9.137

      - name: Resolve exact Rust toolchain cache identity
        id: rust-prebuild-identity
        run: |
          set -euo pipefail
          echo "rustc=$(rustc -Vv | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore same-run producer-independent Rust build products
        id: rust-prebuild-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-${{github.sha}}-
            rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-

      - name: Rebuild producer-independent products on transfer miss
        if: steps.rust-prebuild-cache.outputs.cache-hit != 'true'
        run: make rust-prebuild

      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Download the authoritative producer receipt
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: producer-receipt-${{ github.sha }}
          path: dist

      - name: Verify source, complete generated tree, bundle, and receipt envelope
        run: ./scripts/producer-receipt.sh verify generated dist/producer-receipt.json

      - name: Download producer-independent fixture evidence
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-prebuild-evidence-${{ github.sha }}
          path: dist/nextest

      # The pipeline action store is a required same-run producer artifact, not a
      # best-effort acceleration. The archive lane verifies every selected receipt and
      # hard-fails on a transfer miss; it can never become a second corpus producer.
      - name: Restore same-run producer-independent typed fixtures
        id: fixture-prebuild-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gmeow-sync/actions
            .cache/gmeow-sync/test-fixture-manifest-v2.json
          key: test-actions-v3-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml')}}-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}

      - name: Require the exact same-run fixture transfer
        if: steps.fixture-prebuild-cache.outputs.cache-hit != 'true'
        run: |
          echo "exact same-run pipeline fixture cache was not transferred" >&2
          echo >&2
          echo "The key binds runner OS/arch, the resolved rustc identity, the Cargo" >&2
          echo "manifest hash, github.sha, github.run_id AND github.run_attempt." >&2
          echo >&2
          echo "Because the attempt number is part of the key, RE-RUNNING ONLY FAILED" >&2
          echo "JOBS CAN NEVER FIX THIS: the attempt advances but rust-prebuild, having" >&2
          echo "succeeded, does not re-run, so nothing writes the new key. Re-run ALL" >&2
          echo "jobs instead." >&2
          echo >&2
          echo "If the rustc segment of the key differs between this job and the" >&2
          echo "rust-prebuild save line, the two jobs resolved different compilers." >&2
          echo "The toolchain is date-pinned in rust-toolchain.toml precisely so that" >&2
          echo "cannot happen; a mismatch means a workflow drifted off that pin." >&2
          exit 1

      - name: Restore exact generated-bundle import products
        id: bundle-import-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gmeow-bundle-import
          key: bundle-import-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/bundle-import/**','crates/errors/**','.cargo/config.toml','rust-toolchain.toml')}}-${{hashFiles('generated/dist/gmeow.gts')}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            bundle-import-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/bundle-import/**','crates/errors/**','.cargo/config.toml','rust-toolchain.toml')}}-${{hashFiles('generated/dist/gmeow.gts')}}-

      - name: Verify every transferred test-profile pipeline fixture read-only
        run: make verify-producer-independent-test-fixtures

      - name: Produce generated-bound fixtures before archive construction
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: >-
          make produce-producer-bound-test-fixtures
          FIXTURE_TIMINGS_JSON=dist/nextest/fixture-timings-producer-bound.json
          BUNDLE_IMPORT_CACHE_ROOT="$PWD/.cache/gmeow-bundle-import"

      - name: Build dependency-light archive evidence tools
        run: make nextest-evidence-tools

      - name: Build and authenticate one CI-profile nextest archive
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          target/debug/perf_sample \
            --pair-id "ci-${GITHUB_RUN_ID}-rust-archive-build" \
            --variant candidate \
            --sample-index 1 \
            --cache-state partial \
            --partial-change \
            "producer-bundle:generated/dist/gmeow.gts:${BUNDLE_DIGEST}" \
            --cargo-cache-state partial \
            --sync-cache-state not-applicable \
            --pipeline-cache-state warm \
            --fixture-cache-state warm \
            --bundle-import-cache-state partial \
            --nextest-archive-cache-state absent \
            --node-class github-ubuntu-latest-x64 \
            --runner-image "${ImageOS}@${ImageVersion}" \
            --output dist/nextest/archive-build-sample.json \
            --work-telemetry dist/nextest/fixture-timings-producer-bound.json \
            --identity-receipt producer=dist/producer-receipt.json \
            --cache-root actions=.cache/gmeow-sync/actions \
            --cache-root bundle-import=.cache/gmeow-bundle-import \
            --output-root archive=dist/nextest \
            -- \
            make nextest-archive

      # Keep the small run/work receipts separately downloadable. The full archive is
      # intentionally large; a critical-path collector must not transfer gigabytes just
      # to read its authenticated inventory and causal-work counters.
      - name: Upload archive build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-archive-evidence-${{ github.sha }}
          path: |
            dist/nextest/receipt.json
            dist/nextest/fixture-timings-producer-independent.json
            dist/nextest/fixture-timings-producer-bound.json
            dist/nextest/archive-build-sample.json
            dist/producer-receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload authenticated test archive and exact fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-archive-${{ github.sha }}
          path: |
            dist/nextest/ci.tar.zst
            dist/nextest/receipt.json
            dist/nextest/fixture-timings-producer-independent.json
            dist/nextest/fixture-timings-producer-bound.json
            dist/nextest/archive-build-sample.json
            dist/nextest/junit_inventory
            dist/nextest/perf_sample
            dist/nextest/perf_accept
            dist/producer-receipt.json
            .cache/gmeow-sync/actions
            .cache/gmeow-sync/test-fixture-manifest-v2.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload producer-bound bundle-import cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-import-cache-${{ github.sha }}
          path: .cache/gmeow-bundle-import
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Shards execute the SAME authenticated archive with nextest's stable slice
  # partitioning. No shard invokes Cargo compilation. Every runner re-verifies the
  # archive receipt and the mechanical union/disjointness proof before executing its
  # slice. Tests use the runner's available CPU width; full-width tests retain their
  # `num-cpus` reservations with no fixed global concurrency cap.
  rust:
    needs: [producer, rust-archive]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Archived tests still execute merge-base invariance and changed-path
          # gates. Their comparand is required input, not build output.
          fetch-depth: 0

      # Nightly is required by gmeow-logic's targeted `portable_simd` kernels.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      # The producer-materialized tree must be present before any workspace compile —
      # gmeow-cli / gmeow-lsp embed generated/dist/gmeow.gts, and the docs tests read
      # generated/catalog/*.nq. Download it and validate the bundle digest;
      # never regenerate.
      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Download the authenticated test archive and exact fixtures
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-test-archive-${{ github.sha }}
          path: .

      - name: Download the authenticated whole-bundle import product
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bundle-import-cache-${{ github.sha }}
          path: .cache/gmeow-bundle-import

      - name: Install cargo-nextest (pinned archive format and partition semantics)
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest@0.9.137

      - name: Restore report-only evidence tool modes
        run: >-
          chmod +x dist/nextest/junit_inventory dist/nextest/perf_sample
          dist/nextest/perf_accept

      # crates/xtask/tests/issue_refs_lint.rs drives scripts/lint-issue-refs.sh, which
      # hard-requires ripgrep and is not on the runner image by default — the same
      # dependency the `lint` job already installs for `make lint`. Without it the
      # script exits 2 ("ripgrep (rg) is required") and every case of that test reds on
      # the exit code rather than on what it is asserting. The test runs in the nextest
      # shards, so the tool has to be here too; a gate that cannot run is not a gate.
      - name: Install ripgrep
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: ripgrep

      - name: Verify archive identity and exact slice coverage
        run: make nextest-archive-verify

      - name: Workspace tests from authenticated archive (slice ${{ matrix.shard }}/3)
        env:
          GMEOW_BUNDLE_IMPORT_CACHE: ${{ github.workspace }}/.cache/gmeow-bundle-import
          GMEOW_BUNDLE_IMPORT_SOURCE_SHA256: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          fixture_manifest="$PWD/.cache/gmeow-sync/test-fixture-manifest-v2.json"
          export GMEOW_TEST_FIXTURE_MANIFEST="$fixture_manifest"
          export GMEOW_TEST_FIXTURE_MANIFEST_SHA256
          GMEOW_TEST_FIXTURE_MANIFEST_SHA256=$(
            jq -er '.test_fixture_manifest.sha256' dist/nextest/receipt.json
          )
          # The exact bundle-import product is authenticated and selected read-only by
          # digest, so isolated processes never rebuild the same whole-bundle dataset.
          dist/nextest/perf_sample \
            --pair-id "ci-${GITHUB_RUN_ID}-rust-archive" \
            --variant candidate \
            --sample-index "${{ matrix.shard }}" \
            --cache-state warm \
            --cargo-cache-state not-applicable \
            --sync-cache-state not-applicable \
            --pipeline-cache-state warm \
            --fixture-cache-state warm \
            --bundle-import-cache-state warm \
            --nextest-archive-cache-state warm \
            --node-class github-ubuntu-latest-x64 \
            --runner-image "${ImageOS}@${ImageVersion}" \
            --output "dist/nextest/shard-${{ matrix.shard }}-sample.json" \
            --identity-receipt nextest=dist/nextest/receipt.json \
            --identity-receipt producer=dist/producer-receipt.json \
            --cache-root actions=.cache/gmeow-sync/actions \
            --cache-root bundle-import=.cache/gmeow-bundle-import \
            -- \
            cargo nextest run \
              --archive-file dist/nextest/ci.tar.zst \
              --workspace-remap "$PWD" \
              --profile ci \
              --partition slice:${{ matrix.shard }}/3

      - name: Authenticate JUnit inventory and durations
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        run: >-
          dist/nextest/junit_inventory
          --output "dist/nextest/junit-shard-${{ matrix.shard }}.json"
          target/nextest/ci/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-report-rust-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Upload Rust shard performance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-perf-receipt-${{ matrix.shard }}
          path: |
            dist/nextest/shard-${{ matrix.shard }}-sample.json
            dist/nextest/junit-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 3

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Rust Tests (shard ${{ matrix.shard }}/3)
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  # The two exhaustive medium consumer binaries are deliberately excluded from the
  # default CI profile, but they are already present in the authenticated workspace
  # archive. Replay that same archive and its exact same-run fixtures instead of giving
  # this breadth proof a second Cargo compilation authority.
  medium-consumer-surface:
    needs: [producer, rust-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Download the authenticated test archive and exact fixtures
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-test-archive-${{ github.sha }}
          path: .

      - name: Download the producer-bound bundle-import cache
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bundle-import-cache-${{ github.sha }}
          path: .cache/gmeow-bundle-import

      - name: Install cargo-nextest (pinned archive format and profile semantics)
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest@0.9.137

      - name: Restore report-only evidence tool modes
        run: >-
          chmod +x dist/nextest/junit_inventory dist/nextest/perf_sample
          dist/nextest/perf_accept

      - name: Verify producer receipt before consumer replay
        run: ./scripts/producer-receipt.sh verify generated dist/producer-receipt.json

      - name: Verify archive identity and exact slice coverage
        run: make nextest-archive-verify

      - name: Medium consumer proofs from the authenticated archive
        run: |
          dist/nextest/perf_sample \
            --pair-id "ci-${GITHUB_RUN_ID}-rust-archive" \
            --variant candidate \
            --sample-index 1 \
            --cache-state warm \
            --cargo-cache-state not-applicable \
            --sync-cache-state not-applicable \
            --pipeline-cache-state warm \
            --fixture-cache-state warm \
            --bundle-import-cache-state warm \
            --nextest-archive-cache-state warm \
            --node-class github-ubuntu-latest-x64 \
            --runner-image "${ImageOS}@${ImageVersion}" \
            --output dist/nextest/medium-consumer-sample.json \
            --identity-receipt nextest=dist/nextest/receipt.json \
            --identity-receipt producer=dist/producer-receipt.json \
            --cache-root actions=.cache/gmeow-sync/actions \
            --cache-root bundle-import=.cache/gmeow-bundle-import \
            -- \
            make medium-consumer-surface NEXTEST_ARCHIVE_INPUT=dist/nextest/ci.tar.zst

      - name: Authenticate JUnit inventory and durations
        if: always() && hashFiles('target/nextest/maint-heavy/junit.xml') != ''
        run: >-
          dist/nextest/junit_inventory
          --output dist/nextest/junit-medium-consumer.json
          target/nextest/maint-heavy/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-report-medium-consumer
          path: target/nextest/maint-heavy/junit.xml
          if-no-files-found: warn

      - name: Upload medium consumer performance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medium-consumer-perf-receipt
          path: |
            dist/nextest/medium-consumer-sample.json
            dist/nextest/junit-medium-consumer.json
          if-no-files-found: warn
          retention-days: 3

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Rust Tests (medium consumer surface)
          path: target/nextest/maint-heavy/junit.xml
          reporter: java-junit

  # Static Rust surfaces are a sibling of archive construction, not serial work on
  # test shard 1. This one runner owns all-target clippy, rustdoc/doctests, and the
  # report-only diagnostics projection instead of cold-building clippy in lint. It
  # restores the exact same-run prebuild target so docs and static surfaces reuse the
  # already-compiled dependency graph; Cargo still fingerprints every additional unit.
  rust-static:
    needs: [producer, rust-prebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05
          components: clippy

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - name: Resolve exact Rust toolchain cache identity
        id: rust-prebuild-identity
        run: |
          set -euo pipefail
          echo "rustc=$(rustc -Vv | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore same-run producer-independent Rust build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-${{github.sha}}-
            rust-prebuild-v1-${{runner.os}}-${{runner.arch}}-${{steps.rust-prebuild-identity.outputs.rustc}}-${{hashFiles('Cargo.lock','Cargo.toml','crates/**/Cargo.toml','.cargo/config.toml','rust-toolchain.toml','.config/nextest.toml')}}-

      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Workspace clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust API docs (broken-link gate)
        run: make rust-docs

      - name: Workspace doctests
        run: cargo test --doc --workspace

      - name: gmeow-lsp rust diagnostics SARIF (non-gating projection)
        continue-on-error: true
        run: make diagnostics-rust-sarif

      - name: Upload rust diagnostics SARIF
        uses: ./.github/actions/upload-diagnostics-sarif
        with:
          sarif_file: dist/diagnostics/rust/gmeow-feedback.sarif
          artifact_path: dist/diagnostics/rust/
          category: rust
          artifact_name: diagnostics-rust

  # === ONTOLOGY GATE LANES ===
  # Four parallel jobs consume the exact gmeow-dev binary built by producer-build
  # and run disjoint slices of the repository gates. The toolchain remains available
  # for targets that compile other workspace surfaces, but Make never falls back to
  # rebuilding the producer independently in each lane. Grouping balances wall-time,
  # isolating the long poles (validate and strict sync) into separate jobs.
  #
  # Every remaining gate lands in exactly one job:
  #   ontology-validate  : validate
  #   ontology-generated : sync, constitution-check, crate-check
  #   ontology-reason    : reason-verify, coverage
  #   ontology-misc      : mappings, wikidata, alignment/i18n/doc lints, audit,
  #                        slice-quality, compliance-report
  #   heavy              : wasm-parity, console-smoke, acceptance, bench-soak
  #   medium-consumer-surface : archive replay of the two exhaustive medium suites
  ontology-validate:
    needs: [producer]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GMEOW_DEV: ./dist/bin/gmeow-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact producer binary
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin

      - name: Make the producer executable
        run: chmod +x dist/bin/gmeow-dev

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      # Persist the content-addressed `.cache/validate` across runs. Every
      # validate phase (merged-SHACL, the per-example SHACL passes, the DSL passes)
      # is wrapped in a content-keyed cache with no TTL; a stale restore self-heals
      # because a mismatched in-process key is simply a miss. Without this, CI pays
      # the full cold cost every run (the per-example passes dominate). `.cache/` is
      # gitignored, so this workflow cache is the only persistence. The key is a
      # coarse content hint over the validated sources + the Rust validator; the
      # authoritative invalidation stays the in-process content key.
      - name: Cache validate (content-addressed SHACL findings)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/validate
          key: validate-${{runner.os}}-${{hashFiles('slices/**/*.ttl','shapes/**/*.ttl','dsl/**/*.ttl','crates/shacl/**/*.rs','crates/validate/**/*.rs')}}
          restore-keys: |
            validate-${{ runner.os }}-

      - name: Validate (syntax, lint, SHACL, DSL SHACL)
        run: make validate

  ontology-generated:
    needs: [producer]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GMEOW_DEV: ./dist/bin/gmeow-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact producer binary
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin

      - name: Make the producer executable
        run: chmod +x dist/bin/gmeow-dev

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The authoritative sync + strict fixed-point / drift / orphan gate runs ONCE
      # in the producer job. Here we consume its exact artifact and validate the
      # bundle digest — never a second regeneration — then run the checks that read
      # the materialized tree.
      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Constitution check (every principle has live enforcement)
        run: make constitution-check

      - name: Crate layering and acyclic dependency graph
        run: make crate-check

  ontology-reason:
    needs: [producer]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GMEOW_DEV: ./dist/bin/gmeow-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact producer binary
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin

      - name: Make the producer executable
        run: chmod +x dist/bin/gmeow-dev

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Native reason + reasoned-graph verify (one closure)
        env:
          REASON_VERIFY_TIMINGS_JSON: dist/reason/reason-verify.json
        run: make reason-verify

      - name: Upload native reasoning work evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reason-evidence-${{ github.sha }}
          path: dist/reason/reason-verify.json
          if-no-files-found: error
          retention-days: 3

      # `make acceptance` moved to the CI-only `heavy` job below (its cost is set by
      # the breadth of the external snapshot corpus, not by the change under test).

      - name: Vendored-entity coverage — hard class/predicate floors
        run: make coverage

  ontology-misc:
    needs: [producer]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GMEOW_DEV: ./dist/bin/gmeow-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact producer binary
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin

      - name: Make the producer executable
        run: chmod +x dist/bin/gmeow-dev

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Mappings → axioms + linksets, QID syntax
        run: make mappings

      - name: Wikidata QID/PID syntax gate
        run: make wikidata

      - name: Alignment direction lint
        run: make lint-alignment

      - name: Claim audit gates on the worked fixture
        run: make audit

      - name: Translation catalog integrity
        run: make i18n-lint

      - name: Ontology documentation links and coverage
        run: make doc-lint

      - name: Slice-quality floors and projection-vocabulary ratchets
        run: make slice-quality-gate

      # `make bench-soak` moved to the CI-only `heavy` job below (a repeat-for-
      # confidence soak window does not belong on a per-commit gate).

      - name: Compliance report (per-principle gate evidence)
        run: make compliance-report

  # === THE CI-ONLY HEAVY DAG (`HEAVY_TASKS`, also aggregated by `make heavy`) ===
  # Every task here was lifted OFF the local `make check` DAG because its runtime is
  # dominated by BREADTH (a whole external corpus, five release wasm builds, or the
  # 41-case browser/package sweep) or by a repeat-for-confidence loop, not by the change
  # under test. Nothing was dropped:
  # every HEAVY_TASKS member runs on every PR as an explicit parallel branch (the
  # medium consumer branch is standalone because it also needs `rust-archive`).
  # `make heavy` remains the canonical aggregate and its CI-only refusal stays intact.
  #
  #   wasm-parity : wasm32 build + dep purity (`make wasm`) plus the four Node lanes
  #                 that RUN the shipped wasm (query / validate / reason / gmn) and
  #                 assert byte-identity to native — the "every gmeow surface proven
  #                 native≡wasm" contract. Every engine is built in this repository
  #                 from the workspace purrdf pin. `make wasm` hard-fails in CI if the
  #                 wasm32 target is absent, so the criterion is never silently
  #                 unverified.
  #   console-smoke: assembled/deployed browser surface, all read tools, offline and
  #                  perturbed trees, and the real installed npm tarball.
  #   acceptance  : full transpile-recall floor over every external RDF snapshot.
  #   bench-soak  : the deterministic native-vs-golden divergence soak window (3×).
  # The standalone `medium-consumer-surface` job above runs the fifth matrix-independent
  # HEAVY_TASKS member from the authenticated archive. The Make aggregate covers both.
  heavy:
    needs: [producer]
    strategy:
      fail-fast: false
      matrix:
        task: [wasm-parity, console-smoke, acceptance, bench-soak]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GMEOW_DEV: ./dist/bin/gmeow-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact producer binary
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin

      - name: Make the producer executable
        run: chmod +x dist/bin/gmeow-dev

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Install wasm32 target for the parity branch
        if: ${{ matrix.task == 'wasm-parity' }}
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `make heavy` ends with the two real medium consumer suites, whose Make
      # target invokes cargo-nextest. Provision the runner dependency explicitly;
      # the Rust matrix installs it in a different job and jobs share no tools.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest

      # The Node round-trip validates a sample dataset against the materialized bundle,
      # and `make acceptance` reads generated/mappings + generated/projections, so the
      # producer artifact must be present before `make heavy`.
      - name: Download the producer-materialized generated/ tree
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      # wasm-bindgen CLI must match the pinned `wasm-bindgen` crate (=0.2.125) byte
      # for byte, or it refuses to generate the JS bindings.
      - name: Install wasm-bindgen-cli (pinned to the crate version)
        if: ${{ matrix.task == 'wasm-parity' }}
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: wasm-bindgen-cli@0.2.125

      # wasm-opt (binaryen) is a REQUIRED build step: `make validate-wasm-pkg` /
      # `validate-wasm-pkg-test` hard-fail without it. Provision a PINNED official
      # release explicitly so the hard
      # dependency — and the optimized artifact bytes — are reproducible, rather than
      # relying on whatever the runner image happens to preinstall.
      #
      # The tag is read FROM the Makefile, not repeated here. When it was written
      # down in both places the two drifted: this step installed a release predating
      # `--enable-bulk-memory-opt`, so every wasm-opt rule died on an unknown option and
      # took all four Node parity lanes with it.
      - name: Install binaryen (wasm-opt) — pinned release
        if: ${{ matrix.task == 'wasm-parity' }}
        run: |
          set -euo pipefail
          BINARYEN_VER="$(make --no-print-directory print-binaryen-ver)"
          echo "pinned binaryen: ${BINARYEN_VER}"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VER}/binaryen-${BINARYEN_VER}-x86_64-linux.tar.gz"
          mkdir -p /tmp/binaryen
          tar xzf /tmp/binaryen.tar.gz -C /tmp/binaryen --strip-components=1
          echo "/tmp/binaryen/bin" >> "$GITHUB_PATH"
          /tmp/binaryen/bin/wasm-opt --version

      # The browser smoke lane's pinned runner. `npm ci` requires the committed
      # lockfile, so the Playwright version the lane drives is the version that was
      # reviewed. Provision it before invoking the selected Make target:
      # `console-smoke` deliberately fails closed when its runner is absent.
      - name: Install the pinned Playwright runner
        if: ${{ matrix.task == 'console-smoke' }}
        run: npm ci --prefix crates/docs/assets/console/smoke

      # …and the browser it drives. `--with-deps` provisions the shared libraries a
      # headless Chromium needs on a bare runner; without it the lane fails at
      # launch rather than at an assertion.
      - name: Install the Chromium build Playwright drives
        if: ${{ matrix.task == 'console-smoke' }}
        run: >-
          npx --prefix crates/docs/assets/console/smoke playwright install
          --with-deps chromium

      - name: Heavy DAG branch — ${{ matrix.task }}
        run: make ${{ matrix.task }}

      # The standalone console's DOM-free acceptance lane. It drives the SHIPPED
      # `crates/docs/assets/mcp-core/` wasm image over the materialized bundle and
      # asserts the console's derived surface: the pane set read out of the shipped
      # action policy,
      # the recorded (never aborting) round-trip failure, the hard error on a missing
      # asset, the RDF-1.2 quoted-triple session annotations, the conjecture selector
      # against the shipped library, and the wasm export subset. It rides this job
      # because it needs the same Node + materialized-bundle preconditions
      # `wasm-parity` does.
      - name: Standalone console acceptance (make console-test)
        if: ${{ matrix.task == 'wasm-parity' }}
        run: make console-test

  # Aggregator gate. Branch protection requires the "quality" context; this job
  # keeps that single required check stable while the work runs in parallel
  # above. `if: always()` guarantees it reports a definite success/failure
  # (never a merge-blocking "skipped") and fails if any parallel job did not.
  #
  # The classic Java/Docker oracle lane has been REMOVED (Principle 18), and the live
  # in-process `purrdf::entail` differential cross-check that once replaced it has
  # also been REMOVED. The native `logic:` engine is now the sole on-gate reasoning
  # authority: `ontology-reason` runs `make reason-verify` (one closure, native
  # consistency/entailment verify + reasoned-graph negatives) with no live second or
  # differential reasoner on any required gate. The required gate stays Docker-free
  # and Java-free. Statements now run natively via the purrdf codec inside the
  # generated-artifact job's strict sync — there is no separate statements lane.
  quality:
    needs:
      - producer
      - lint
      - rust-archive
      - rust
      - rust-static
      - heavy
      - medium-consumer-surface
      - ontology-validate
      - ontology-generated
      - ontology-reason
      - ontology-misc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require all quality jobs to have succeeded
        env:
          PRODUCER: ${{ needs.producer.result }}
          LINT: ${{ needs.lint.result }}
          RUST_ARCHIVE: ${{ needs.rust-archive.result }}
          RUST: ${{ needs.rust.result }}
          RUST_STATIC: ${{ needs.rust-static.result }}
          HEAVY: ${{ needs.heavy.result }}
          MEDIUM_CONSUMER_SURFACE: ${{ needs.medium-consumer-surface.result }}
          ONTOLOGY_VALIDATE: ${{ needs.ontology-validate.result }}
          ONTOLOGY_GENERATED: ${{ needs.ontology-generated.result }}
          ONTOLOGY_REASON: ${{ needs.ontology-reason.result }}
          ONTOLOGY_MISC: ${{ needs.ontology-misc.result }}
        run: |
          printf '%s\n' \
            "results: producer=$PRODUCER lint=$LINT" \
            "rust-archive=$RUST_ARCHIVE rust=$RUST rust-static=$RUST_STATIC" \
            "heavy=$HEAVY medium-consumer-surface=$MEDIUM_CONSUMER_SURFACE" \
            "ontology-validate=$ONTOLOGY_VALIDATE" \
            "ontology-generated=$ONTOLOGY_GENERATED" \
            "ontology-reason=$ONTOLOGY_REASON ontology-misc=$ONTOLOGY_MISC"
          for r in \
            "$PRODUCER" \
            "$LINT" \
            "$RUST_ARCHIVE" \
            "$RUST" \
            "$RUST_STATIC" \
            "$HEAVY" \
            "$MEDIUM_CONSUMER_SURFACE" \
            "$ONTOLOGY_VALIDATE" \
            "$ONTOLOGY_GENERATED" \
            "$ONTOLOGY_REASON" \
            "$ONTOLOGY_MISC"
          do
            if [ "$r" != "success" ]; then
              echo "::error::a quality job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required quality jobs succeeded" \
            "(single producer artifact; native reasoning +" \
            "reasoned-graph verify run in the reason lane)"

      - name: Check out the proven source revision
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust for receipt generation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Emit exact successful-check receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: cargo xtask receipt create --out dist/check-receipt.txt

      - name: Upload successful-check receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gmeow-check-receipt-${{ github.sha }}
          path: dist/check-receipt.txt
          if-no-files-found: error

      - name: Attest successful-check receipt provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # actions/attest-build-provenance v3.1.0
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/check-receipt.txt
