# Nightly Rust is required because the `nemo` engine (a hard dependency of
# gmeow-logic) uses unstable features: macro_metavar_expr, iter_intersperse,
# and slice_swap_unchecked.  There is no fallback — nemo does not compile on
# stable.  Tracking issues: #499, PR #531 (logic-engine-scaffold).
#
# Use the latest available nightly. The Rust-native logic engines depend on
# unstable features through Nemo, and the scryer-prolog/Ring cleanup needs a
# current enough toolchain for upstream Scryer.
# CI keeps this in lockstep via the dtolnay `toolchain:` inputs in ci.yml.
[toolchain]
channel = "nightly"
components = ["rustfmt", "clippy"]
# The purrdf wasm engine (P10, #846) + the wasm-clean SPARQL leaf (#906/#911)
# compile to wasm32-unknown-unknown; `make wasm` / `make rdf-core-hygiene` build
# for it. Listing it here means every toolchain consumer (local + the dtolnay CI
# inputs kept in lockstep) provisions the target by default — no separate
# `rustup target add`.
targets = ["wasm32-unknown-unknown"]
