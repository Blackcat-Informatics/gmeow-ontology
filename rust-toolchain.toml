# Nightly Rust is required because gmeow-logic uses `portable_simd` for targeted
# native vector kernels.
#
# CI uses this dated default so jobs exchanging compiled products resolve the same
# compiler throughout a run. Local compiler selection follows host policy, which
# can enforce floating nightly independently of this repository default.
# Fix compiler warnings in source with warnings-as-errors enabled; selecting an
# older compiler is not a fix. Producer and cache receipts bind the actual compiler.
[toolchain]
channel = "nightly-2026-09-05"
components = ["rustfmt", "clippy"]
# The purrdf wasm engine (P10) + the wasm-clean SPARQL leaf
# compile to wasm32-unknown-unknown; `make wasm` builds
# for it. The manifest declares the required target for rustup-managed installs.
targets = ["wasm32-unknown-unknown"]
