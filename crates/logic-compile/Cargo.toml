[package]
name = "gmeow-logic-compile"
description = "GMEOW logic compiler: the pure, wasm-able parse(RDF 1.2)→IR→project pipeline (the seven committed artifacts), with zero reasoning-runtime dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "logic", "compiler", "wasm", "owl"]

[lib]
# rlib-only. The wasm32 build is a `cargo build --target wasm32-unknown-unknown`
# of this same rlib (a downstream bindings crate, like the purrdf repository's wasm
# bindings crate, assembles any shipped wasm bundle); there is no standalone cdylib here.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# The wasm-clean RDF kernel surface — EXACTLY the purrdf wasm-bindings pin (#885
# ring-fence, #909 native codecs): the `gts` feature with oxigraph OFF and python
# OFF. Supplies RdfDataset/RdfDatasetBuilder/DatasetView/TermValue/RdfLiteral/
# TermRef + parse_dataset/serialize_dataset/canonicalize, all oxigraph-free, so the
# compiler's RDF parse/serialize path builds for wasm32 with no Store dependency.
gmeow-ns = { path = "../ns" }
purrdf.workspace = true
# SPARQL property-path algebra: the projection target for logic:PathShape (#1010).
# A wasm-clean leaf (gmeow-iri/gmeow-xsd only) — no oxigraph-family dep.
# roxmltree: the read-only XML DOM parser for the XCL dialect reader. A pure-Rust,
# wasm-clean leaf (already in the workspace as gmeow-rdf's native RDF/XML parser), so
# it keeps this crate oxigraph-free and wasm-buildable. The XCL reader parses through
# it rather than a hand-rolled scanner so the meta carrier decodes losslessly (the
# Exact round-trip guarantee); the writer emits XML directly (roxmltree is parse-only).
roxmltree = "0.20"
# gmeow-errors: the diagnostics substrate. Loss unification (Phase 4) grades
# PreservationKind as a BoundedLattice (worst-preservation-wins) and collapses the
# projection-loss accumulators onto one DiagLedger of FindingCategory::ProjectionLoss
# witnesses. A wasm-clean rlib leaf (serde/serde_json/purrdf/blake3 only, python OFF).
gmeow-errors = { path = "../errors" }
# THE one structured-term representation. `Formula::content_key` is one of exactly two
# content-key folds in the workspace (the other is the arena's own netstring fold), and
# both sides of that congruence seam now return the arena's `ContentKey` newtype — landing
# it on one side only would leave two conventions and the guarantee unenforced exactly
# where `dag_congruent_with_ir_content_key` pins it. The arena is reasoner-free and
# wasm-clean (purrdf + hashbrown/foldhash/smallvec), so this crate stays wasm-buildable and
# oxigraph-free; no layering cycle (the arena depends on neither logic nor this crate).
gmeow-term-arena = { path = "../term-arena" }
# sha2: the canonical-rdf12 projection mints content-stable reifier IRIs as
# sha256(sort_key)[:12], matching the legacy compiler byte-for-byte.
sha2 = "0.10"
# blake3: the framed, domain-tagged content-digest discipline shared with
# crates/logic (`ReasoningContract::content_digest` pins the reasoning contract for
# the operational `ReasoningSession` identity). Pure-Rust, wasm-clean.
blake3 = "1"
# serde: the projection-result ledger rows + report header counts are passed as an
# in-memory product (JSON) from the compile-logic pipeline stage to the mappings stage,
# which assembles the FINAL projection report over the union of the logic rows and the
# correspondence ledger. Pure-Rust + wasm-clean (no oxigraph / no std::fs).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# insta: snapshot goldens for the projection back-ends (the `.snap` files are the
# byte-exact unit goldens; crates/conformance owns cross-engine corpus parity).
# Pinned to match crates/logic. `json` drives `assert_json_snapshot!` where used.
insta = { version = "1.48", features = ["json"] }
# serde_json: verify the correspondence gate report serializes to stable tagged JSON
# (the conformance golden shape) in the gate unit tests.
serde_json = "1"
