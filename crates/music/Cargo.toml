[package]
name = "gmeow-music"
description = "GMEOW music-package toolchain: GTS package I/O, notation renderers, and MusicXML import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "music", "gts", "musicxml", "notation"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
default = []

[dependencies]
gmeow-errors = { path = "../errors" }
purrdf = "0.5"
roxmltree = "0.20"
