# Maturin build configuration for the gmeow_validate Python extension.
# Run: uvx maturin develop (from crates/validate/) or: make validate-py (repo root).

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gmeow-validate"
version = "0.1.0"
description = "GMEOW validation-path lints PyO3 bindings: check_syntax() + check_sameas_ban() over oxigraph"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Blackcat Informatics® Inc." }]
keywords = ["rdf", "validation", "lint", "gmeow"]

[tool.maturin]
module-name = "gmeow_validate"
features = ["pyo3/extension-module"]
python-requires = ">=3.13"
