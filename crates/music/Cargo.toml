[package]
name = "gmeow-music"
description = "GMEOW music-package toolchain: GTS package I/O, notation renderers, and MusicXML import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "music", "gts", "musicxml", "notation"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
default = []

[dependencies]
gmeow-errors = { path = "../errors" }
# The mandatory GTS authorship profile: `piece_to_gts_bytes` emits a shipped
# bundle (written to disk by `import_file`), so it goes through the one permitted
# production entry rather than calling the writer directly.
gmeow-gts-profile = { path = "../gts-profile" }
purrdf.workspace = true
roxmltree.workspace = true
