[package]
name = "gmeow-cli-core"
description = "Shared CLI foundation (console modes, reporters, tracing, exit codes) reused by the gmeow and gmeow-dev binaries."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "clap", "diagnostics", "reporter", "gmeow"]

[lib]
path = "src/lib.rs"

[dependencies]
gmeow-errors = { path = "../errors" }
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "0.6"
indicatif = "0.17"
comfy-table = "7"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# RAII temp directories/files for tests. Every scratch path a test creates is
# removed on drop — including on panic and early return — so a gate run never
# leaves `gmeow-*` litter behind in the system temp dir. Hand-rolling a path
# under `std::env::temp_dir()` is banned by the repo-static guard
# (`check_no_unmanaged_temp_dir` in crates/validate/src/repo_static.rs).
tempfile.workspace = true
