[package]
name = "xtask"
description = "Worktree-local DAG orchestration for GMEOW developer workflows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
gmeow-build-inputs = { path = "../build-inputs" }
cargo-config2.workspace = true
gmeow-action-cache = { path = "../action-cache" }
serde_json.workspace = true
gmeow-errors = { path = "../errors" }

# RAII owns the controller's exact source-selection document and synthetic tests.
tempfile.workspace = true
