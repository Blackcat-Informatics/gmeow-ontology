# gitleaks configuration for gmeow-ontology.
#
# Keep the full upstream default ruleset; layer a path allowlist for generated
# byte-faithful projections of gmeow.gts whose content-addressed identifiers
# trip generic-secret heuristics. `.gitleaksignore` continues to hold the
# line-fingerprint ignores for stable fixtures; this file carries path-scoped
# allowlists for generated artifacts whose line numbers shift on regeneration.
title = "gmeow-ontology gitleaks config"

[extend]
useDefault = true

[allowlist]
description = """
The generated purrdf LPG GraphML projection (generated/lpg/graphml/graph.graphml)
encodes each RDF property as a `RdfProp_<sha256>` GraphML key id and carries
hex-encoded property payloads on `<data>` elements. These are content-addressed
digests, not secrets. The file is a regenerated byte-faithful projection of
gmeow.gts, so line-fingerprint ignores would break on every `make regen`; scope
the allowlist to the path instead. Both the prefixed and unprefixed path forms
that gitleaks reports are matched.
"""
paths = [
  '''(^|/)lpg/graphml/graph\.graphml$''',
]
