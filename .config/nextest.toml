[profile.default]
slow-timeout = { period = "60s", "terminate-after" = 2, "grace-period" = "30s" }
retries = { backoff = "fixed", count = 2, delay = "1s" }

[profile.ci]
inherits = "default"
junit = { path = "target/nextest/ci/junit.xml" }
fail-fast = false
