<!doctype html>
<html lang="en">
<head>

  <title>shacl diagnostics</title>

    body { font-family: system-ui, sans-serif; margin: 2rem; color: #17202a; }

    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #d8dee9; padding: 0.5rem; text-align: left; vertical-align: top; }
    th { background: #f3f4f6; }
    .sev { border-radius: 4px; color: white; display: inline-block; font-size: 0.8rem; min-width: 4.5rem; padding: 0.2rem 0.4rem; text-align: center; }
    .sev-error { background: #b42318; }
    .sev-warning { background: #b54708; }
    .sev-note, .sev-info { background: #175cd3; }
    .suggestions { margin: 0.25rem 0 0 0; padding-left: 1.2rem; color: #4b5563; font-size: 0.9rem; }
    .help { color: #175cd3; font-size: 0.85rem; margin-left: 0.4rem; text-decoration: none; }

</head>

<tr><td><span class="sev sev-info">info</span></td><td>shacl.clean</td><td>SHACL validation passed: no findings<a class="help" href="https://blackcatinformatics.ca/gmeow/docs/enforced-constraints#shacl-">ℹ help</a></td><td></td></tr>
