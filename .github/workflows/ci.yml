name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI artifacts must not inherit the repo's local `target-cpu=native` default.
  # This target-specific env appends after .cargo/config.toml; the last
  # -Ctarget-cpu wins while wasm/cross-target jobs stay unaffected.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zunstable-options -Clink-self-contained=+linker -Clinker-features=+lld -Ctarget-cpu=x86-64-v3"
  CARGO_ENV_CFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CXXFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CFLAGS_FORCE: "true"
  CARGO_ENV_CXXFLAGS_FORCE: "true"

# The quality gate is split into independent jobs that run in parallel. The repo
# is Rust-only: every job builds the gmeow-dev / gmeow-lsp binaries from the Rust
# workspace (nightly toolchain + Swatinem rust-cache); there is no Python surface,
# Python package environment, or prebuilt CPython extension wheel anymore.
#
# Diagnostics SARIF taxonomy: each job's per-category SARIF is uploaded to code
# scanning under a category == the JOB name, and its artifacts land under
# `dist/diagnostics/<category>/`. Wired here: `rust` (gmeow-lsp rust diagnostics).
# Uploads are fork-safe: only push + same-repo PRs hit code scanning; fork PRs
# fall back to a workflow artifact (their token lacks security-events: write).
jobs:
  # === SOURCE-BUILT PRODUCER BINARY ===
  # Build gmeow-dev once for the exact Rust source + toolchain contract. Ontology-only
  # changes reuse that immutable producer binary; Rust changes miss the exact-source
  # cache and rebuild it. No consumer is compiled before generated/dist/gmeow.gts exists.
  producer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Fingerprint the resolved Rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          sha256=$(rustc -Vv | sha256sum | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Restore exact-source producer binary
        id: producer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/bin/gmeow-dev
          key: producer-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sha256 }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'Makefile', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'vendor/**') }}

      - name: Cache Cargo dependencies
        if: steps.producer-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build the producer (gmeow-dev only)
        if: steps.producer-cache.outputs.cache-hit != 'true'
        run: make producer-build

      - name: Verify the producer binary
        run: |
          set -euo pipefail
          chmod +x dist/bin/gmeow-dev
          dist/bin/gmeow-dev version

      - name: Upload the exact producer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin/gmeow-dev
          if-no-files-found: error
          retention-days: 1

  # === TWO INDEPENDENT COLD GENERATIONS ===
  # Both runners start without generated/ or a pipeline cache and reconstruct the
  # complete generated tree from the same source-built producer. They run concurrently,
  # so the hard two-generation determinism proof costs one generation on the critical
  # path rather than two additional serial generations.
  generation:
    name: generation (${{ matrix.generation }})
    needs: [producer-build]
    strategy:
      fail-fast: false
      matrix:
        generation: [a, b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the exact producer binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gmeow-dev-producer-${{ github.sha }}
          path: dist/bin

      - name: Make the producer executable
        run: chmod +x dist/bin/gmeow-dev

      # Update mode runs the superset, declared-inventory completeness, fanout-
      # bijection, drift, orphan, and internal-tag-leak gates while materializing.
      - name: Cold-materialize the generated product
        run: make regen GMEOW_DEV=./dist/bin/gmeow-dev SYNC_MODE=update SYNC_OUTPUTS=generated

      - name: Strict sync fixed-point + drift/orphan gate (read-only)
        run: make check-sync GMEOW_DEV=./dist/bin/gmeow-dev CHECK_SYNC_MODE=check

      - name: GTS frame/profile gate
        run: make gts-frame-profile-gate GMEOW_DEV=./dist/bin/gmeow-dev

      - name: Upload independent generated tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-tree-${{ github.sha }}-${{ matrix.generation }}
          path: generated
          if-no-files-found: error
          retention-days: 1

  # === SINGLE PRODUCER AUTHORITY ===
  # Byte-compare both independently reconstructed trees, publish generation A as the
  # one immutable artifact, and expose its bundle digest. Every downstream job consumes
  # this exact authority artifact and never regenerates it.
  producer:
    needs: [generation]
    runs-on: ubuntu-latest
    outputs:
      bundle_digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Download generation A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}-a
          path: generated-a

      - name: Download generation B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}-b
          path: generated-b

      - name: Prove byte-identical independent generations
        run: diff --recursive --brief --no-dereference generated-a generated-b

      - name: Compute the bundle digest (artifact identity)
        id: digest
        run: |
          set -euo pipefail
          sha256=$(sha256sum generated-a/dist/gmeow.gts | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "producer bundle sha256=$sha256"

      - name: Upload the authoritative generated tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated-a
          if-no-files-found: error
          retention-days: 3

  lint:
    needs: [producer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Download the producer-materialized generated/ tree and validate its bundle
      # digest before any cargo compile (make lint's clippy hook builds the consumers,
      # whose build.rs embeds generated/dist/gmeow.gts).
      - name: Download the producer-materialized generated/ tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      # `make lint` runs the pre-commit hygiene suite directly (the Rust-only
      # config: cargo fmt/clippy, spelling, YAML, actions, secrets). pre-commit is
      # installed via pipx (preinstalled on the runner image); each hook manages
      # its own environment.
      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # `make lint` runs scripts/lint-issue-refs.sh, which hard-requires ripgrep;
      # it is not present on the runner image by default.
      - name: Install ripgrep
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: ripgrep

      - name: Lint gate
        run: make lint

  # Sharded across 3 runners via nextest's `--partition count:N/3` (balances the
  # test set across shards). All shards share the same Swatinem rust-cache key, so
  # each restores the same compiled `target/` and only pays an incremental recompile
  # plus ~1/3 of the test runtime. The whole-workspace gates (fmt/clippy/doctests)
  # run ONLY on shard 1 — they need not run 3×.
  # Each shard uses the runner's available CPU width. Tests that create their own
  # full-width worker pool reserve that runner through nextest's `num-cpus`
  # weight; no fixed global or test-group concurrency cap throttles the suite.
  rust:
    needs: [producer]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    # security-events: write lets shard 1's rust-category SARIF surface in the
    # Security tab via upload-sarif.
    permissions:
      contents: read
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Nightly is required by gmeow-logic's targeted `portable_simd` kernels.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The producer-materialized tree must be present before any workspace compile —
      # gmeow-cli / gmeow-lsp embed generated/dist/gmeow.gts, and the docs tests read
      # generated/catalog/*.nq. Download it and validate the bundle digest; never regenerate.
      - name: Download the producer-materialized generated/ tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-nextest

      - name: Format gate
        if: ${{ matrix.shard == 1 }}
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        if: ${{ matrix.shard == 1 }}
        run: cargo clippy --all-targets -- -D warnings

      # Fail on broken/redundant public rustdoc intra-doc links so the API docs
      # stay navigable. Shard 1 only (it need not run 3×); private-item links are
      # allowed (see the make target's RUSTDOCFLAGS).
      - name: Rust API docs (broken-link gate)
        if: ${{ matrix.shard == 1 }}
        run: make rust-docs

      # The fixture is ~600 MB as raw JSON but highly compressible. Actions/cache
      # stores it compressed, avoiding the 3–4 minute cold model + three-language
      # render on every shard after the first run for a content state. This key is
      # exact (no prefix restore): it covers the same authored inputs and local
      # implementation sources as `fixture::cache_key`. The in-process key remains
      # authoritative, so even an accidentally over-broad workflow restore can
      # only miss and rebuild; it cannot serve a stale envelope.
      # The catalog inputs the docs model reads (generated/catalog/*.nq) are a pure
      # function of their canonical sources (slices/** + metadata/ + dsl/mappings/) and
      # the producer/toolchain fingerprint (Cargo.lock + crates/**), all hashed below —
      # so the key is keyed on those SOURCES, never on the git-ignored generated/** product.
      - name: Cache docs-model fixture
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docs-fixture
          key: docs-fixture-v3-${{ runner.os }}-${{ hashFiles('slices/**', 'shapes/**', 'i18n/**', 'queries/**', 'docs/four-boxes.md', 'metadata/gmeow-self.ttl', 'dsl/mappings/mapping-sets.ttl', 'crates/pipeline/src/**', 'crates/docs/src/**', 'crates/docs/templates/**', 'crates/docs/assets/**', 'crates/docs/Cargo.toml', 'crates/errors/src/**', 'crates/errors/Cargo.toml', 'crates/logic-compile/src/**', 'crates/logic-compile/Cargo.toml', 'crates/validate/src/**', 'crates/validate/Cargo.toml', 'Cargo.lock') }}

      # Build the gmeow-docs model fixture once so every docs test loads it warm.
      # Without this each docs test rebuilds the same DocsModel in its own process.
      # The content-addressed cache removes that redundant work from every shard.
      - name: Prime docs-model fixture cache
        run: cargo run -q --package gmeow-docs --example prime-docs-fixture

      # The serialized StageProduct is only ~10 MB. An exact workflow key avoids
      # rebuilding it on all three runners when neither compiler code nor declared
      # stage inputs changed. The embedded BUILD_FINGERPRINT + input digest remains
      # authoritative and turns any toolchain/key mismatch into a cold miss.
      - name: Cache compile-logic fixture
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pipeline-test-fixtures
          key: compile-logic-fixture-v1-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', 'Cargo.lock', 'ontology/gmeow.ttl', 'slices/*/*/module.ttl', 'imports/**/*.ttl', 'validations/openehr-bloodpressure/Blutdruck.opt', 'validations/openehr-test-datatypes/TestAllDatatypes.opt', 'slices/grounding/logic/examples/predicate-paths.ttl') }}

      - name: Workspace tests (cargo-nextest) (shard ${{ matrix.shard }}/3)
        run: cargo nextest run --profile ci --workspace --partition count:${{ matrix.shard }}/3

      - name: Doctests
        if: ${{ matrix.shard == 1 }}
        run: cargo test --doc --workspace

      # Per-category diagnostics: emit the user-facing rust diagnostics SARIF via
      # gmeow-lsp. Non-gating (continue-on-error) — it only projects findings for
      # code scanning. Shard 1 only (it need not run 3×).
      - name: gmeow-lsp rust diagnostics SARIF (per-category rust, non-gating)
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        run: make diagnostics-rust-sarif

      - name: Upload rust diagnostics SARIF
        if: ${{ matrix.shard == 1 }}
        uses: ./.github/actions/upload-diagnostics-sarif
        with:
          sarif_file: dist/diagnostics/rust/gmeow-feedback.sarif
          artifact_path: dist/diagnostics/rust/
          category: rust
          artifact_name: diagnostics-rust

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-report-rust-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Rust Tests (shard ${{ matrix.shard }}/3)
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  # === ONTOLOGY GATE LANES ===
  # Four parallel jobs, each building the gmeow-dev binary from the Rust workspace
  # (nightly toolchain + rust-cache) and running a disjoint slice of the gmeow-dev
  # gates. GitHub Actions has no native step-reuse, so the toolchain setup is
  # repeated per job; the rust-cache keeps the compile incremental. Grouping
  # balances wall-time, isolating the long poles (validate and strict sync)
  # into separate jobs.
  #
  # Every remaining gate lands in exactly one job:
  #   ontology-validate  : validate
  #   ontology-generated : sync, constitution-check, crate-check
  #   ontology-reason    : reason-verify, acceptance, coverage, coherence gate teeth
  #   ontology-misc      : mappings, wikidata, alignment/i18n/doc lints, audit,
  #                        slice-quality, golden soak, compliance-report
  ontology-validate:
    needs: [producer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Download the producer-materialized generated/ tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      # Persist the content-addressed `.cache/validate` across runs. Every
      # validate phase (merged-SHACL, the per-example SHACL passes, the DSL passes)
      # is wrapped in a content-keyed cache with no TTL; a stale restore self-heals
      # because a mismatched in-process key is simply a miss. Without this, CI pays
      # the full cold cost every run (the per-example passes dominate). `.cache/` is
      # gitignored, so this workflow cache is the only persistence. The key is a
      # coarse content hint over the validated sources + the Rust validator; the
      # authoritative invalidation stays the in-process content key.
      - name: Cache validate (content-addressed SHACL findings)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/validate
          key: validate-${{ runner.os }}-${{ hashFiles('slices/**/*.ttl', 'shapes/**/*.ttl', 'dsl/**/*.ttl', 'crates/shacl/**/*.rs', 'crates/validate/**/*.rs') }}
          restore-keys: |
            validate-${{ runner.os }}-

      - name: Validate (syntax, lint, SHACL, DSL SHACL)
        run: make validate

  ontology-generated:
    needs: [producer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The authoritative sync + strict fixed-point / drift / orphan gate runs ONCE in the
      # producer job. Here we consume its exact artifact and validate the bundle digest —
      # never a second regeneration — then run the checks that read the materialized tree.
      - name: Download the producer-materialized generated/ tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Constitution check (every principle has live enforcement)
        run: make constitution-check

      - name: Crate layering and acyclic dependency graph
        run: make crate-check

  ontology-reason:
    needs: [producer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Download the producer-materialized generated/ tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-nextest

      - name: Native reason + reasoned-graph verify (one closure)
        run: make reason-verify

      - name: Transpile acceptance — hard aggregate recall floor
        run: make acceptance

      - name: Vendored-entity coverage — hard class/predicate floors
        run: make coverage

      - name: Whole-ontology poisoned-witness and relator-mediation proofs
        run: make coherence-gate-teeth

  ontology-misc:
    needs: [producer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Download the producer-materialized generated/ tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Mappings → axioms + linksets, QID syntax
        run: make mappings

      - name: Wikidata QID/PID syntax gate
        run: make wikidata

      - name: Alignment direction lint
        run: make lint-alignment

      - name: Claim audit gates on the worked fixture
        run: make audit

      - name: Translation catalog integrity
        run: make i18n-lint

      - name: Ontology documentation links and coverage
        run: make doc-lint

      - name: Slice-quality floors and projection-vocabulary ratchets
        run: make slice-quality-gate

      - name: Deterministic native-vs-golden soak
        run: make bench-soak

      - name: Compliance report (per-principle gate evidence)
        run: make compliance-report

  # purrdf wasm build + Node real-execution lane (P10). The in-memory RDF/JS
  # engine MUST compile to wasm32-unknown-unknown (`make wasm` hard-fails if the
  # target is absent in CI), and the actual wasm is exercised through the public
  # RDF/JS surface in Node — including the RDF-1.2 wedge (directional literals +
  # quoted-triple terms) that no incumbent RDF/JS library carries.
  wasm:
    needs: [producer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Nightly to match the workspace toolchain; the wasm32 target is provisioned
      # explicitly (rust-toolchain.toml also lists it, kept in lockstep here).
      - name: Install Rust (nightly + wasm32)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The Node round-trip validates a sample dataset against the materialized bundle,
      # so the producer artifact must be present before make validate-wasm-pkg-test.
      - name: Download the producer-materialized generated/ tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-tree-${{ github.sha }}
          path: generated

      - name: Validate the producer artifact digest (identity, not regeneration)
        env:
          BUNDLE_DIGEST: ${{ needs.producer.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_DIGEST}  generated/dist/gmeow.gts" | sha256sum -c -

      - name: Build purrdf + gmeow-logic-compile + the Tier-1 validator for wasm32 (engine + bindings + purity gates)
        run: make wasm

      # wasm-bindgen CLI must match the pinned `wasm-bindgen` crate (=0.2.125) byte
      # for byte, or it refuses to generate the JS bindings.
      - name: Install wasm-bindgen-cli (pinned to the crate version)
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: wasm-bindgen-cli@0.2.125

      # wasm-opt (binaryen) is a REQUIRED build step: `make validate-wasm-pkg` /
      # `validate-wasm-pkg-test` hard-fail without it. Provision a PINNED official
      # release explicitly so the hard
      # dependency — and the optimized artifact bytes — are reproducible, rather than
      # relying on whatever the runner image happens to preinstall.
      - name: Install binaryen (wasm-opt) — pinned release
        env:
          BINARYEN_VER: version_119
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VER}/binaryen-${BINARYEN_VER}-x86_64-linux.tar.gz"
          mkdir -p /tmp/binaryen
          tar xzf /tmp/binaryen.tar.gz -C /tmp/binaryen --strip-components=1
          echo "/tmp/binaryen/bin" >> "$GITHUB_PATH"
          /tmp/binaryen/bin/wasm-opt --version

      # ubuntu-latest ships a current Node; `make wasm-parity` is the CHECK_DAG task that
      # builds all three gmeow-owned wasm engine npm packages (validate / reason / gmn)
      # and runs their Node native↔wasm parity witness lanes against the real wasm over the
      # materialized bundle — the "every gmeow surface proven native≡wasm" contract. The
      # purrdf RDF/wasm engine ships + tests its own npm package on purrdf's CI.
      - name: Native≡wasm parity — all three gmeow engines (make wasm-parity)
        run: make wasm-parity

  # Aggregator gate. Branch protection requires the "quality" context; this job
  # keeps that single required check stable while the work runs in parallel
  # above. `if: always()` guarantees it reports a definite success/failure
  # (never a merge-blocking "skipped") and fails if any parallel job did not.
  #
  # The classic Java/Docker oracle lane has been REMOVED (Principle 18), and the live
  # in-process `purrdf::entail` differential cross-check that once replaced it has
  # also been REMOVED. The native `logic:` engine is now the sole on-gate reasoning
  # authority: `ontology-reason` runs `make reason-verify` (one closure, native
  # consistency/entailment verify + reasoned-graph negatives) with no live second or
  # differential reasoner on any required gate. The required gate stays Docker-free
  # and Java-free. Statements now run natively via the gmeow-rdf codec inside the
  # generated-artifact job's strict sync — there is no separate statements lane.
  quality:
    needs: [producer, lint, rust, wasm, ontology-validate, ontology-generated, ontology-reason, ontology-misc]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require all quality jobs to have succeeded
        env:
          PRODUCER: ${{ needs.producer.result }}
          LINT: ${{ needs.lint.result }}
          RUST: ${{ needs.rust.result }}
          WASM: ${{ needs.wasm.result }}
          ONTOLOGY_VALIDATE: ${{ needs.ontology-validate.result }}
          ONTOLOGY_GENERATED: ${{ needs.ontology-generated.result }}
          ONTOLOGY_REASON: ${{ needs.ontology-reason.result }}
          ONTOLOGY_MISC: ${{ needs.ontology-misc.result }}
        run: |
          echo "results: producer=$PRODUCER lint=$LINT rust=$RUST wasm=$WASM ontology-validate=$ONTOLOGY_VALIDATE ontology-generated=$ONTOLOGY_GENERATED ontology-reason=$ONTOLOGY_REASON ontology-misc=$ONTOLOGY_MISC"
          for r in "$PRODUCER" "$LINT" "$RUST" "$WASM" "$ONTOLOGY_VALIDATE" "$ONTOLOGY_GENERATED" "$ONTOLOGY_REASON" "$ONTOLOGY_MISC"; do
            if [ "$r" != "success" ]; then
              echo "::error::a quality job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required quality jobs succeeded (single producer artifact; native reasoning + reasoned-graph verify run in the reason lane)"

      - name: Check out the proven source revision
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust for receipt generation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Emit exact successful-check receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: cargo xtask receipt create --out dist/check-receipt.txt

      - name: Upload successful-check receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gmeow-check-receipt-${{ github.sha }}
          path: dist/check-receipt.txt
          if-no-files-found: error

      - name: Attest successful-check receipt provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v3.1.0
        with:
          subject-path: dist/check-receipt.txt
