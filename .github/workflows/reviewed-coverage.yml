name: Reviewed translation coverage

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
    -Zunstable-options -Clink-self-contained=+linker
    -Clinker-features=+lld -Ctarget-cpu=x86-64-v3
  CARGO_ENV_CFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CXXFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CFLAGS_FORCE: "true"
  CARGO_ENV_CXXFLAGS_FORCE: "true"

concurrency:
  group: reviewed-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-09-05
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Refresh the reviewed-coverage golden from live catalogs
        run: make maint-refresh-reviewed-coverage-golden
      - name: Upload the produced golden for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-coverage-${{ github.sha }}
          path: crates/docs/tests/fixtures/reviewed_coverage_golden.json
          if-no-files-found: error
