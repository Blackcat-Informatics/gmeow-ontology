# cargo-mutants config (T9): grade whether the suite actually catches
# regressions. Scoped to the logic + validate cores; benches/tests/generated are
# not mutated. nextest is the runner (process-per-test → faster, non-flaky).
# This is report-only and runs OFF the required gate (the scheduled suite-quality
# workflow); the full logic-core run is hours, so locally use `-p <crate> -f <file>`.
#
# Known surviving-mutant backlog (T9 time-boxed validate triage): the
# constitution.rs literal_i64/literal_string cluster was killed; survivors still
# open for future kill-or-justify: crates/validate/src/cache.rs `sanitize_kind`
# boolean logic, constitution.rs `is_rdfs_class` / the `|=` accumulator, and
# findings.rs `Location.logical` field. The scheduled job re-surfaces them.
test_tool = "nextest"
examine_globs = [
    "crates/logic/src/**",
    "crates/validate/src/**",
]
exclude_globs = [
    "crates/*/benches/**",
    "crates/*/src/py.rs",
]
timeout_multiplier = 3.0
minimum_test_timeout = 120
