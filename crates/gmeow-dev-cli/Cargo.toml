[package]
name = "gmeow-dev-cli"
description = "The repo-maintenance `gmeow-dev` command surface (sync, fanout, reason, verify, mappings, i18n, and the developer toolchain)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "gmeow", "sync", "pipeline", "developer"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gmeow-dev"
path = "src/main.rs"

[dependencies]
gmeow-cli-core = { path = "../cli-core" }
clap = { version = "4", features = ["derive"] }
gmeow-ns = { path = "../ns" }
gmeow-errors = { path = "../errors" }
# The repo-maintenance engines the dev toolchain drives (default features, no python).
gmeow-pipeline = { path = "../pipeline" }
# The DEVELOPER MCP surface `gmeow-dev mcp` serves: the consumer engine (pulled in
# transitively) plus the four repo-reading tools this crate's checkout makes
# possible, registered through the MCP extension seam.
gmeow-mcp-dev = { path = "../mcp-dev" }
# The consumer engine itself: the medium gate reads the bundle's medium resource off a
# real `McpServer`, which is the surface a consumer actually sees.
gmeow-mcp = { path = "../mcp" }
gmeow-logic = { path = "../logic" }
gmeow-bundle-import = { path = "../bundle-import" }
gmeow-logic-compile = { path = "../logic-compile" }
gmeow-validate = { path = "../validate" }
gmeow-docs = { path = "../docs" }
# The ONE mandated GMEOW GTS authorship door: the feedback bundle is authored GMEOW GTS,
# so it goes through the profile rather than purrdf's raw writer.
gmeow-gts-profile = { path = "../gts-profile" }
# Self-cleaning system temp dirs. A NORMAL (not dev-only) dependency: the slice-quality
# ratchet materializes the merge-base authoring surfaces into one on the PRODUCTION gate
# path, and the guard is what removes that tree on a hard-failing gate and while unwinding
# from a panic. Hand-rolling a path under `std::env::temp_dir()` is banned by
# `check_no_unmanaged_temp_dir` in crates/validate/src/repo_static.rs.
tempfile.workspace = true
# The docs MODEL, direct: `doc-lint` loads the model from the content-addressed
# shared `.cache/gmeow-sync/actions/` store, whose model half + action key live in this crate
# (`gmeow_docs_model::fixture`) so that every model consumer — `gmeow-slice-quality`
# included — can reach the cache without an edge to the renderer. The renderer-side
# site loader still comes from `gmeow-docs` above.
gmeow-docs-model = { path = "../docs-model" }
docs-print = { path = "../docs-print" }
gmeow-slice-quality = { path = "../slice-quality" }
gmeow-music = { path = "../music" }
gmeow-foundation-corpus = { path = "../foundation-corpus" }
# The RDF-1.2 umbrella: GTS read/fold, the slice ownership/fix-deps analyzer, and
# the OpenPGP secret-key parse the signed release/compile-gts lanes need.
purrdf.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The dependency-free license-token policy classifier the `extract` guard uses.
gmeow-license = { path = "../license" }
# The trust-policy TOML the signed-bundle `validate` pre-gate reads.
toml = "0.8"
# The repo HTTP client for the `refresh-target-axioms` re-vendor lane.
ureq = "3"
# CBOR public-metadata extraction for the feedback-bundle blob reader.
ciborium.workspace = true

[dev-dependencies]
assert_cmd = "2"
trycmd = "0.15"
predicates = "3"
