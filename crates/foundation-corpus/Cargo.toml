[package]
name = "gmeow-foundation-corpus"
description = "Foundation-corpus importer (#364): reads a narrative JSONL corpus into a GMEOW RDF graph and emits foundation.ttl, a flat-vs-reified budget report, and six lossy projections (DraCor/Syuzhet/schema.org/TEI/Web-Annotation/training-manifest)."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "narrative", "corpus", "knowledge-graph", "projection"]

[lib]
# rlib-only: this crate does NOT ship a standalone PyO3 extension. Its binding
# (#944, src/py.rs) is linked into the single `gmeow_native` cdylib
# (crates/native, #630). The `python` feature gates `src/py.rs`.
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
# Builds the PyO3 binding (`src/py.rs`) exposing `import_foundation` to Python,
# linked into the unified `gmeow_native` cdylib (#944). Without it the crate is a
# pure rlib (no pyo3).
python = ["dep:pyo3"]

[dependencies]
# Native RDF 1.2 graph building over the IR (no rdflib, no oxigraph).
gmeow-rdf = { path = "../rdf" }
serde = { version = "1", features = ["derive"] }
# Keep serde_json's workspace-wide default map semantics. Ordered JSON-LD
# projection keys are emitted by a crate-local writer in projections.rs.
serde_json = "1"
# NFKD normalization for _slug (matches Python unicodedata.normalize("NFKD", ...)).
unicode-normalization = "0.1"
# pyo3 is pulled ONLY by the `python` feature (maturin builds the unified
# `gmeow_native` cdylib). Same version/abi3 as the other engine crates.
pyo3 = { version = "0.29", features = ["abi3-py313"], optional = true }

[dev-dependencies]
tempfile = "3"
# Acceptance-spine parity test (#944): whole-ontology native SHACL + native SPARQL
# over the imported foundation.ttl — OXIGRAPH-FREE (EPIC #906). The fixture parses
# through the canonical native codec (`gmeow_rdf::parse_dataset`) into a frozen
# `RdfDataset` (`gmeow-rdf-core`), validated IR-natively via `validate_dataset_graphs`
# and queried through the native `NativeSparqlEngine` (`gmeow-sparql-eval`).
gmeow-shacl = { path = "../shacl" }
gmeow-rdf-core = { path = "../rdf-core" }
gmeow-sparql-eval = { path = "../sparql-eval" }
