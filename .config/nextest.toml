[profile.default]
# Wall-clock duration is not a correctness gate. The repeated slow timeout is only
# a runaway backstop; it is never used to classify a test as correct or incorrect.
#
# The exclusions below are architectural lanes with an independently invoked owner:
# whole-external-corpus and exhaustive consumer proofs run in the maintainer breadth
# lane; the two medium consumers run through the required CI heavy lane. Carrier purity
# and coherence teeth remain in this default inventory so the authenticated archive is
# their only build/execution authority. No test is excluded merely because one contended
# sample was slow.
#
# Every clause is justified INDIVIDUALLY below, in the order it appears, because "the
# exclusions are architectural" is a claim about fifteen different decisions and a reader
# checking any one of them cannot tell which. The justification lives here rather than
# beside each clause because a nextest filterset is an EXPRESSION, not a config table: it
# rejects `#` outright ("expected expression"), so there is no inline position to write in.
# `every_default_filter_clause_is_justified` pins the correspondence positionally, so a
# clause added without a reason — or a reason left behind by a deleted clause — reds.
#
# Unless a clause says otherwise, its off-gate home is `make maint-rust-heavy`: the
# maintainer profile's own filter excludes only three named tests, so everything the
# per-commit lane drops here is admitted there by construction.
#
#  1. `deep_surfaces_entailed_inconsistency…_heavy_offgate` — the Tier-2 deep-reasoner
#     miss surface. Breadth priced by the whole reasoned closure, not by the edit.
#  2. `maint_heavy_conformance_contracts_share_one_authenticated_corpus_heavy_offgate` —
#     the exhaustive twin of the required
#     `required_conformance_contracts_share_one_authenticated_corpus`, which stays
#     on-gate. Same corpus, same process discipline, exhaustive inventory.
#  3. `projections::tests::up_project_(recovers_message_superclass_via_prp_dom|
#     never_fabricates_subkind_or_sibling)` — SIOC up-projection over the real corpus.
#  4. `full_divergence_gate` `_heavy_offgate` — the 154-case soundness-scaling proof.
#     Runtime is set by corpus breadth, which is criterion 2 of P6.
#  5. `cli_parity::project_view_over_the_snapshot` — drives `project --profile gmeow`
#     across the committed snapshot and writes a Turtle artifact.
#  6. The `gmeow-cli` `cli` describe/project/export group — nine whole-bundle consumer
#     verbs. Each folds the shipped bundle to answer one surface question.
#  7. `bundle_smoke::describe_names_a_known_term` — a second whole-bundle fold for one
#     describe lookup.
#  8. `extract_roundtrip::rendered_tree_is_disk_faithful` — writes the ENTIRE rendered
#     site to disk and reads every file back.
#  9. `describe::tests::every_grounding_namespace_has_describable_terms_that_render` —
#     the whole-repository grounding-namespace proof. This is the clause whose silent
#     un-matching, when `describe` moved crates, put it back on-gate and timed out
#     thirteen unrelated tests; see `nextest_override_contract.rs`.
# 10. `describe_bundle_language::describe_resolves_carrier_tags_against_shipped_bundle` —
#     a whole-bundle fold per carrier tag. Its own comment records that one
#     representative non-English carrier is what keeps it inside any time budget.
# 11. `gmeow-mcp` `_heavy_offgate` — the breadth-priced whole-bundle overlay and
#     explain-quad proofs. The focused verifier laws stay on-gate as
#     `required_mcp_contracts_share_one_authenticated_view`.
# 12. `self_sufficiency` `_heavy_offgate` — one exhaustive full-width transpile over the
#     authenticated snapshot; the required lane keeps the blinded installed-binary read
#     plus the fixture-scale fan-out/leak proof (see its own override below).
# 13. `mcp-dev` `the_reason_tool_…_heavy_offgate` — runs the native reasoner over the
#     bundle's carrier graph to report its four status axes.
# 14. `gmeow-cli` `medium_cli` — one of the two medium consumers. NOT maint-rust-heavy:
#     its home is the REQUIRED CI lane `make medium-consumer-surface`, so it gates every
#     pull request. See the Makefile target for why it is a consumer-verb contract over
#     shipped bytes rather than a producer.
# 15. `gmeow-dev-cli` `medium_gate` — the other medium consumer; same required CI lane.
default-filter = '''
  not (
    (package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/))
    | (package(gmeow-validate) & binary(conformance_suite) & test(maint_heavy_conformance_contracts_share_one_authenticated_corpus_heavy_offgate))
    | (package(gmeow-pipeline) & test(/projections::tests::up_project_(recovers_message_superclass_via_prp_dom|never_fabricates_subkind_or_sibling)/))
    | (package(gmeow-conformance) & binary(full_divergence_gate) & test(/_heavy_offgate/))
    | (package(gmeow-dev-cli) & binary(cli_parity) & test(project_view_over_the_snapshot))
    | (package(gmeow-cli) & binary(cli) & (test(export_respects_language_selector) | test(project_schema_org_view_filter) | test(project_unknown_view_fails) | test(describe_env_language_rejected_if_unknown) | test(describe_resolves_grounding_curies) | test(describe_resolves_grounding_full_iris) | test(describe_unknown_language_fails_with_available_list) | test(describe_toon_format_emits_toon) | test(describe_json_format_is_valid_card_json)))
    | (package(gmeow-cli) & binary(bundle_smoke) & test(describe_names_a_known_term))
    | (package(gmeow-docs) & binary(extract_roundtrip) & test(rendered_tree_is_disk_faithful))
    | (package(gmeow-docs-model) & test(/describe::tests::every_grounding_namespace_has_describable_terms_that_render/))
    | (package(gmeow-docs) & binary(describe_bundle_language) & test(describe_resolves_carrier_tags_against_shipped_bundle))
    | (package(gmeow-mcp) & test(/_heavy_offgate/))
    | (package(gmeow-cli) & binary(self_sufficiency) & test(/_heavy_offgate/))
    | (package(gmeow-mcp-dev) & test(/tests::the_reason_tool_.*_heavy_offgate/))
    | (package(gmeow-cli) & binary(medium_cli))
    | (package(gmeow-dev-cli) & binary(medium_gate))
  )
'''
slow-timeout = { period = "60s", "terminate-after" = 2, "grace-period" = "30s" }
# Correctness failures are deterministic and terminal. Retrying a failed whole-bundle
# consumer can multiply the dominant suite cost threefold while hiding the first causal
# failure; flaky work must be fixed, not billed to every commit.
retries = 0
final-status-level = "slow"
success-output = "never"
failure-output = "immediate-final"

[profile.ci]
inherits = "default"
junit = { path = "junit.xml" }
fail-fast = false

# The maintainer breadth lane. `default-filter` restores every selector the required lane
# excludes — but it does NOT un-`#[ignore]` a test. `#[ignore]` is a libtest attribute and
# a filter expression cannot see it, so before `make maint-rust-heavy` began passing
# `--run-ignored all`, EVERY `#[ignore]`d test in this workspace ran in no lane at all: not
# on `make check`, not in the breadth lane, nowhere. One of them carried the attribute text
# "heavy lane only", which was therefore a false claim about the build — a defect of the
# same kind as a broken assertion (P11).
#
# `run-ignored` MUST NOT be written here. It is a command-line flag, not a profile key:
# nextest 0.9.137 answers a profile-level `run-ignored` with
#   warning: ignoring unknown configuration key: profile.maint-heavy.run-ignored
# and carries on, so putting it here looks like it enables the ignored tests while changing
# nothing — and a warning does not fail the gate. The flag lives on the `maint-rust-heavy`
# recipe in the Makefile, and `the_breadth_lane_actually_runs_ignored_tests` pins it there
# and forbids it here.
#
# Two families must still stay out. They are excluded BY NAME rather than by silence, so
# the decision is visible to the next reader instead of being rediscovered:
#
#   * The two lang-bridge corpus sweeps hard-fail without external data that deliberately
#     does not ship (a UD treebank would import CC BY-SA content; a bulk lexicon would
#     import third-party lexical content). Their own doc comments call an unset env var an
#     honest off-gate failure, so scheduling them here would red the lane for every
#     maintainer who has no local checkout. `make maint-lang-corpus-sweeps` runs them once
#     the maintainer points them at one.
#   * `measurement_is_deterministic_across_two_runs` calls `run_pipeline_products` — the
#     production DAG — and does it twice. A test may never rebuild the corpus (P1), so no
#     lane may schedule it; it stays a deliberate by-hand invocation.
[profile.maint-heavy]
inherits = "default"
# Each exclusion names its test in full rather than by a shared pattern, so
# `nextest_override_filters_all_match_a_live_test` can hold every one against the source
# tree. An abbreviated pattern would still match after a rename and silently readmit.
default-filter = '''
  not (
    (package(gmeow-lang-bridge) & test(maint_conllu_treebank_sweep))
    | (package(gmeow-lang-bridge) & test(maint_lexicon_extract_sweep))
    | (package(gmeow-pipeline) & test(measurement_is_deterministic_across_two_runs))
  )
'''
junit = { path = "junit.xml" }
fail-fast = false

# The MCP deep-validate pass drives the native deep reasoner over the WHOLE shipped bundle
# and states in its own doc comment that it runs "well past the 120 s on-gate nextest
# cliff". It is `#[ignore]`d and so only ever executes under `run-ignored` above; the
# inherited default budget would kill it at 120 s, which would make enabling it a
# load-shaped red rather than a verdict (P7). It reserves the natural host width for the
# same reason its sibling whole-bundle consumers do.
[[profile.maint-heavy.overrides]]
filter = 'package(gmeow-mcp) & test(validate_local_deep_pass_surfaces_deep_finding)'
threads-required = "num-cpus"
slow-timeout = { period = "900s", "terminate-after" = 2, "grace-period" = "30s" }

# These two required heavy-lane binaries consume the authenticated producer bundle in
# place. They never create a runtime store, tamper derivative, or fallback corpus.
[[profile.default.overrides]]
filter = 'package(gmeow-cli) & binary(medium_cli)'
slow-timeout = { period = "600s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-dev-cli) & binary(medium_gate)'
slow-timeout = { period = "600s", "terminate-after" = 2, "grace-period" = "30s" }

# These required consumers each restore or open the authenticated shipped bundle. A
# 32-CPU gate started all 28 together and every one reached the same
# 120-second runaway backstop without an assertion failure; the slice-lint witness passed
# unchanged in 31.013 seconds when run alone. Reserve the runner's natural width for only
# these exact tests so bundle decoding cannot oversubscribe itself. Their assertions,
# inventory, retries, and the default 120-second runaway backstop remain unchanged.
[[profile.default.overrides]]
filter = 'package(gmeow-bundle-view) & test(/^(export::tests::export_contracts_share_one_authenticated_fold|bundle_blobs::tests::bundle_reader_contracts_share_one_authenticated_parse)$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-pipeline) & binary(medium_bundle) & test(the_emitted_bundle_ships_its_declared_medium)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-affect) & binary(crosscheck_definiteness) & test(shipped_core_affect_gram_authored_pd_is_certified)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-cli) & test(/^commands::explain_tests::explain_(decomposes_a_chase_invented_null_in_the_shipped_bundle|walks_a_real_shipped_finding_and_hard_fails_unknown)$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-cli) & binary(cli) & test(/^(affect_intensity_schadenfreude_is_computed_from_the_metric|affect_goemotions_ingest_recover_round_trips_through_the_cli|affect_classify_finds_schadenfreude_prototype|describe_known_term_renders_prose|info_summarizes_the_bundle|validate_fail_file_sarif_is_well_formed|validate_fail_file_json_is_well_formed|logic_fragments_default_embedded_bundle_ships_the_manifest|mcp_serves_a_native_jsonrpc_initialize|validate_fail_file_exits_one_human|validate_clean_file_passes)$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-cli) & binary(bundle_smoke) & test(/^(verify_allow_unsigned_needs_no_external_gts_on_path|info_loads_the_shipped_bundle|validate_clean_fixture_passes)$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-cli) & binary(gmn_conformance) & test(/^gmn_verify_(fails_on_a_corrupted_vectors_dir|passes_over_the_committed_corpus|fails_on_a_tampered_pack_root)$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-cli) & binary(slice_brief_cli) & test(/^slice_brief_from_bundle_(json_serves_a_packet|unknown_slice_hard_fails|turtle_emits_the_packet_body)$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(gmeow-cli) & test(/^(installed_binary_reads_embedded_bundle_from_blinded_cwd|slice_lint_and_slice_quality_share_one_checkout_free_assessment|external_slice_bundle_contracts_share_one_bundle_decode)$/)'
threads-required = "num-cpus"

# Native-to-wasm parity restores the authenticated bundle into both engines.
[[profile.default.overrides]]
filter = 'package(gmeow-mcp-wasm) & binary(witness_mcp)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# Whole-bundle coherence reasons over an authenticated import and owns a full-width
# worker pool, so nextest must not nest another full-width job beside it.
[[profile.default.overrides]]
filter = 'package(gmeow-logic) & binary(coherence_gate)'
threads-required = "num-cpus"
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# This maintained installed-binary witness performs one exhaustive full-width transpile
# over the authenticated snapshot. The required lane retains a blinded installed-binary
# bundle read plus the fixture-scale production-chain fan-out/leak proof; this breadth
# witness remains maintained without billing every commit for the whole snapshot.
[[profile.default.overrides]]
filter = 'package(gmeow-cli) & binary(self_sufficiency) & test(transpile_blinded_lifts_and_fans_out_without_x_gmeow_leak_heavy_offgate)'
threads-required = "num-cpus"
slow-timeout = { period = "600s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/)'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

# The consolidated conformance runner links every authored case module into one binary.
# One required libtest drives the per-commit inventory; a second maint-heavy sibling retains
# the exhaustive inventory. Each process imports/parses the authenticated corpus once and
# drives its validation engine at natural host width, so nextest must not schedule another
# full-width process beside it. This reservation scales with the host; it is not a fixed cap.
[[profile.default.overrides]]
filter = 'package(gmeow-validate) & binary(conformance_suite)'
threads-required = "num-cpus"
slow-timeout = { period = "900s", "terminate-after" = 3, "grace-period" = "30s" }

# The native MCP contracts are one consolidated process per lane, so the immutable
# authenticated view and multi-gigabyte indexes are restored once rather than once per
# assertion. Focused verifier laws stay required; the breadth-priced whole-bundle overlay
# proof remains registered in the maintained aggregate.
[[profile.default.overrides]]
filter = 'package(gmeow-mcp) & test(/tests::(required|maint_heavy)_mcp_contracts_share_one_authenticated_view/)'
threads-required = "num-cpus"
slow-timeout = { period = "900s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-mcp-dev) & test(/tests::the_reason_tool_.*_heavy_offgate/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

# These translated-tree checks consume one already-produced docs model and compare the
# derived read surfaces; they do not rediscover or rebuild the repository model.
[[profile.default.overrides]]
filter = 'package(gmeow-docs) & test(/french_tree_shares_the_english_path_graph|translated_tree_preserves_the_no_dangling_link_invariant/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-docs) & binary(mdbook_render) & test(non_interactive_book_packs_no_engines)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-docs-model) & test(/describe::tests::every_grounding_namespace_has_describable_terms_that_render/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
filter = 'package(gmeow-docs) & binary(describe_bundle_language) & test(describe_resolves_carrier_tags_against_shipped_bundle)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }
