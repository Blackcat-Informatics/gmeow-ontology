[package]
name = "gmeow-music"
description = "GMEOW music-package toolchain: GTS package I/O, notation renderers, and MusicXML import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "music", "gts", "musicxml", "notation"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
default = []

[dependencies]
gmeow-errors = { path = "../errors" }
# The single mandatory GTS authorship profile: `piece_to_gts_bytes` ships a
# music package as GTS bytes, so its frames obey the same one-transform rule as
# the shipped bundle.
gmeow-gts-profile = { path = "../gts-profile" }
purrdf.workspace = true
roxmltree = "0.20"
