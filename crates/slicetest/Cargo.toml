[package]
name = "gmeow-slicetest"
description = "GMEOW native slice-test harness (#784): discovers and executes the slice-resident declarative test-DSL specs (competency questions, structural assertions, example-conformance) under cargo-nextest, off rdflib."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# oxigraph in-memory Store with RDF 1.2 (same version + features as the rest of
# the workspace): load slice graphs, run the competency/structural SPARQL, and
# compute the RDFS closure (CONSTRUCT rules) for the reasoning opt-in lane.
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
# Store construction (build_store), the SHACL Finding bridge (finding_from_shacl
# -> shacl.<LocalName>), and the scoped-overlay example-conformance path.
gmeow-validate = { path = "../validate" }
# SHACL engine: parse_shapes + validate for the ExampleConformance executor.
gmeow-shacl = { path = "../shacl" }

# NOTE: deliberately NO gmeow-logic / Nemo dependency. Competency reasoning is
# RDFS-only (computed natively in oxigraph; see src/stores.rs and docs/TESTING.md),
# which is seconds, not the ~4-minute OWL 2 RL chase — and keeps Nemo out of this
# crate's build graph entirely.

[dev-dependencies]
# File-driven test harness: one nextest case per discovered tests/*.ttl spec
# file, run in parallel. The headline speed win of #784 (T3).
datatest-stable = "0.3"

[[test]]
name = "slice_specs"
harness = false
