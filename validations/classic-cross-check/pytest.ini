#
# Suite-local pytest config. Its presence makes THIS directory pytest's rootdir,
# so the repository-root conftest.py (an ancestor, above confcutdir=rootdir) is
# NOT loaded — this lane is self-contained. `pythonpath = .` puts the relocated
# `oracles` package + `rdf12` module on sys.path for the tests.
[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
filterwarnings =
    ignore:Dataset.default_context is deprecated:DeprecationWarning
    ignore:Dataset.identifier is deprecated:DeprecationWarning
    ignore:ConjunctiveGraph is deprecated:DeprecationWarning
    ignore:The LinkML dataclass extension patch is deprecated:DeprecationWarning
markers =
    network: tests that require network access (Wikidata/OOPS!/FOOPS!)
    docker: tests that require Docker (ROBOT/Jena)
    maintainer: heavy / kept-Python-module tests
    classic_cross_check: legacy-oracle cross-check tests (ELK/HermiT/owlrl/rdflib)
