[package]
name = "gmeow-math"
description = "GMEOW reusable exact-rational geometry: an inner-product-space over a metric Gram matrix plus the pure math: graph loaders, computed OUTSIDE the reasoned core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gmeow", "geometry", "gram-matrix", "norm", "inner-product"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
purrdf = "0.4"
