[project]
name = "gmeow"
version = "1.0.2"
description = "GMEOW ontology tooling: refine, validate, reason over, document, and publish the Global Metadata and Entity Ontology for the Web."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Blackcat Informatics Inc." }]
keywords = ["ontology", "owl", "rdf", "linked-data", "gmeow", "fair"]
dependencies = [
    "rdflib>=7.6",
    "pyshacl>=0.31",
    "pylode>=3.4",
    "sssom>=0.4.16",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "fastmcp>=3.4",
    "linkml>=1.11",
    "PyYAML>=6.0",
    "duckdb>=1.5.3",
    "jsonschema>=4.23",
    "blake3>=0.4",
    "pyoxigraph>=0.5.8",
    # the GTS format engine — the publishable workspace member (packages/gts);
    # the range matters for non-workspace installs of downstream packages
    "gmeow-gts>=0.1.1,<0.2",
]

[project.scripts]
gmeow = "gmeow_tools.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "types-jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
    "owlrl>=6.0.2",  # pure-Python OWL 2 RL — fast, Docker-free entailment tests (#38)
    "pyoxigraph>=0.5.8",  # in-process RDF 1.2 cross-check (#177)
]

[tool.uv.workspace]
members = ["packages/gts"]

[tool.uv.sources]
gmeow-gts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmeow_tools"]

[tool.hatch.build.targets.wheel.force-include]
"generated/dist/gmeow-full.gts" = "generated/dist/gmeow-full.gts"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "packages/gts/src"]
# generated/ is owned by registered generators (#287); never lint outputs.
extend-exclude = ["generated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib (enforce Path over os.path strings)
    "RUF", # ruff-specific
    "D",   # pydocstyle (Google docstrings)
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # docstrings not required in tests
"slices/*/*/tests/*" = ["D"] # slice-local tests (#287), same rule

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src", "tests", "packages/gts/src"]

[[tool.mypy.overrides]]
# Third-party libraries without complete type information.
module = ["pylode.*", "sssom.*", "pyshacl.*", "owlrl.*", "pyoxigraph.*", "linkml.*", "linkml_runtime.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "slices", "packages/gts/tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that require network access (Wikidata/OOPS!/FOOPS!)",
    "docker: tests that require Docker (ROBOT/WIDOCO/Jena)",
    "ci_only: heavy secondary/external-export transformation tests (LinkML & developer schemas, flattened exports); run in CI and 'make test', excluded from the fast 'make check' gate",
]

[tool.codespell]
# Spell-check prose and identifiers; skip generated/binary/lock artifacts, the
# vendored gUFO import, and the vendored public-data fixtures (upstream content,
# not ours to correct). Patterns are fnmatch'd against repo-relative paths.
skip = "uv.lock,*.svg,*.png,imports,imports/*,tests/fixtures/coverage/external,tests/fixtures/coverage/external/*"
# False positives: LOD (Linked Open Data), "derails" (valid word), domain tokens,
# opNe (the not-equal expression operator in the mapping DSL algebra),
# ser (Rust serde/ciborium module path `ciborium::ser`).
ignore-words-list = "lod,derails,gmeow,nmo,gufo,nd,opne,ned,intoto,crate,ser"
