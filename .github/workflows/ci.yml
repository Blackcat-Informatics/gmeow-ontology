name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The quality gate is split into independent jobs that run in parallel; each
# restores the uv cache (setup-uv) so `uv sync` is fast. ruff/format live only
# in the lint job's pre-commit run (not duplicated here).
#
# Diagnostics SARIF taxonomy (#662): each job's per-category SARIF is uploaded to
# code scanning under a category == the JOB name, and its artifacts land under
# `dist/diagnostics/<category>/`. Wired here: `python-heavy` (the aggregate gate
# feedback bundle) and `python` (mypy via the external-tool wrapper). Still a
# documented follow-up — `lint` and `rust` need the native `gmeow_diagnostics`
# extension / a Python toolchain added to those jobs, and `ontology` a dedicated
# feedback run; that work is coordinated with #666, which restructures the
# reason/statements jobs into `native` + `classic-cross-check`. Per the owner's
# rule, whichever of #662/#666 lands second renames the categories in one place.
# Uploads are fork-safe: only push + same-repo PRs hit code scanning; fork PRs
# fall back to a workflow artifact (their token lacks security-events: write).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Cache pre-commit hook environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Pre-commit (format, spelling, YAML/MD/shell/actions, secrets)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  python:
    runs-on: ubuntu-latest
    # security-events: write lets this job's per-category (python/mypy) SARIF
    # surface in the Security tab via upload-sarif (#662).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-packages --frozen

      - name: Type-check (mypy)
        run: uv run mypy

      # Build the gmeow_logic PyO3 extension into the same venv so that the
      # AC2/AC4 tests in test_logic_engine.py cannot silently skip in CI.
      # VIRTUAL_ENV tells maturin develop which interpreter to target without
      # activating the shell; uv sync above has already created .venv.
      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install gmeow_diagnostics extension (#654)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/diagnostics/Cargo.toml

      - name: Build + install gmeow_logic extension (AC2 / AC4)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/logic/Cargo.toml

      - name: gmeow_logic extension imports (AC2/AC4 are now un-skippable)
        run: uv run python -c "import gmeow_logic; print('gmeow_logic at', gmeow_logic.__file__)"

      - name: Build + install gmeow_shacl extension (#576)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/shacl/Cargo.toml

      - name: Build + install gmeow_validate extension (#579 — validation runs through it)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/validate/Cargo.toml

      - name: Build + install gmeow_rdf extension (#667 — native statement codec)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/rdf/Cargo.toml

      - name: gmeow_diagnostics extension imports
        run: uv run python -c "import gmeow_diagnostics; print('gmeow_diagnostics at', gmeow_diagnostics.__file__)"

      - name: gmeow_shacl extension imports
        run: uv run python -c "import gmeow_shacl; print('gmeow_shacl at', gmeow_shacl.__file__)"

      # Per-category diagnostics (#662): re-run mypy through the external-tool
      # wrapper purely to emit a `python`-category SARIF of any type errors. The
      # AUTHORITATIVE mypy gate is the "Type-check (mypy)" step above (which runs
      # before the native exts, against the stubs); this step is continue-on-error
      # so it never gates — it only projects findings for code scanning.
      - name: mypy diagnostics SARIF (per-category python, non-gating)
        continue-on-error: true
        env:
          GMEOW_DIAGNOSTICS_DIR: dist/diagnostics/python
        run: uv run --package gmeow-dev gmeow-dev external-tool --name mypy --diagnostics-category python -- uv run mypy

      # Upload to code scanning only for push + same-repo PRs (a fork PR's token
      # lacks security-events: write). Fork PRs fall back to a workflow artifact.
      - name: Upload python diagnostics SARIF to code scanning (#662)
        if: >-
          always()
          && hashFiles('dist/diagnostics/python/gmeow-feedback.sarif') != ''
          && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: dist/diagnostics/python/gmeow-feedback.sarif
          category: python

      - name: Upload python diagnostics artifacts (fork-safe fallback, #662)
        if: >-
          always()
          && hashFiles('dist/diagnostics/python/*') != ''
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-python
          path: dist/diagnostics/python/
          if-no-files-found: warn

      # Pure-Python tests only. Docker-backed checks run through explicit
      # gmeow/Make lanes in parallel jobs below, not through pytest. Network
      # tests are auto-skipped (conftest) unless GMEOW_RUN_NETWORK=1.
      # test_logic_engine.py and test_logic_oracle_engine_parity.py run here:
      # the gmeow_logic extension above ensures importorskip no longer skips
      # (AC2/AC4 and the oracle≡engine parity gate run in every CI build).
      - name: Unit tests (pure Python)
        timeout-minutes: 60
        run: uv run pytest -q -n auto --dist loadscope -m "not ci_only and not docker and not classic_cross_check"

  python-heavy:
    runs-on: ubuntu-latest
    # security-events: write lets the diagnostics SARIF surface in the Security
    # tab via github/codeql-action/upload-sarif (#654).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cache ontology-docs build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/ontology-docs
          key: ontology-docs-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/ontology_docs.py', 'generated/dist/gmeow.gts', 'generated/references/references.md', 'generated/statements/gmeow.rdf12.ttl', 'dsl/mappings/**/*.ttl', 'slices/*/*/manifest.ttl', 'slices/*/*/docs.md', 'slices/*/*/design/*.md', 'slices/*/*/mappings/*.ttl') }}
          restore-keys: |
            ontology-docs-${{ runner.os }}-

      - name: Cache validation results
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/validate
          key: validate-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/validate.py', 'src/gmeow_tools/dsl_validate.py', 'src/gmeow_tools/shacl_engine.py', 'ontology/**/*.ttl', 'slices/**/*.ttl', 'slices/**/*.md', 'dsl/**/*.ttl', 'shapes/**/*.ttl', 'generated/shapes/**/*.ttl') }}
          restore-keys: |
            validate-${{ runner.os }}-

      - name: Sync environment
        run: uv sync --all-packages --frozen

      # Heavy tests (docs, suppression-conformance, research-objects) exercise the
      # validation path, which runs SHACL through gmeow_shacl (#578).
      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install gmeow_diagnostics extension (#654)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/diagnostics/Cargo.toml

      - name: Build + install gmeow_shacl extension (#578 — validation runs through it)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/shacl/Cargo.toml

      # The logic conformance suite below resolves backward goals through the
      # gmeow_logic native engine (#504). Without it the goal-* cases fail with
      # "No module named 'gmeow_logic'" and the Principle-7 gate is vacuous.
      - name: Build + install gmeow_logic extension (#504 — conformance resolves goals through it)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/logic/Cargo.toml

      - name: Build + install gmeow_validate extension (#579 — validation runs through it)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/validate/Cargo.toml

      - name: Build + install gmeow_rdf extension (#667 — native statement codec)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/rdf/Cargo.toml

      # First-class diagnostics (#654, #662): emit the per-category SARIF/JSON/HTML
      # + self-describing .gts bundle for the aggregate gate (validation + native
      # reasoning + every migrated ontology surface), under dist/diagnostics/<cat>/.
      # The category is the JOB that runs it. continue-on-error so a gate failure
      # still produces the SARIF that explains it.
      - name: Diagnostics feedback (per-category SARIF/JSON/HTML + .gts)
        continue-on-error: true
        env:
          GMEOW_DIAGNOSTICS_CATEGORY: python-heavy
          GMEOW_DIAGNOSTICS_DIR: dist/diagnostics/python-heavy
        run: uv run --package gmeow-dev gmeow-dev feedback

      # Upload to code scanning only for push + same-repo PRs (a fork PR's token
      # lacks security-events: write). Fork PRs fall back to a workflow artifact.
      - name: Upload python-heavy diagnostics SARIF to code scanning (#662)
        if: >-
          always()
          && hashFiles('dist/diagnostics/python-heavy/gmeow-feedback.sarif') != ''
          && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: dist/diagnostics/python-heavy/gmeow-feedback.sarif
          category: python-heavy

      - name: Upload python-heavy diagnostics artifacts (fork-safe fallback, #662)
        if: >-
          always()
          && hashFiles('dist/diagnostics/python-heavy/*') != ''
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-python-heavy
          path: dist/diagnostics/python-heavy/
          if-no-files-found: warn

      # CI-only Python tests cover heavyweight generated docs, GTS snapshot
      # determinism, and secondary export surfaces. Keep module scopes together
      # so expensive module fixtures are not rebuilt once per xdist worker.
      - name: CI-heavy Python tests
        timeout-minutes: 60
        run: uv run pytest -q -n auto --dist loadscope -m "ci_only and not docker and not classic_cross_check"

      # Logic conformance suite: Python oracle self-consistency over the corpus.
      # Verifies that every committed golden artifact matches the live runner
      # output (materialized.nq, verdicts.json, projection outputs).
      # Principle 7 gate: oracle ≡ engine is enforced by test_logic_oracle_engine_parity.py above.
      - name: Logic conformance (oracle self-consistency, Principle 7)
        run: uv run --package gmeow-dev gmeow-dev conformance

  # Rust workspace: the gmeow-logic reasoner + gmeow-shacl. The GTS engine moved
  # to the gmeow-gts repo (its `gts` binary is cargo-installed where needed).
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Nightly is required: the Nemo engine (hard dep of gmeow-logic) uses
      # unstable Rust features (macro_metavar_expr, iter_intersperse, etc.).
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2
        with:
          tool: cargo-nextest

      - name: Format gate
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Workspace tests (cargo-nextest)
        run: cargo nextest run --profile ci

      - name: Doctests
        run: cargo test --doc

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-report-rust
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Publish test results
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        if: always()
        with:
          name: Rust Tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cache generator stamps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .stamps/generators
          key: generator-stamps-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/**/*.py', 'ontology/**/*.ttl', 'slices/**/*.ttl', 'slices/**/*.md', 'dsl/**/*.ttl', 'shapes/**/*.ttl', 'queries/**/*.rq', 'metadata/**/*.ttl', 'generated/**/*') }}
          restore-keys: |
            generator-stamps-${{ runner.os }}-

      - name: Cache ontology-docs build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/ontology-docs
          key: ontology-docs-${{ runner.os }}-${{ hashFiles('src/gmeow_tools/ontology_docs.py', 'generated/dist/gmeow.gts', 'generated/references/references.md', 'generated/statements/gmeow.rdf12.ttl', 'dsl/mappings/**/*.ttl', 'slices/*/*/manifest.ttl', 'slices/*/*/docs.md', 'slices/*/*/design/*.md', 'slices/*/*/mappings/*.ttl') }}
          restore-keys: |
            ontology-docs-${{ runner.os }}-

      - name: Sync environment
        run: uv sync --all-packages --frozen

      # The validate gate now runs SHACL through the gmeow_shacl extension
      # (#578), so it must be built into this job's venv before validate.
      - name: Install Rust (nightly, native only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build + install gmeow_diagnostics extension (#654)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/diagnostics/Cargo.toml

      - name: Build + install gmeow_shacl extension (#578 — validate runs through it)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/shacl/Cargo.toml

      - name: Build + install gmeow_logic extension (#664 — logic generator imports it)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/logic/Cargo.toml

      - name: Build + install gmeow_validate extension (#579 — validation runs through it)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/validate/Cargo.toml

      - name: Build + install gmeow_rdf extension (#667 — native statement codec)
        run: VIRTUAL_ENV="$PWD/.venv" uvx maturin develop --manifest-path crates/rdf/Cargo.toml

      - name: Validate (syntax, lint, SHACL, DSL SHACL)
        run: uv run --package gmeow-dev gmeow-dev validate

      - name: Engine cross-check (rdflib ≡ gmeow_rdf on every query)
        run: uv run --package gmeow-dev gmeow-dev crosscheck-queries

      - name: Full-registry drift gate (statements run natively via gmeow-rdf, #667)
        run: uv run --package gmeow-dev gmeow-dev check-generated

      - name: Constitution check (every principle has live enforcement)
        run: uv run --package gmeow-dev gmeow-dev constitution-check

      - name: Reasoned-graph negative tests (native verify, Docker-free — #695)
        run: uv run --package gmeow-dev gmeow-dev verify --mode native

      - name: Mappings → axioms + linksets, QID syntax
        run: uv run --package gmeow-dev gmeow-dev mappings

      - name: Wikidata QID/PID syntax gate
        run: uv run --package gmeow-dev gmeow-dev wikidata

      - name: Vendored-entity coverage — hard class/predicate floors (#579)
        run: uv run --package gmeow-dev gmeow-dev coverage --gaps --min-class 0.92 --min-predicate 0.85

      - name: Transpile acceptance — hard aggregate recall floor (#579)
        run: uv run --package gmeow-dev gmeow-dev acceptance --min-recall 60

      - name: Alignment direction lint
        run: uv run --package gmeow-dev gmeow-dev lint-alignment

      - name: Claim audit gates on the worked fixture (#55)
        run: uv run --package gmeow-dev gmeow-dev audit tests/fixtures/coverage/hallucination-kg.ttl

      - name: Compliance report (per-principle gate evidence)
        run: uv run --package gmeow-dev gmeow-dev compliance-report --from-passing-check

  # === CLASSIC-CROSS-CHECK LANE (#666/#695, Principle 18) ===
  # The Java+Docker oracle lane (ELK/HermiT/ROBOT/Jena/rdflib + native-vs-ROBOT
  # cross-check) lives in its OWN workflow — `.github/workflows/classic-cross-check.yml`
  # — and runs ONLY on a schedule, via workflow_dispatch, or when the
  # `classic-cross-check` label is applied to a PR. It is never part of branch
  # protection, so Docker/Java never executes on a normal PR. The authoritative
  # gate is the native, Docker-free reasoning lane in the required `quality`
  # aggregator below.

  # Aggregator gate. Branch protection requires the "quality" context; this job
  # keeps that single required check stable while the work runs in parallel
  # above. `if: always()` guarantees it reports a definite success/failure
  # (never a merge-blocking "skipped") and fails if any parallel job did not.
  #
  # The classic-cross-check lane is DELIBERATELY in its own workflow
  # (.github/workflows/classic-cross-check.yml), NOT in this aggregator's `needs:`
  # (#666/#695, Principle 18): the Docker/Java oracle lane is a separately-observed
  # cross-check, never a requirement to merge or to use the repo. The required
  # gate stays Docker-free and Java-free. Statements now run natively via the
  # gmeow-rdf codec inside the `ontology` job's `check-generated` (#667) — there
  # is no separate statements lane.
  quality:
    needs: [lint, python, python-heavy, rust, ontology]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality jobs to have succeeded
        env:
          LINT: ${{ needs.lint.result }}
          PYTHON: ${{ needs.python.result }}
          PYTHON_HEAVY: ${{ needs.python-heavy.result }}
          RUST: ${{ needs.rust.result }}
          ONTOLOGY: ${{ needs.ontology.result }}
        run: |
          echo "results: lint=$LINT python=$PYTHON python-heavy=$PYTHON_HEAVY rust=$RUST ontology=$ONTOLOGY"
          for r in "$LINT" "$PYTHON" "$PYTHON_HEAVY" "$RUST" "$ONTOLOGY"; do
            if [ "$r" != "success" ]; then
              echo "::error::a quality job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required quality jobs succeeded (classic-cross-check oracle lane is non-blocking by design)"
