default-filter = '''
  not (
    (package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/))
    | (package(gmeow-pipeline) & test(/projections::tests::up_project_(recovers_message_superclass_via_prp_dom|never_fabricates_subkind_or_sibling)/))
    | (package(gmeow-pipeline) & binary(fold_parity))
    | test(/corpus_conformance_heavy_offgate/)
    | test(/w3c_rdfc10_heavy_offgate/)
    | (package(gmeow-logic) & test(/whole_bundle_.*gate/))
    | (package(gmeow-pipeline) & binary(end_to_end))
    | (package(gmeow-pipeline) & binary(fanout_parity))
    | (package(gmeow-pipeline) & test(/stages::superset::tests::project_bundle_reconstructs_the_committed_tree_and_gate_is_clean/))
    | (package(gmeow-foundation-corpus) & test(/imported_graph_conforms_to_shapes/))
    | (package(gmeow-validate) & (binary(conformance_finance) | binary(conformance_agentic) | binary(conformance_ai_claims) | binary(conformance_music_analysis) | binary(conformance_math_producers) | binary(conformance_affect_producer_union)))
    | (package(gmeow-dev-cli) & binary(cli_parity) & (test(build_writes_serializations) | test(project_view_over_the_snapshot)))
    | (package(gmeow-cli) & binary(cli) & (test(export_respects_language_selector) | test(project_schema_org_view_filter) | test(project_unknown_view_fails) | test(describe_env_language_rejected_if_unknown) | test(describe_resolves_grounding_curies) | test(describe_resolves_grounding_full_iris) | test(describe_known_term_renders_prose) | test(describe_unknown_language_fails_with_available_list) | test(describe_toon_format_emits_toon)))
    | (package(gmeow-docs) & binary(extract_roundtrip) & test(rendered_tree_is_disk_faithful))
    | (package(gmeow-pipeline) & test(/quality_assessment_graph_rides_the_self_description_carrier_heavy_offgate/))
    | (package(gmeow-pipeline) & test(/stages::carrier::term_entailments_tests::term_entailments_are_non_vacuous_on_the_real_repo/))
    | (package(gmeow-pipeline) & test(/stages::docs_render::tests::diagnostics_digest_total_is_non_vacuous_on_the_real_repo/))
    | (package(gmeow-pipeline) & test(/stages::docs_render::tests::term_loss_digest_is_non_vacuous_on_the_real_repo/))
    | (package(gmeow-slicetest) & test(/run_structural_file::core\/slice-quality-rubric\/tests\/structural\.ttl/))
    | (package(gmeow-pipeline) & binary(release_verify_roundtrip))
    | (package(gmeow-cli) & binary(self_sufficiency) & (test(transpile_wheel_mode_equals_repo_mode) | test(transpile_blinded_lifts_and_fans_out_without_x_gmeow_leak) | test(project_wheel_mode_equals_repo_mode) | test(describe_wheel_mode_equals_repo_mode) | test(describe_grounding_terms_wheel_mode_equals_repo_mode)))
    | (package(gmeow-docs) & test(/describe::tests::every_grounding_namespace_has_describable_terms_that_render/))
    | (package(gmeow-docs) & binary(render_golden) & test(render_site_is_byte_stable))
    | (package(gmeow-docs) & binary(mdbook_render) & (test(book_bodies_are_rewrite_of_single_authority) | test(book_term_chapter_with_dropped_link_golden) | test(book_no_relative_link_to_dropped_page) | test(book_toml_golden) | test(book_zero_term_slice_renders_valid_chapter)))
    | (package(gmeow-docs) & binary(describe_bundle_language) & test(describe_resolves_carrier_tags_against_shipped_bundle))
    | (package(gmeow-docs) & binary(extract_roundtrip) & test(english_carrier_tree_matches_render_site))
    | (package(gmeow-pipeline) & test(/stages::carrier::ustar_tests::build_docs_archive_packs_the_rendered_site/))
    | (package(gmeow-pipeline) & test(/stages::governance_floors::tests::generated_axis_floors_are_byte_reconstructible_from_the_bundle/))
    | (package(gmeow-pipeline) & test(/mcp::tests::json_rpc_protocol_conformance_round_trip/))
    | (package(gmeow-pipeline) & test(/mcp::tests::verify_graph_.*_heavy_offgate/))
    | (package(gmeow-pipeline) & test(/stages::mappings::tests::projection_report_unions_logic_and_correspondence_rows/))
    | (package(gmeow-pipeline) & binary(product_routing) & test(compiler_products_are_first_class_dag_artifacts))
    | (package(gmeow-pipeline) & test(/stages::export::tests::export_produces_structurally_valid_artifacts/))
  )
'''
slow-timeout = { period = "60s", "terminate-after" = 2, "grace-period" = "30s" }
retries = { backoff = "fixed", count = 2, delay = "1s" }
# Output ergonomics: surface the slowest tests in the final summary every
# run (previously invisible until they hit the slow-timeout terminate cliff).
# Passing runs stay quiet; a failing test's captured output shows inline AND is
# recapped at the end so it is not lost in a parallel run.
final-status-level = "slow"
success-output = "never"
failure-output = "immediate-final"

[profile.ci]
inherits = "default"
junit = { path = "junit.xml" }
fail-fast = false

# Maintainer lane: runs EVERYTHING, including the heavy tests the default/ci
# profiles carve out via `default-filter`. Used by `make maint-rust-heavy` so the
# off-gate parity / full-fold / codec coverage still runs (locally + on a CI schedule),
# just not on the per-commit gate. `default-filter = 'all()'` overrides the inherited
# exclusion; the JUnit budget gate is NOT applied to this profile.
[profile.maint-heavy]
inherits = "default"
default-filter = 'all()'
junit = { path = "junit.xml" }
fail-fast = false

# Engine memory cap. Native whole-bundle chase tests are RAM-heavy: nextest runs
# EACH test in its own process, so an in-process guard cannot cap how many multi-GB
# chase PROCESSES run at once. On the 16 GB CI runner the available CPU count is four
# (4), so up to 4 concurrent chases could OOM-thrash. This group caps concurrent engine
# tests to 2; the fast leaf-crate tests (rdf/shacl/validate/docs/diagnostics) and
# the ~360 fast gmeow-logic unit tests stay fully parallel.
[test-groups]
engine = { max-threads = 2 }
mapping-stage = { max-threads = 1 }

[[profile.default.overrides]]
# The whole gmeow-conformance datatest harness plus every gmeow-logic test that
# drives a native materialization/reasoning path. Matched by module so membership is by design,
#   not by a test name happening to contain another module's substring.
# foundation/stablemodel unit tests use the NATIVE rust chase (no engine) and stay parallel.
filter = 'package(gmeow-conformance) | (package(gmeow-logic) & test(/materialize|reason|verify|certify|oracle/))'
test-group = 'engine'

[[profile.default.overrides]]
# gmeow-pipeline's executor / parity tests exercise full-DAG paths. Keep them
# serialized with engine work so full-DAG reasoning does not contend with
# concurrent chases. The over-budget full-fold / end-to-end binaries are
# off-gated via `default-filter`, but this override still applies in maint-heavy.
# fanout_parity stays ON-gate (~8 s standalone, not irreducible) but joins the
# serialized group: unserialized it piled onto concurrent native chases in the
# shared shard and rode the 25 s cliff over on CI jitter (measured 27.9 s while a
# 20 s entailment chase ran alongside). Serializing it against engine work removes
# the contention without off-gating the fanout write-idempotence coverage — the
# bias is fix-not-off-gate for a test this cheap standalone.
filter = 'package(gmeow-pipeline) & binary(/fold_parity|end_to_end|dag_dogfood|fanout_parity/)'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

[[profile.default.overrides]]
# The native reasoning-entailment harness (crates/logic/tests/ontology_entailments.rs)
# migrates the OWL/EL/DL reasoning pytest cluster: each test drives the native
# closure over a scoped set of authored slice modules. These
# are now on-gate and under budget after the 2026-06-29 reevaluation, but they
# still share the `engine` group so multi-module closures do not OOM-thrash
# alongside other chases on the 16 GB runner. The longer timeout is only a
# runaway cliff; the JUnit budget gate still enforces the 25 s policy.
filter = 'package(gmeow-logic) & binary(ontology_entailments)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# The whole-ontology coherence-gate teeth tests (crates/logic/tests/coherence_gate.rs)
# drive the native DL consistency path (dl_consistency -> reason_closure -> native chase),
# once over a minimal injected clash and once over the WHOLE committed gmeow.gts bundle.
# They share the `engine` memory group so the full-bundle chase does not OOM-thrash
# alongside other chases; the longer timeout is only a runaway cliff, the JUnit budget
# gate still enforces the 25 s policy.
#
# The whole-bundle chase is irreducibly O(bundle size × DL-rule-set) and measures
# ~520 s locally (was ~95 s). The cost is the DL rule set applied over the whole
# ~720k-quad bundle — dominated by the merged-in top-sortal disjointness axioms (the
# kernel's mutual owl:AllDisjointClasses TBox), which force a disjointness/owl:Nothing
# propagation across the whole individual set. This is NOT the validation-shape work:
# the SHACL/ShEx projection is a sidecar that never reaches the reasoner (only ~510
# shape-touching quads land in the core-prefixes projection graph, and SHACL shapes
# are not DL axioms), so deriving the closed-world validation fragment added no
# measurable chase cost. Raise the runaway cliff to 1200 s (300 s × 4) so this
# budget-exempt gate has margin over local + CI runtime jitter; the cliff is a
# terminate-after backstop, not the expected runtime.
filter = 'package(gmeow-logic) & binary(coherence_gate)'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

[[profile.default.overrides]]
# The slice-quality e2e logic-slice scorer (crates/slice-quality/tests/score_slice_e2e.rs
# scores_the_logic_slice_green_vs_advisory) drives `score_slice` over the WHOLE real logic
# slice — running the reasoner/closure analysis that backs its `slice-quality.reasoner.*`
# axes. It is ~8 s standalone (measured 8.3 s), NOT irreducible, so the bias is fix-not-off-gate
# (the same class as `fanout_parity` above): unserialized it piled onto concurrent native
# chases in the shared CI shard and rode the 25 s cliff over on jitter (measured 25.9 s under
# full-parallelism contention). Serialize it under the `engine` memory group so the slice-closure
# reasoning does not contend with the other chases — this removes the contention WITHOUT
# off-gating the logic-slice-scoring coverage (it stays on every `make check`). The other three
# tests in the binary use the tiny rubric fixture and stay fully parallel.
filter = 'package(gmeow-slice-quality) & test(scores_the_logic_slice_green_vs_advisory)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# The affect-producer whole-ontology-union twin conformance tests (gmeow-validate
# conformance_affect_producer_union, the twin_* cases) each drive the SMT-backed affect twin
# decision procedure over the whole-ontology shape union — single-threaded solver work ~20 s
# standalone (measured 19-21 s running the binary alone) that rode the 25 s per-test budget cliff
# (25.1-32 s) under full-parallelism contention. The union binary is off-gated via `default-filter`
# (it runs only on maint-heavy; the cheap fixture-only + pure-Rust producer coverage stays on the
# per-commit gate in conformance_affect_producer), but this override still applies there
# (maint-heavy inherits the default overrides): serialize the twins under the `engine` memory group
# so concurrent solver/chase work cannot starve them of cores, and keep the longer terminate cliff
# so a contended maint-heavy run is not killed prematurely. On the default gate the filter matches
# nothing that runs (the binary is filtered out), so this is a no-op there.
filter = 'package(gmeow-validate) & binary(conformance_affect_producer_union) & test(/twin_/)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# Bundle-scale pipeline tests that fold the WHOLE committed gmeow.gts / run the full DAG:
# product_routing::compiler_products_are_first_class_dag_artifacts (full-DAG artifact routing),
# stages::export::tests::export_produces_structurally_valid_artifacts,
# stages::governance_floors::tests::generated_axis_floors_are_byte_reconstructible_from_the_bundle,
# and
# stages::yaml_ld::tests::dist_jsonld_roundtrips_through_carrier (whole-bundle export/serialize),
# and stages::mappings::tests::projection_report_unions_logic_and_correspondence_rows (whole
# projection-report union). The product-routing and projection-report sweeps are off-gated via
# `default-filter` after both exceeded 25 s in the failing CI shard; this override serializes them on
# `maint-heavy`. The remaining on-gate bundle folds use the same group so they do not contend with
# concurrent chases.
filter = 'package(gmeow-pipeline) & ( (binary(product_routing) & test(compiler_products_are_first_class_dag_artifacts)) | test(/stages::export::tests::export_produces_structurally_valid_artifacts|stages::governance_floors::tests::generated_axis_floors_are_byte_reconstructible_from_the_bundle|stages::yaml_ld::tests::dist_jsonld_roundtrips_through_carrier|stages::mappings::tests::projection_report_unions_logic_and_correspondence_rows/) )'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# The consumer `gmeow validate --deep` AC1 test reasons over the user data merged
# with the WHOLE bundled TBox via the native chase (~50s full-fold). It is
# off-gated via `default-filter` (so it runs only on maint-heavy), but the override
# still applies there (maint-heavy inherits default): serialize under the `engine`
# memory group so the full-fold chase does not OOM-thrash, and grant the long
# terminate cliff the other full-fold reasoning tests use.
filter = 'package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# Full-carrier round-trip tests decode the committed `gmeow.gts` and re-emit /
# extract it back through the native gmeow-gts codecs. All are on-gate
# (the blob-input `gts_sink` serialization test rejoined the gate at ~0.3 s once
# its docs-model seam removed the whole-ontology discovery). Keep a longer runaway
# cliff because they are codec / I-O-bound and not protected by the `engine`
# memory group.
filter = 'package(gmeow-pipeline) & test(/gts_sink|stages::carrier::ustar_tests::build_docs_archive_packs_the_rendered_site|stages::carrier::native_assembly_tests::authored_default_assembles_natively/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# The docs "try-it" goldens (crates/pipeline/src/stages/carrier.rs, mod
# docs_try_it_golden) each drive the native chase (reason_over_dataset)
# to reason the reduced authored-default-world seed — and the reduced-vs-full-EDB
# equivalence golden reasons the full object-level EDB as well. They are on-gate
# lib unit tests, so keep them in the `engine` memory group (like the chase-driving
# binaries above): otherwise they over-parallelize with the other chases and
# OOM-thrash on the 16 GB runner. Each fixture is tiny, so the JUnit budget gate's
# 25 s policy still holds; the longer terminate cliff is only a runaway backstop.
filter = 'package(gmeow-pipeline) & test(/stages::carrier::docs_try_it_golden/)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# The B3 real-repo non-vacuity proof (F1) drives a full native-chase
# reasoning pass over the WHOLE object-level EDB via the real `ReasonStage`. It is
# off-gated via `default-filter` (runs only on `maint-heavy`), but the override
# still applies there: serialize under the `engine` memory group so it does not
# OOM-thrash alongside other chases, with a runaway-cliff timeout well over its
# measured ~100 s.
filter = 'package(gmeow-pipeline) & test(/stages::carrier::term_entailments_tests::term_entailments_are_non_vacuous_on_the_real_repo/)'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# The B1 real-repo non-vacuity proof runs the whole-ontology SHACL
# validate + logic-compile chain (no reasoning chase, so no `engine` memory group — the
# same class as the off-gate `conformance_*` validate binaries). It is off-gated via
# `default-filter` (runs only on `maint-heavy`); grant a runaway cliff well over its
# measured ~105 s so CI jitter never trips the terminate backstop.
filter = 'package(gmeow-pipeline) & test(/stages::docs_render::tests::diagnostics_digest_total_is_non_vacuous_on_the_real_repo/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# Mapping-stage integration tests run the full `compile_mappings` registry check.
# They are now on-gate and under budget, but concurrent full mapping compiles are
# redundant and can contend for the same cache/filesystem work. Keep them
# serialized; the JUnit budget gate still enforces the 25 s policy.
filter = 'package(gmeow-pipeline) & test(/stages::mappings::tests::(sssom_emits_and_overlaps_byte_identically_with_committed|edoal_and_sparql_emit_byte_identically_with_committed|standpoint_and_dsl_stats_emit_byte_identically_with_committed|fno_is_well_formed_ntriples|prefix_set_projections_are_emitted_and_parse|list_functions_are_emitted_and_parse)/)'
test-group = 'mapping-stage'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }
