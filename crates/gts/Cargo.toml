[package]
name = "gmeow-gts"
description = "GTS (Graph Transport Substrate) format engine: CBOR-sequence append-only RDF 1.2 log reader, folder, and verifier"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "rdf-star", "cbor", "knowledge-graph", "linked-data", "gts"]

# The package is named gmeow-gts on crates.io, but the CLI binary keeps the
# shorter `gts` name for ergonomics.
[[bin]]
name = "gts"
path = "src/bin/gts.rs"

[dependencies]
blake3 = "1"
ciborium = "0.2"
flate2 = "1"
# pure-Rust zstd decoder — no C toolchain, wasm-friendly
ruzstd = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
filetime = "0.2"

[dev-dependencies]
serde_json = "1"
