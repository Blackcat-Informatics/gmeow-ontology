[package]
name = "gmeow-validate"
description = "GMEOW validation-path lints in Rust: oxigraph-backed Turtle syntax check and the Principle 5 owl:sameAs ban, exposed to Python via PyO3 (#579)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "validation", "lint", "knowledge-graph", "oxigraph"]

[lib]
# rlib-only: this crate no longer ships a standalone PyO3 extension. Its bindings
# are linked into the single `gmeow_native` cdylib (crates/native, #630).
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# oxigraph in-memory Store with RDF 1.2 (same version + features as crates/shacl):
# default-features off drops the rocksdb C/C++ backend we never use.
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
# Reserved for future lint ports that need regex (kept in lockstep with shacl).
regex = "1"
# Serialization for timing records and JSON result export (#634).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cargo manifest parsing for the native crate-layering DAG gate (#947).
toml = "0.8"
# JSON Schema draft-2020-12 instance validator (#700 Task 4). default-features
# off drops the network/file remote-$ref resolvers (reqwest/rustls/resolve-http):
# the GMEOW JSON Schema is fully self-contained ($defs-local refs only), so we
# never fetch remote schemas. No optional resolver feature is enabled — a
# capability cfg would be optionality, not compliance (#579).
jsonschema = { version = "0.46", default-features = false }
# YAML instance parsing: serde_yaml deserializes straight into serde_json::Value,
# so a YAML instance validates identically to its JSON twin (#700 Task 4).
serde_yaml = "0.9"
# SHA-256 for content-addressed validation cache keys (parity with Python hashlib).
sha2 = "0.10"
# Data parallelism: the per-example SHACL pass (the dominant cost of `validate`) is
# embarrassingly parallel across the ~100 slice examples, and the three DSL SHACL
# phases are independent — both fan out over rayon against the shared read-only store.
rayon = "1"
# Blocking HTTP client for the maintainer-only Wikidata live existence lane.
ureq = "3"
# SHACL engine: the Rust-native validation orchestration reuses parsed shapes
# and validates the shared store directly (#634). The engine core is PyO3-free;
# only the py modules on both sides touch PyO3.
gmeow-shacl = { path = "../shacl" }
# Shared RDF 1.2 kernel: GTS/oxigraph store construction and diagnostics (#648).
gmeow-rdf = { path = "../rdf", features = ["gts", "oxigraph"] }
# Native slice catalog + S6a semantic Merkle cache: the whole-ontology merged-SHACL
# source key is the path-independent, comment-insensitive product key over the slice
# composition (RFC #820 §12). gmeow-slice depends only on gmeow-rdf, so this edge
# keeps the crate DAG acyclic and layering-legal (#820 S0). Its default build is a
# pure rlib (no pyo3); the unified gmeow_native cdylib enables its `python` feature.
gmeow-slice = { path = "../slice" }
# Canonical Finding/Report model (#654). The RDF/SHACL -> Finding bridge lives
# here, NOT in the PyO3-free gmeow-rdf-core kernel: gmeow-diagnostics links pyo3
# unconditionally, and gmeow-validate already links pyo3, so this dependency
# keeps the kernel clean while threading wire-coordinate findings end-to-end.
gmeow-diagnostics = { path = "../diagnostics" }
# Native reasoning engine (#768 ME2): the `validate --deep` semantic pass reasons
# over the bundle (`gmeow_logic::reason::reason_all`) and reads the shared
# logic:ReasoningResult to emit semantic findings. nemo is already built once for
# the workspace, so this edge is link-only marginal cost; no cycle (logic does not
# depend on validate) and layering-legal (the gate only constrains the rdf kernel).
gmeow-logic = { path = "../logic" }
# GTS format engine: cache-key derivation reads `gmeow_gts::model::Graph::segment_heads`,
# and the toolchain salt mixes `gmeow_gts::wire::VERSION`. Runtime GTS ingestion itself
# lives in gmeow-rdf (#683).
gmeow-gts = { version = "0.9.9", features = ["yaml-ld"] }
# CBOR reader for the bundle blob metadata: `gmeow_gts::model::Graph::blob_meta`
# values are `ciborium::value::Value`, read to resolve a blob by its `rep` label.
ciborium = "0.2"
# pyo3 is an UNCONDITIONAL native-only dependency: this crate is native-only and
# carries NO architecture cfgs (never a [target.'cfg(...)'] table). A capability
# cfg would be optionality, not compliance (#579). The engine core
# (store.rs/model.rs) stays PyO3-free; only py.rs imports pyo3, so the rlib links
# into a future Rust compiler without Python.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }

[dev-dependencies]
# Ed25519 signing material for deterministic GTS signature tests (#646).
ed25519-dalek = "2"
# Acceleration-program baselines (#630, Phase 0); light feature set, see crates/logic.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Hermetic temp slices trees for the S6a merged-SHACL Merkle key integration test.
tempfile = "3"
# Snapshot goldens for the constitution parity regression test (#939 Gap 4).
insta = { version = "1.48", features = ["json"] }
# Parameterized #[case] rows for the conformance_*.rs SHACL twins (#1051). rstest
# subsumes test-case; test-case is deliberately NOT a dependency.
rstest = "0.26"

[[bench]]
name = "lint"
harness = false

[[bench]]
name = "validate_all"
harness = false
