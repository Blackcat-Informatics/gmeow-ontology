[package]
name = "gmeow-gts"
description = "GTS (Graph Transport Substrate) format engine: CBOR-sequence append-only RDF 1.2 log reader, folder, and verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
ciborium = "0.2"
flate2 = "1"
# pure-Rust zstd decoder — no C toolchain, wasm-friendly
ruzstd = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
filetime = "0.2"

[dev-dependencies]
serde_json = "1"
