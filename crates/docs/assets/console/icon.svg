The standalone console's application icon: the cat head of the GMEOW mark carrying a
three-node knowledge graph. The geometry here is the SAME design space the sibling PNG
rasters are rendered from (a 512 grid, theme colour #2f5d8a on white art), so the
scalable icon and the raster icons are one drawing rather than two that resemble each
other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">GMEOW console</title>
  <desc id="desc">A white cat head on a deep-blue rounded square, carrying a three-node knowledge graph.</desc>
  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="#2f5d8a"/>
  <g fill="#ffffff">
    <path d="M136 210 L176 88 L244 166 Z"/>
    <path d="M376 210 L336 88 L268 166 Z"/>
    <circle cx="256" cy="292" r="136"/>
  </g>
  <g stroke="#2f5d8a" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M204 268 L308 268 L256 356 Z"/>
  </g>
  <g fill="#2f5d8a">
    <circle cx="204" cy="268" r="26"/>
    <circle cx="308" cy="268" r="26"/>
    <circle cx="256" cy="356" r="26"/>
  </g>
</svg>
