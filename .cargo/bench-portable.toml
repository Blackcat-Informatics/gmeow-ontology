# Portable build overrides for the deterministic instruction benches
# (`make maint-bench-instructions`), applied via `cargo --config .cargo/bench-portable.toml`.
#
# The committed `.cargo/config.toml` host-tunes both Rust codegen (`-Ctarget-cpu=native`)
# and the vendored C deps (`-march=native`) for local regenerate/reasoning throughput.
# That is wrong for the instruction-count benches for two reasons:
#   1. retired-instruction counts are meant to be MACHINE-INDEPENDENT — a host-tuned
#      build makes them vary by CPU, defeating the whole point of the metric; and
#   2. a host AVX-512 build makes Valgrind (which iai-callgrind drives) SIGILL on newer
#      CPUs, so the bench cannot even run.
# This fragment pins the portable x86-64-v3 floor (the same floor the CI/release
# workflows use) for those bench invocations only, without touching the committed
# host-tuned default that every other local build relies on.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-Zunstable-options",
    "-Clink-self-contained=+linker",
    "-Clinker-features=+lld",
    "-Ctarget-cpu=x86-64-v3",
]

[env]
CFLAGS = { value = "-O2 -march=x86-64-v3 -mtune=generic", force = true }
CXXFLAGS = { value = "-O2 -march=x86-64-v3 -mtune=generic", force = true }
