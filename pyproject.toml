[project]
name = "gmeow"
version = "1.0.2"
description = "GMEOW ontology tooling: refine, validate, reason over, document, and publish the Global Metadata and Entity Ontology for the Web."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [{ name = "Blackcat Informatics® Inc." }]
keywords = ["ontology", "owl", "rdf", "linked-data", "gmeow", "fair"]
dependencies = [
    # NB: gmeow's own code is rdflib-free — it runs on the native
    # `gmeow_rdf.compat.rdflib` facade (purrdf P0, #834). `rdflib` is NOT a direct
    # dependency. It still arrives transitively via `sssom`/`linkml` (tracked for
    # native subsumption in #848); the classic_cross_check oracle lane pins it
    # explicitly through the `crosscheck` extra below.
    "sssom>=0.4.16",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "markdown>=3.10",
    "fastmcp>=3.4",
    "linkml>=1.11",
    "PyYAML>=6.0",
    "duckdb>=1.5.3",
    "jsonschema>=4.23",
    "blake3>=0.4",
    # the GTS format engine — now an external package (repo: gmeow-gts),
    # resolved from PyPI; the narrow-waist glue (gts_producer/views/db/gen)
    # consumes this published `gts` library.  0.9.0 ships the stable codec
    # (producer zstd-rsyncable path) plus the gts.verify module and
    # Signer.from_gpg_secret_key that cli/cli_dev's verify+sign commands need.
    # 0.9.2 ships gts.trig.to_trig, which write_trig() delegates to.
    "gmeow-gts>=0.9.4,<0.10",
]

[project.scripts]
gmeow = "gmeow_tools.cli:app"
gmeow-music = "gmeow_tools.ext.music.cli:app"

[project.optional-dependencies]
music = [
    "mido>=1.3.3",
    "music21>=10.3.0",
]
# The classic_cross_check oracle lane (#666) — the ONLY place gmeow uses upstream
# rdflib/owlrl, as the independent reasoner/engine oracle. Installed via
# `pip install '.[crosscheck]'` for `make classic-cross-check`; never needed for
# normal repo use. The engine_crosscheck / rl_agreement tests pytest.importorskip
# these, so the default `make check`/`make test` lanes pass without them.
crosscheck = [
    "rdflib>=7.6",
    "owlrl>=6.0.2",  # pure-Python OWL 2 RL oracle (#38)
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "types-jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
    "owlrl>=6.0.2",  # OWL 2 RL oracle for the classic_cross_check lane (#38); also
    # surfaced as the `crosscheck` extra. Kept in dev so the lane runs in local dev.
    "rdflib>=7.6",  # upstream rdflib — the classic_cross_check ORACLE only (#834); no
    # first-party module imports it. Pinned here so `make classic-cross-check` has it.
    "xmlschema>=4.3",  # Crossref 5.4.0 XSD validation (#693)
    "music21>=10.3.0",
    "mido>=1.3.3",
    "cryptography>=44.0",  # Ed25519 keys for GTS signature/trust tests (#646)
    "mlcroissant>=1.0",  # Croissant JSON-LD validation — un-skippable (no importorskip)
]

[tool.uv.workspace]
members = ["packages/gmeow-dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmeow_tools"]

[tool.hatch.build.targets.wheel.force-include]
"generated/dist/gmeow.gts" = "generated/dist/gmeow.gts"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "packages/gmeow-dev/src"]
# generated/ is owned by registered generators (#287); never lint outputs.
extend-exclude = ["generated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib (enforce Path over os.path strings)
    "RUF", # ruff-specific
    "D",   # pydocstyle (Google docstrings)
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # docstrings not required in tests
"slices/*/*/tests/*" = ["D"] # slice-local tests (#287), same rule

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src", "tests", "packages/gmeow-dev/src"]
# Resolve the gmeow_logic and gmeow_rdf stubs (the legacy-name shim packages
# under crates/native/python/*/__init__.pyi) from the source tree, so
# type-checking does not depend on the unified `gmeow_native` extension being
# `develop`-installed first (CI runs mypy before that build). Single-cdylib
# unification (#630) folded all five extensions into crates/native.
mypy_path = ["crates/native/python"]

[[tool.mypy.overrides]]
# Third-party libraries without complete type information.
module = ["markdown.*", "sssom.*", "owlrl.*", "linkml.*", "linkml_runtime.*", "yaml", "mlcroissant.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The untyped native-extension shims (gmeow_diagnostics / gmeow_shacl).
# Single-cdylib unification (#630) put every legacy-name shim package under
# mypy_path = crates/native/python, so mypy now *finds* these shim sources —
# but they only do a runtime `sys.modules` swap and carry no API stub.
# `follow_imports = skip` makes mypy treat them as `Any` (the pre-#630 behaviour
# when they were simply not on mypy_path), so call sites type-check unchanged.
# gmeow_rdf / gmeow_logic / gmeow_validate are deliberately NOT here: they ship
# typed stubs (__init__.pyi) beside their shims so their call sites stay checked.
# gmeow_docs (#853) carries no API stub yet (the typed renderer surface lands in
# Task 6); skip it for now, like the other stub-less shims.
module = ["gmeow_diagnostics.*", "gmeow_shacl.*", "gmeow_docs.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "slices"]
addopts = "-ra --strict-markers"
# Upstream self-deprecations we cannot fix from here (pinned rdflib/linkml):
# rdflib's own nquads parser and Dataset internals still touch the deprecated
# Dataset.default_context / Dataset.identifier attributes; LinkML's generators
# emit a dataclass-extension-patch deprecation. Our code uses the modern API
# (Dataset + quads, default_graph.add). Revisit on dependency upgrade (#433).
filterwarnings = [
    "ignore:Dataset.default_context is deprecated:DeprecationWarning",
    "ignore:Dataset.identifier is deprecated:DeprecationWarning",
    # rdflib's own json-ld parser still constructs a ConjunctiveGraph internally.
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
    "ignore:The LinkML dataclass extension patch is deprecated:DeprecationWarning",
]
markers = [
    "network: tests that require network access (Wikidata/OOPS!/FOOPS!)",
    "docker: tests that require Docker (ROBOT/Jena)",
    "ci_only: heavy pure-Python gates and secondary/export transformation tests; run in CI and 'make test', excluded from the fast 'make check' gate",
    "classic_cross_check: legacy-oracle cross-check tests (ELK/HermiT/owlrl/rdflib) — run ONLY in the `make classic-cross-check` lane (#666), never required for normal repo use",
]

[tool.codespell]
# Spell-check prose and identifiers; skip generated/binary/lock artifacts, the
# vendored gUFO import, the vendored public-data fixtures (upstream content, not
# ours to correct), and the i18n translation catalogs (*.po — foreign-language
# msgstr is not English prose to spell-check; their English msgids are already
# checked at the .ttl/.md source, #572). Patterns are fnmatch'd against
# repo-relative paths.
skip = "uv.lock,Cargo.lock,*.svg,*.png,*.po,imports,imports/*,tests/fixtures/coverage/external,tests/fixtures/coverage/external/*,ontology-docs,ontology-docs/*"
# False positives: LOD (Linked Open Data), "derails" (valid word), domain tokens,
# opNe (the not-equal expression operator in the mapping DSL algebra),
# ser (Rust serde/ciborium module path `ciborium::ser`),
# Beng (ISO 15924 script code for Bengali), fo (ISO 639-1 Faroese),
# te (ISO 639-1 Telugu), intensional (the IDB term in logic/databases, opp. of
# extensional), intension (the concept-theory term — a concept's defining
# properties, opp. of extension), Hendler / Pease (author surnames in the logic
# references), vor (Crossref AccessIndicators applies_to value = "version of record").
ignore-words-list = "lod,derails,gmeow,nmo,gufo,nd,opne,ned,intoto,crate,ser,fpr,beng,fo,te,intensional,intension,hendler,pease,vor,ans"
