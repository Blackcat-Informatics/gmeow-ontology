[package]
name = "gmeow-perf-evidence"
description = "Leaf report-only performance and JUnit evidence tools for GMEOW CI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false

# Library ownership keeps the real SHA/XML/resource implementations and their
# synthetic tests in every library build; the resource/JUnit binaries are only launchers.
[[bin]]
name = "perf-sample"
path = "src/bin/perf-sample.rs"
test = false
bench = false

[[bin]]
name = "perf-accept"
path = "src/bin/perf-accept.rs"

[[bin]]
name = "junit-inventory"
path = "src/bin/junit-inventory.rs"
test = false
bench = false

[dependencies]
libc.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
