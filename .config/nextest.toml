# The MCP overlay/verify tools each build an overlay over the WHOLE bundle, so they are
# in the same bundle-assembly weight class as the pipeline proofs above. `verify_graph`
# additionally reserves every core because it is the heaviest of them.
#
# These tests used to live in `gmeow-pipeline` as `mcp::tests::*`; splitting the MCP
# consumer surface into its own leaf crate moved them to `gmeow-mcp` and a
# `package(gmeow-pipeline)` filter silently stopped matching, dropping them back to the
# 60s default while still competing with the whole gate for cores. That is what
# `nextest_override_filters_all_match_a_live_test` now prevents.
[[profile.default.overrides]]
filter = 'package(gmeow-mcp) & test(/tests::verify_graph_accepts_a_normal_small_overlay_over_the_whole_bundle/)'
threads-required = "num-cpus"
