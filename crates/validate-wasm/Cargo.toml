[package]
name = "gmeow-validate-wasm"
description = "wasm32 bindings for the repo-free GMEOW Tier-1 validator: validate authored RDF against a gmeow.gts bundle client-side (editor / browser / LLM client), returning JSON findings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["rdf", "validation", "shacl", "wasm", "knowledge-graph"]

[lib]
# cdylib for the wasm-bindgen build (the shipped npm/ESM artifact); rlib so the thin
# binding logic still compiles + unit-tests on the native workspace gate
# (`cargo nextest` / clippy --all-targets). The `#[wasm_bindgen]` shims compile on
# native too; the real wasm + JS surface is exercised by the Node round-trip lane
# (`crates/validate-wasm/js/tests`, run against the wasm-bindgen output).
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# The wasm-clean Tier-1 validator core. Its default (non-`python`) build excludes the
# native reasoner, rayon, ureq, and gmeow-slice (all `cfg(not(wasm32))`), so it
# cross-compiles to wasm32; this crate calls only `data_validate::validate_json`.
gmeow-validate = { path = "../validate" }
# The GMN-1 codec + graph-derived dictionary/glyph registry + the typed
# `lang:LangConformanceFailure` classifier (`Gmn1Error::failure_class`). The
# `gmn_validate` entrypoint reads a GMN-1 document via `gmn1_read` against the EMBEDDED
# codebook. This path is reasoner-free (`cargo tree` proves no gmeow-logic/oxigraph/…).
# `default-features = false` selects OUT lang-bridge's `glyph-cost` feature: this crate
# never measures a glyph's token cost, so its ~1.7 MB embedded BPE vocabulary
# (tiktoken-rs) has no business in the validator image. That opt-out — not a target gate
# — is what the `make wasm` purity gate's "no tiktoken-rs in the wasm tree" check proves.
gmeow-lang-bridge = { path = "../lang-bridge", default-features = false }
# Native codebook hydration and its original-source digest are owned by lang-bridge;
# this shim has no authored RDF parser or duplicate source-digest implementation.
# The `gmn_validate` verdict is marshalled as a canonical JSON object
# (`{conformant, failureClass?, detail?}`) at the JS boundary — the same serde surface
# the Tier-1 `validate` Report crosses on. wasm-pure.
serde_json.workspace = true
# Pinned once in the workspace: the CLI that generates the JS bindings must match the
# library version byte-for-byte, and one CLI serves every wasm crate in the build.
# `make wasm-pkg` and the CI Node lane install the matching `wasm-bindgen-cli`.
wasm-bindgen.workspace = true
# Host-target unit tests parse the `gmn_validate` JSON verdict back to assert the exact
# `conformant` flag + `failureClass` IRI (the load-bearing unknown-glyph rejection); they
# reuse the `serde_json` dependency above (a normal dep is already in scope for tests).

[dev-dependencies]
# Corpus-backed host contracts only read compact, producer-selected source verdicts.
gmeow-action-cache = { path = "../action-cache" }
