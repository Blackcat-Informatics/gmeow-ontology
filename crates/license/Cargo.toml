[package]
name = "gmeow-license"
description = "GMEOW license-token vendoring / axiom-copy policy classifier — the RUST-FIRST single source of truth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["license", "policy", "spdx", "vendoring", "gmeow"]

[lib]
# Pure, dependency-free rlib. The PyO3 shim that surfaces this to Python lives in
# gmeow-validate (linked into the single gmeow_native cdylib, #630).
crate-type = ["rlib"]
path = "src/lib.rs"
