[package]
name = "gmeow-lsp"
description = "GMEOW synchronous LSP server for .ttl and .logic files, plus a sarif CLI subcommand (#671)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lsp", "rdf", "turtle", "diagnostics", "sarif"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gmeow-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
gmeow-diagnostics = { path = "../diagnostics" }
gmeow-logic = { path = "../logic" }
# The pure compiler surface (parse_logic_str) the LSP analyzer drives, split out of
# gmeow-logic in #732; the runtime-side diagnostics_report still comes from gmeow-logic.
gmeow-logic-compile = { path = "../logic-compile" }
# Native (oxigraph-free) Turtle parse for the .ttl linter (EPIC #906): the `gts`
# feature pulls the native text codecs; `gmeow-rdf-core` carries the RdfDiagnostic
# location type the analyzer reports positions from.
gmeow-rdf = { path = "../rdf", features = ["gts"] }
gmeow-rdf-core = { path = "../rdf-core" }

[dev-dependencies]
insta = { version = "1.48", features = ["json"] }
