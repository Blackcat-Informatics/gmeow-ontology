[profile.default]
# Always-on per-test budget (#1045): every test on this profile must complete under
# 25 s real wall time, enforced AFTER the run by the JUnit duration gate
# (`cargo run -p gmeow-test-budget`, wired into `make rust-test`/`rust-gate`). Tests
# that are irreducibly heavier than the budget (full-fold reasoning, full-DAG parity,
# snapshot codec round-trips, the native-pathological corpus parity query, …) are
# carved out of this profile via `default-filter` below and run on the `maint-heavy`
# profile instead — so the gate has NO legitimate >25 s test to allowlist. The
# slow-timeout stays at the original 120 s terminate cliff purely as a runaway/hang
# backstop; the 25 s POLICY is the JUnit gate, not this timeout.
#
# `default-filter` is the set of tests run when no filter is given on the CLI. Keep
# this expression as the single source of truth for what the always-on gate excludes;
# `maint-heavy` re-includes everything. Each excluded group MUST be justified here and
# in AGENTS.md's test-budget section (the off-gate allowlist). The post-run JUnit
# budget gate verifies nothing >25 s slipped THROUGH this filter onto the gate.
#
# Off-gate groups (all measured >22 s locally; #1045). They are NOT casually slow —
# each is irreducibly heavy under the current architecture:
#   - corpus_parity_heavy_offgate: native NOT-EXISTS pathology (~44 s; see crates/rdf).
#   - w3c_rdfc10_heavy_offgate: the sole RDFC-1.0 negative/poison vector (test074),
#     ~5.3 s on the call-budget guard while every other vector is ≤ ~0.02 s; carved out
#     so the gated W3C shards stay cheap (see crates/rdf/tests/rdfc_w3c.rs).
#   - gmeow-docs render/competency/extract/lint/i18n/model binaries: each test rebuilds
#     the full DocsModel via `DocsModel::discover` (~13 s) + render (~5 s), uncached
#     across nextest's process-per-test model. A docs-model shared-fixture brings these
#     back on-gate — tracked as a follow-up. `rdf_golden` stays gated as the docs
#     representative subset.
#   - gmeow-logic ontology_entailments: Nemo OWL-2-RL closures (engine-bound by design).
#   - gmeow-conformance goal-rdf-list-functions: Nemo chase case.
#   - gmeow-pipeline end_to_end / fold_parity / full-fold artifacts / snapshot codec
#     round-trips / mapping byte-parity / scoreboards acceptance: full-DAG, minutes.
#   - gmeow-slice alignment/sparql/edoal emit parity + gmeow-slicetest places structural:
#     whole-ontology emit/closure checks just over budget.
#   - gmeow-rdf-capi c_smoke binary: self-builds the libpurrdf cdylib (~33 s cold
#     compile on CI) as part of the test — build-time-bound, not logic-bound.
#     Already covered by the dedicated `capi` CI job (`make capi-check`).
default-filter = '''
  not (
    test(/corpus_parity_heavy_offgate/)
    | test(/w3c_rdfc10_heavy_offgate/)
    | (package(gmeow-docs) & binary(/competency|extract_roundtrip|i18n_render|lint_regression|model_golden|render_golden/))
    | (package(gmeow-logic) & binary(ontology_entailments))
    | (package(gmeow-conformance) & test(/goal-rdf-list-functions/))
    | (package(gmeow-pipeline) & binary(/end_to_end|fold_parity/))
    | (package(gmeow-pipeline) & test(/stages::gts_sink|stages::snapshot::ustar_tests::build_docs_archive|stages::logic::tests::logic_artifacts_reproduce|scoreboards::tests::acceptance_runs_the_real_external_fixture|stages::mappings::tests|stages::docs_render::tests::docs_graph_is_nonempty/))
    | (package(gmeow-slice) & (binary(alignment_parity) | test(/sparql_emit::tests/) | test(/edoal_emit::tests::every_edoal/)))
    | (package(gmeow-slicetest) & test(/places.tests.structural/))
    | (package(gmeow-rdf-capi) & binary(c_smoke))
  )
'''
slow-timeout = { period = "60s", "terminate-after" = 2, "grace-period" = "30s" }
retries = { backoff = "fixed", count = 2, delay = "1s" }
# Output ergonomics (#871): surface the slowest tests in the final summary every
# run (previously invisible until they hit the slow-timeout terminate cliff).
# Passing runs stay quiet; a failing test's captured output shows inline AND is
# recapped at the end so it is not lost in a parallel run.
final-status-level = "slow"
success-output = "never"
failure-output = "immediate-final"

[profile.ci]
inherits = "default"
junit = { path = "junit.xml" }
fail-fast = false

# Maintainer lane (#1045): runs EVERYTHING, including the heavy tests the default/ci
# profiles carve out via `default-filter`. Used by `make maint-rust-heavy` so the
# off-gate parity / full-fold / codec coverage still runs (locally + on a CI schedule),
# just not on the per-commit gate. `default-filter = 'all()'` overrides the inherited
# exclusion; the JUnit budget gate is NOT applied to this profile.
[profile.maint-heavy]
inherits = "default"
default-filter = 'all()'
junit = { path = "junit.xml" }
fail-fast = false

# Engine memory cap (#871, sub-ask 3). The Nemo/Scryer reasoning engines are
# RAM-heavy: nextest runs EACH test in its own process, and the in-process
# `CHASE_LOCK` (nemo_engine.rs) / `SCRYER_LOCK` (scryer_engine.rs)
# process-global mutexes serialize only WITHIN a process — they do NOT cap how many multi-GB chase
# PROCESSES run at once. On the 16 GB CI runner the default thread count = nproc
# (4), so up to 4 concurrent chases could OOM-thrash (and the scryer nightly
# alloc-abort surfaces under parallelism). This group caps concurrent engine
# tests to 2; the fast leaf-crate tests (rdf/shacl/validate/docs/diagnostics) and
# the ~360 fast gmeow-logic unit tests stay fully parallel.
[test-groups]
engine = { max-threads = 2 }
mapping-stage = { max-threads = 1 }

[[profile.default.overrides]]
# The whole gmeow-conformance datatest harness (its foundation/* cases materialize
# via nemo's run_chase) plus EVERY gmeow-logic test that drives Nemo or Scryer:
# - Nemo (run_chase / run_reasoning): nemo_engine, materialize, reason, verify, certify
# - Scryer (run_scryer, directly or via dispatch_query): scryer_engine, dispatch,
#   profile_gate, counterfactual — so the scryer nightly alloc-abort insurance above
#   actually covers all scryer execution, not just the scryer_engine module.
# foundation/stablemodel unit tests use the NATIVE rust chase (no engine) and stay parallel.
filter = 'package(gmeow-conformance) | (package(gmeow-logic) & test(/nemo_engine|scryer_engine|materialize|reason|verify|certify|dispatch|profile_gate|counterfactual/))'
test-group = 'engine'

[[profile.default.overrides]]
# gmeow-pipeline's executor / parity tests run the FULL build DAG, which reasons
# over the entire 66k-quad fold via the native engine (the `logic` leaf reasons,
# `snapshot` folds the closure). They are engine-heavy (so serialize them under the
# `engine` group to avoid OOM-thrash with the other chases) AND inherently slow —
# the full-fold chase is minutes — so they need a far longer terminate cliff than
# the 120s default (logic_artifacts / full_parity exceed it under the CI memory cap).
filter = 'package(gmeow-pipeline) & (binary(/full_parity|fold_parity|end_to_end|dag_dogfood/) | test(/logic_artifacts_reproduce_committed_over_full_fold/))'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

[[profile.default.overrides]]
# The #896 native reasoning-entailment harness (crates/logic/tests/ontology_entailments.rs)
# migrates the OWL/EL/DL reasoning pytest cluster: each test drives Nemo (rl_closure → run_chase)
# over a scoped set of authored slice modules. Serialize under the `engine` group so the kernel-
# heavy multi-module closures do not OOM-thrash alongside the other chases on the 16 GB runner, and
# grant a far longer terminate cliff than the 60s default — a 4–5-module closure is ~60–90s, well
# past the default 120s terminate point under the engine memory cap.
filter = 'package(gmeow-logic) & binary(ontology_entailments)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# Full-snapshot round-trip tests decode the ~9.3 MB committed `gmeow.gts` and
# re-emit / extract it back through the native gmeow-gts codecs (#909). Snapshot
# archive tests also render and pack the embedded ontology-docs site. Under CI
# load these can tip past the 120s default terminate cliff. They are codec /
# I-O-bound — NOT engine-bound — so they stay OUTSIDE the `engine` memory group
# (no OOM risk) but need a longer terminate cliff: `gts_sink` re-emits the whole
# snapshot, `gmeow-docs` extract round-trips it, and the snapshot docs-archive
# test renders/packs the embedded site.
filter = '(package(gmeow-pipeline) & test(/gts_sink|stages::snapshot::ustar_tests::build_docs_archive_packs_the_rendered_site/)) | (package(gmeow-docs) & binary(extract_roundtrip))'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# Mapping-stage integration tests run the full `compile_mappings` registry check.
# Under CI shard contention, concurrent full mapping compiles can exceed the
# default 120s terminate cliff even though the artifacts are deterministic. Keep
# them serialized and give them the same long-running integration budget used by
# the other full-stage parity checks.
filter = 'package(gmeow-pipeline) & test(/stages::mappings::tests::(sssom_emits_and_overlaps_byte_identically_with_committed|edoal_and_sparql_emit_byte_identically_with_committed|standpoint_and_dsl_stats_emit_byte_identically_with_committed|fno_is_well_formed_ntriples|prefix_set_projections_are_emitted_and_parse|list_functions_are_emitted_and_parse)/)'
test-group = 'mapping-stage'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }
