[package]
name = "gmeow-lsp"
description = "GMEOW synchronous LSP server for .ttl and .logic files, plus a sarif CLI subcommand"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lsp", "rdf", "turtle", "diagnostics", "sarif"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gmeow-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.97"
serde.workspace = true
serde_json.workspace = true
url = "2"
gmeow-errors = { path = "../errors" }
# The bin surfaces handled failures (sarif / server) and progress notes through
# the shared console Reporter. stdout is the LSP JSON-RPC channel, so diagnostics
# default to the stderr surface and never corrupt the protocol. Acyclic: cli-core
# depends only on gmeow-errors.
gmeow-cli-core = { path = "../cli-core" }
gmeow-logic = { path = "../logic" }
# The pure compiler surface (parse_logic_str) the LSP analyzer drives, split out of
# gmeow-logic; the runtime-side diagnostics_report still comes from gmeow-logic.
gmeow-logic-compile = { path = "../logic-compile" }
# Native (oxigraph-free) Turtle parse for the .ttl linter: the `gts`
# feature pulls the native text codecs; `gmeow-rdf-core` carries the RdfDiagnostic
# location type the analyzer reports positions from.
purrdf.workspace = true
# The substrate SHACL validator: the `.ttl` analyzer routes a parsed data graph
# through `data_validate::shacl_report_via_ledger` (the repo-free Tier-1 consumer
# path) so publishDiagnostics READS THE SUBSTRATE — a shape violation surfaces with
# the SHACL result-path / offending-value secondary labels the ledger projection
# carries. Default (non-`python`) features only: the LSP needs the PyO3-free core.
gmeow-validate = { path = "../validate" }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
