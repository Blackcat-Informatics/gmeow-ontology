[alias]
xtask = "run --quiet --package xtask --"

[env]
# Build vendored C deps (zstd-sys, ring) optimized and host-tuned for LOCAL
# regenerate/reasoning paths by default. `force = true` overrides ambient CFLAGS —
# crucially it strips a host `-flto`, which leaves LLVM IR (not real objects) in
# vendored `.a` archives and corrupts the link. CI and release workflows opt out
# with CARGO_ENV_CFLAGS_VALUE / CARGO_ENV_CXXFLAGS_VALUE set to the portable
# x86-64-v3 floor.
CFLAGS = { value = "-O2 -march=native -mtune=native", force = true }
CXXFLAGS = { value = "-O2 -march=native -mtune=native", force = true }

[target.wasm32-unknown-unknown]
# The wasm default stack is 1 MiB. The browser reasoning segment runs the SAME chase the
# native engine does — `verify_graph` over the governed bundle recurses deeply enough to
# exhaust that, and a wasm stack overflow is not an error a caller can see: it traps as
# `RuntimeError: unreachable`, with no panic text and no way to tell it from a bug. Sizing
# the stack to the work the engine actually does is what keeps the browser answer identical
# to the native one rather than merely smaller.
rustflags = ["-C", "link-arg=-zstack-size=16777216"]

[target.x86_64-unknown-linux-gnu]
# Link with the toolchain's BUNDLED rust-lld (no system lld / apt install — the
# nightly toolchain CI already uses ships it under gcc-ld/). This reduces peak
# link-step RAM and time across the large workspace versus the default bfd linker.
# Nightly gates `link-self-contained=+linker` behind `-Zunstable-options`; the repo
# is nightly-pinned for `portable_simd`, so these flags are always available.
rustflags = [
    "-Zunstable-options",
    "-Clink-self-contained=+linker",
    "-Clinker-features=+lld",
    # Local regenerate/reasoning paths are CPU-bound and run thousands of times a
    # day, so the committed default is host-tuned. CI and release workflows append
    # a portable x86-64-v3 target-cpu through CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS;
    # rustc uses the last -Ctarget-cpu value, so distributed artifacts do not inherit
    # host-only instructions.
    "-Ctarget-cpu=native",
]
