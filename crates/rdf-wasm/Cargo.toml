[package]
name = "gmeow-rdf-wasm"
description = "purrdf: a wasm32, in-memory RDF 1.2 engine with an idiomatic RDF/JS (DataFactory/Dataset/Stream) API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "rdf-12", "wasm", "rdfjs", "purrdf"]

[lib]
# cdylib for the wasm-bindgen build (the shipped npm/ESM artifact); rlib so the
# inner mapping logic still compiles + unit-tests on the native workspace gate
# (`cargo nextest` / clippy --all-targets). The `#[wasm_bindgen]` shims compile on
# native too; the real wasm + JS surface is exercised by the Node round-trip lane
# (`crates/rdf-wasm/js/tests`, run against the wasm-bindgen output).
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# The wasm-clean engine: the GTS-feature build of gmeow-rdf excludes oxigraph
# and PyO3, and parses/serializes RDF text + RDF/XML through the first-party native
# codecs (crates/rdf/src/native_codecs/, roxmltree-backed) — no gmeow-gts codec, no
# Store, no RocksDB, no rayon. default-features = false + features = ["gts"] is the
# verified wasm32 surface.
gmeow-rdf = { path = "../rdf", default-features = false, features = ["gts"] }
# The permissive zero-dep RDF 1.2 ingestion protocol (purrdf P6 #840): the seam
# the RDF/JS Sink maps onto.
gmeow-rdf-events = { path = "../rdf-events" }
# The IR kernel + `SparqlEngine` seam (SparqlRequest / SparqlResult), in interned
# TermId space. default-features = false drops the GTS/Ed25519 signer surface to keep
# the wasm dependency tree minimal — the query binding only needs the query seam.
gmeow-rdf-core = { path = "../rdf-core", default-features = false }
# The native, oxigraph-free multiset SPARQL evaluator that powers the offline
# in-browser `Dataset.query`. wasm-clean: its only non-portable edge (the `ureq`
# SERVICE transport) is `cfg(not(wasm32))`-gated off, so it never enters this build.
gmeow-sparql-eval = { path = "../sparql-eval" }
# Serializes the SELECT/ASK result model to W3C SPARQL Results JSON. wasm-clean leaf
# (replaces the oxigraph-family `sparesults`).
gmeow-sparql-results = { path = "../sparql-results" }
# EXACT pin: the `wasm-bindgen` CLI that generates the JS bindings must match the
# library version byte-for-byte or it refuses to run. `make wasm-pkg` and the CI
# Node lane install `wasm-bindgen-cli@0.2.125` to match this.
wasm-bindgen = "=0.2.125"

[dev-dependencies]
pretty_assertions = "1"
