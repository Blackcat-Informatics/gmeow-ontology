[package]
name = "gmeow-errors"
description = "GMEOW errors and diagnostics substrate: first-class model and renderers (rlib)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["diagnostics", "sarif", "validation", "reporting", "gmeow"]

[lib]
# rlib-only: a pure-Rust engine crate consumed by the workspace.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
purrdf.workspace = true
blake3.workspace = true

[dev-dependencies]
# insta: whole-output snapshot goldens for the five renderers. The
# renderers are pure functions of the Report and the fingerprint is a content
# hash, so the output is fully deterministic — snapshots carry it verbatim, no
# redaction. Pinned to match crates/docs / crates/logic.
insta = { workspace = true, features = ["json"] }
# static_assertions: compile-time negative trait-bound checks (macro_rules, not a
# proc-macro; no brittle stderr goldens). Guards `Diag: !std::error::Error`
# (the blanket-From coherence invariant) and `Diag: !Serialize` (lowering is the
# only serialization surface).
static_assertions = "1"
