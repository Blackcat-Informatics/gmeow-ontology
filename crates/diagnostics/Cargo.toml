[package]
name = "gmeow-diagnostics"
description = "GMEOW first-class diagnostics model and renderers, exposed to Python via PyO3 (#654)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["diagnostics", "sarif", "validation", "reporting", "gmeow"]

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }
