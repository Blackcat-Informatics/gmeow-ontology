[package]
name = "gmeow-lang-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# The codebook Merkle-root digest and the RDFC-1.0 content digest fold with blake3 — the
# SAME primitive `crates/logic`'s coherence certificate aggregates per-part hashes with, so
# an independent implementation reproduces the byte-exact digest.
blake3.workspace = true
gmeow-errors = { path = "../errors" }
gmeow-lang-form = { path = "../lang-form" }
gmeow-logic-compile = { path = "../logic-compile" }
# The OntoLex-Lemon lexicon lift parses RDF Turtle with the ONE canonical parser
# (never a second, hand-rolled RDF parser) — the same `purrdf` every other crate depends on.
gmeow-ns = { path = "../ns" }
purrdf.workspace = true
sha2.workspace = true
# The plain-text bridge declares each lifted surface's Unicode normalization form
# HONESTLY (NFC/NFD/NFKC/NFKD) via a quick-check, never assuming NFC — the declared
# frame must match the actual bytes the surface hash is taken over.
unicode-normalization = "0.1"
# UTS #39 skeletons are the normative collision oracle for the GMN glyph table. The
# registry rejects two distinct glyphs with the same skeleton inside one sigil scope.
unicode-security = "0.1.2"
# The GMN glyph-cost primitive measures a symbol's REAL token cost over the LLM token
# channel with a pinned, embedded BPE vocabulary (`cl100k_base`) — deterministic (the vocab
# is compiled in; no network, no filesystem I/O) and pure Rust (no Python binding). It is
# both the ⟦·⟧ fragmentation benchmark and the token-cost feed the machine-compression
# sibling consumes. Default features only — the `async-openai` feature is intentionally off.
#
# Carried by the `glyph-cost` feature (ON by default), NOT by a target gate. tiktoken-rs
# itself cross-compiles to wasm32-unknown-unknown cleanly; what the wasm image cannot
# afford is its ~1.7 MB embedded BPE vocabulary when the consumer never measures a cost.
# The two GMN wasm shims (`gmeow-validate-wasm`'s `gmn_validate`, `gmeow-gmn-wasm`'s
# transcode + its pinned `GLYPH_TOKEN_COSTS` legend) therefore take this crate with
# `default-features = false`, which is what keeps tiktoken-rs off their wasm dependency
# trees (the `make wasm` GMN purity gate proves it). A consumer that genuinely measures
# glyph cost on wasm — `gmeow-slice-quality`'s `gmn_glyph_optimality_axis`, and through it
# the browser-runnable `gmeow-mcp` `slice_quality` tool — keeps the default feature and
# pays for the vocabulary, because the alternative is an axis that silently stops
# measuring on one target.
tiktoken-rs = { version = "0.12", optional = true }

[features]
default = ["glyph-cost"]
# The glyph-cost analytics surface: `gmn_symbology` (the `cl100k_base` token-cost
# primitive) and everything that reads it. Selecting it OUT is an explicit, first-class
# choice made by the two wasm shims that never call the primitive — never a silent
# per-target degradation of a caller that does.
glyph-cost = ["dep:tiktoken-rs"]

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest = "1"
# The Gate-2 vendored-treebank round-trip test dogfoods the real corpus.json descriptor
# against the native license CATEGORY (ring-fenced + attributed CC BY-SA ⇒ IMPORT_OK) — the
# same classifier the conformance vendoring audit uses, keyed off the descriptor not a path.
gmeow-license = { path = "../license" }
serde_json.workspace = true
