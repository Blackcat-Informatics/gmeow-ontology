[package]
name = "gmeow-pipeline"
description = "GMEOW DAG-driven single-pass build executor: typed stages over an in-memory RDF dataflow, dogfooding the build graph from gmeow: slice individuals (#861)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pipeline", "dag", "build", "rdf", "gmeow"]

[lib]
# rlib-only: a pure-Rust engine crate consumed by the workspace.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# The RDF 1.2 kernel: stages exchange an in-memory dataset / bundle and stamp
# provenance through this crate; the content store backs the pipeline cache.
purrdf.workspace = true
# The native, zero-dependency XSD value space (#906): the snapshot carrier
# canonicalizes typed-literal lexical forms (`415.0`→`415.0`, `0.90`→`0.9`,
# `+00:00`→`Z`) to the W3C-canonical mapping via `gmeow_xsd::parse_by_iri` +
# `XsdValue::canonical_lexical`, replacing the transient-oxigraph-`Store` literal
# normalizer (#1132 carrier-purity). DIRECT + NON-optional: the snapshot carrier
# path is always on, so this must not be feature-gated.
# The native SPARQL engine (#906): the single required impl of the gmeow-rdf-core
# `SparqlEngine` seam. The result-shape / research-object export leaves run their
# introspection SELECTs and CONSTRUCT over the native `RdfDataset` carrier through
# this engine, replacing the transient oxigraph `Store` + `SparqlEvaluator`. DIRECT
# + NON-optional: those export leaves are always on, so this must not be gated.
# Native, oxigraph-free term-IRI validator (`NamedNode::new` → `gmeow_iri::parse`,
# absolute-IRI in term position). The `yaml_ld` export leaf's JSON-LD-star inverse
# validates `@id`/`@type`/predicate/graph IRIs through this, preserving the old
# `oxigraph::model::NamedNode::new` Ok/Err discrimination (EPIC #906).
# The gts ARCHIVE BOUNDARY only (#1132): GTS is exit-only — never an internal
# pipeline transport. Every internal export leaf (export / yaml_ld / parquet /
# schemas / okf / transcode) now reads the native `RdfDataset` carrier off the
# snapshot product's bundle, NOT a gts `Graph`. This dep is scoped by discipline to
# the three archive-boundary surfaces that legitimately read/write the gts package:
# `release.rs` (sign + verify a release `gmeow.gts`), `py.rs::fold_release_bundle_native`
# (Ed25519 release signing), and `mcp.rs` (the McpView memory server, a separate
# system consuming the bundled snapshot). Same pin as gmeow-rdf links. Do NOT
# reintroduce it into an export leaf — the carrier is the single internal transport.
# The `reason` stage wires the native EL/DL reasoner + artifact builders directly
# (gmeow_logic::reason::reason_all + reason::artifacts) — no Python, no PyO3.
gmeow-logic = { path = "../logic" }
# The pure compiler surface (parse_logic_str + the RDF/text projections) the
# transcode stage drives, split out of gmeow-logic in #732.
gmeow-logic-compile = { path = "../logic-compile" }
# The affect-intensity geometry compute (√(xᵀGx) over gmeow:coreAffectGram): the
# `mappings` stage's EmotionML lowering projects the canonical schadenfreude example, so
# the worked-<emotion> intensity + per-dimension unit-clamp values are COMPUTED from the
# committed affect slice files here — never a hand-typed constant (affect honesty).
gmeow-affect = { path = "../affect" }
# The five native math flagship producers (gmeow_math::producers): the
# `math_producers` stage RUNS them and folds each producer's deterministic RDF
# graph into gmeow.gts (Design A — the producer output ships in the bundle, the
# shippable deliverable, not merely a test-side equality gate). Leaf compute crate
# (no dependency back on gmeow-pipeline), so no cycle. A normal dependency also
# satisfies the dev-only math flagship discharge harness, so it is NOT duplicated
# in [dev-dependencies].
gmeow-math = { path = "../math" }
# The structured snapshot's verify-attestation graph reads the native verify
# lane's `Report` findings (severity / `verify.<stem>` codes) to build the
# `gmeow:graph/verify` attestation (#861 P6, two-pass like build_snapshot_bytes).
gmeow-errors = { path = "../errors" }
# The perf-gate merge binary surfaces progress through the shared Reporter.
gmeow-cli-core = { path = "../cli-core" }
# The statement feedback surface folds the native statement-stage output through
# the Rust invariant and lossless checks so Python remains only an interface.
gmeow-validate = { path = "../validate" }
# The `conformance` stage grades the committed external corpus (native frozen
# verdict vs published external verdict) and emits the divergences as a
# `gmeow:Finding` graph via gmeow_conformance::divergence — the same emitter the
# `ingest-external --grade-suite` lane drives, reused rather than re-implemented.
# Acyclic: gmeow-conformance does not depend on gmeow-pipeline.
gmeow-conformance = { path = "../conformance" }
# The `mappings` stage wires the slice-resident SSSOM + FnO emitters directly
# (gmeow_slice::emit_sssom_sets / emit_fno) — the SSSOM/FnO halves are Rust.
# The `docs_render` stage wires the typed documentation model + RDF projection
# (gmeow_docs::DocsModel::discover / to_gmeow_rdf / render_site) — no port (#853).
gmeow-docs = { path = "../docs" }
# The `docs-print` crate renders the deterministic Typst source and compiles the
# byte-reproducible print PDF, folded into the `docs-print` bundle blob alongside
# the mdbook `docs-book` tree.
docs-print = { path = "../docs-print" }
# The slice-quality advisor kernel, exposed as an MCP tool so agents can
# measure → act → re-measure a slice's quality in one loop.
gmeow-slice-quality = { path = "../slice-quality" }
# The `slice_brief` stage assembles a gmeow:AuthoringPacket per in-repo slice batch
# (definition + axioms + bounded neighbourhood + grounding cross-table), folded into
# gmeow.gts as the graph/authoring-briefs corpus (the shippable authoring deliverable).
gmeow-slice-brief = { path = "../slice-brief" }
# The `lang_form` prose-lift corpus drives the shared `lang:` ingester skeleton
# (`PlainTextBridge` + the deterministic N-Triples / content-address emitter), so there is
# one digest and one bridge law-spine across every `lang:` producer.
gmeow-lang-bridge = { path = "../lang-bridge" }
# The `lang:` form AST: the prose-lift corpus interns each distinct English literal as a
# `lang:SurfaceForm` addressed by its material `SurfaceForm::surface_key`.
gmeow-lang-form = { path = "../lang-form" }
# The `json_schema` export leaf compiles the SHACL shape union into JSON Schema +
# OpenAPI natively (gmeow_shacl::shape_union::load_shapes + json_schema::compile),
# replacing the Python LinkML JSON-Schema/OpenAPI generators (#700).
# Stage DAG cycle detection is delegated to the shared DAG-workflow certifier in
# gmeow-logic (gmeow_logic::dag_profile); the topological levelling here is a
# plain Kahn pass over BTreeMap/BTreeSet, so crates/pipeline no longer depends on
# petgraph directly — the one acyclicity authority lives in gmeow-logic.
# Level-parallel scheduling: independent stages within a topological level run
# concurrently; only Reason stages serialize under the process-wide ENGINE_LOCK.
rayon = "1"
sha2 = "0.10"
# SHA-1 only for the content-addressed statement reifier mint (mirrors the
# Python `mint_reifier`); never for security.
sha1 = "0.10"
# blake3 for the eval span verifier's current-content digest (mirrors the
# Python `_current_digest`); the corpus digests pin the scored source version.
blake3 = "1"
serde = { version = "1", features = ["derive"] }
# Stage products use compact binary encoding in the content-addressed cache; JSON
# remains the deterministic human-readable cache index and several export formats.
bincode = "1.3"
serde_json = "1"
# YAML-LD-star emission: deterministic, anchor-free YAML from the JSON-LD-star lead.
serde_yaml = "0.9"
# The release-as-evidence fold reads the committed snapshot's blob `pub`
# metadata maps (CBOR `Value`) to recover each blob's declared media-type + rep
# when replaying them; same ciborium the gts_compose author links.
ciborium = "0.2"
# Live target-vocabulary fetch for the correspondence-soundness pass: the
# `allow_network=true` leg fetches a canonical target source document and filters it to the
# minimal structural axiom subset. The on-gate path uses `allow_network=false` (snapshots /
# fixtures only), so this is never on the gate. Same pin as the slice crate's fetcher.
ureq = "3"
# Self-cleaning system temp dirs for the consumer runtime path (works from a
# read-only install) — used by the cache, source-load, and validation lanes.
# Same pin as the test-side tempdir usage.
tempfile = "3"
# Structured, subscriber-controlled sink for library-internal telemetry that has
# no reporter in scope (opt-in per-stage timing, claim-audit phase timing, the
# advisory bench scoreboard, JSON-Schema lossy-drop notices). Never product data
# and never a gate — the events surface only when a subscriber (e.g. the CLI's
# `init_tracing`) is installed and the level is enabled.
tracing = "0.1"

[build-dependencies]
# Hash the workspace source into GMEOW_BUILD_FINGERPRINT (build.rs) so the
# persistent per-stage cache invalidates on any code/toolchain change.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# The diagnostic substrate is a normal dependency; integration tests build typed
# `gmeow_errors::Diag` values off the `error::*` DiagKinds, so it is also a
# dev-dependency (integration-test crates do not inherit normal dependencies).
gmeow-errors = { path = "../errors" }
# Byte goldens for the per-graph `graph/logic` fold (#1132 C6): a deterministic
# snapshot of the canonical RDF-1.2 named-graph carriage, regression-pinned
# independent of the full gmeow.gts.
insta = { version = "1.48", features = ["json"] }
# The release-as-evidence fold tests build a deterministic Ed25519 signing key +
# a synthetic OpenPGP public-key armor; same dalek the snapshot signer uses.
ed25519-dalek = "2"
# Determinism tests for the YAML-LD-star / JSON-LD-star emitter vary hash-map
# seeds to prove that output order is independent of input collection order.
ahash = "0.8"
# Issue #699 / PR #978: validate sample @annotation fragments against the
# SHACL-derived JSON Schema from #700.
jsonschema = { version = "0.46", default-features = false }
# The gmeow:FlagshipScenario execution-discharge harness (tests/lang_flagship_discharge.rs)
# drives BOTH validation channels over each flagship's counter-example and worked example,
# and RUNS each named native producer. Integration-test crates do NOT inherit the normal
# dependency table, so the crates the harness touches are redeclared here.
#   * gmeow-validate — the native structural lint + native SHACL channels
#     (structural_lint_dataset / shacl_validate_dataset / parse_file_dataset).
gmeow-validate = { path = "../validate" }
# Reuse the slice harness's canonical conformance-data scope. In particular,
# logic:/lang:/math: validation sees the three-module grounding kernel while
# enforcing shapes remain slice-owned; keeping this in one helper prevents the
# flagship and declarative conformance lanes from drifting apart.
gmeow-slicetest = { path = "../slicetest" }
#   * gmeow-lang-bridge — the FS1 producer `lower::lower_svo` + `flagship_svo_sentence`.
gmeow-lang-bridge = { path = "../lang-bridge" }
#   * gmeow-logic-compile — `ir::PreservationKind`, the per-stage preservation record the
#     FS1 lowering carries.
gmeow-logic-compile = { path = "../logic-compile" }
#   * purrdf — the frozen RdfDataset carrier (DatasetView), the parsed SHACL Shapes, the
#     ValidationReport terms, and the SliceCatalog the FS2/FS4/FS5 producers ingest.
purrdf.workspace = true
#   * gmeow-math — the five native math producers (gmeow_math::producers) the math
#     execution-discharge harness (tests/math_flagship_discharge.rs) RUNS and pins. It is
#     now a NORMAL [dependencies] entry (the `math_producers` stage folds the producer
#     output into gmeow.gts), which the integration-test crates also see — so it is NOT
#     redeclared here (no duplicate entry).
#   * gmeow-logic — the five native logic producers the logic execution-discharge harness
#     (tests/logic_flagship_discharge.rs) RUNS and pins: reason::reason_all,
#     correspondence_exec::leg_pair_verdict, counterfactual::construct_and_resolve,
#     conjecture::conjecture_test, and materialize::materialize_routed (with its surfaced
#     ChaseAdmission termination certificate + explain::assert_faithful trace).
gmeow-logic = { path = "../logic" }
