# Suite-quality measurement (T9, #790): Rust coverage, mutation testing, and
# benchmarks. These are SLOW and report-only — they run OFF the required PR gate
# (scheduled + manual dispatch), exactly like the fuzz job (#788) and the HermiT
# oracle. The always-on contract gate stays `make rust-test`; nothing here can
# block a PR. This IS the documented gate-perf budget addressing the slow-gate
# concern (see docs / AGENTS.md).
name: suite-quality

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily (after the fuzz job)
  workflow_dispatch:

permissions:
  contents: read

env:
  # Scheduled CI measurements must not inherit the repo's local `target-cpu=native` default.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zunstable-options -Clink-self-contained=+linker -Clinker-features=+lld -Ctarget-cpu=x86-64-v3"
  CARGO_ENV_CFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CXXFLAGS_VALUE: "-O2 -march=x86-64-v3 -mtune=generic"
  CARGO_ENV_CFLAGS_FORCE: "true"
  CARGO_ENV_CXXFLAGS_FORCE: "true"

concurrency:
  group: suite-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: rust coverage (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (nightly + llvm-tools)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-llvm-cov + cargo-nextest
        run: |
          cargo install cargo-llvm-cov --locked || cargo install cargo-llvm-cov
          cargo install cargo-nextest --locked || cargo install cargo-nextest
      - name: Coverage (lcov + html, report-only)
        run: make rust-coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: |
            lcov.info
            target/llvm-cov/html/
          if-no-files-found: warn

  mutants:
    name: mutation testing (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-mutants + cargo-nextest
        run: |
          cargo install cargo-mutants --locked || cargo install cargo-mutants
          cargo install cargo-nextest --locked || cargo install cargo-nextest
      # The validate core is feasible nightly; the larger logic core is run
      # on-demand via dispatch with MUTANTS_ARGS. Surviving mutants are a
      # report, not a gate.
      - name: Mutation test the validate core
        run: make mutants MUTANTS_ARGS="-p gmeow-validate"
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: warn

  benchmarks:
    name: benchmarks (perf leaderboard feed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run criterion benchmarks
        run: make bench
      - name: Regression scoreboard vs committed baseline (#668, report-only)
        # Advisory: prints a live-vs-baseline scoreboard to the job summary and
        # ALWAYS exits 0 — runner jitter never fails this off-gate lane.
        run: make bench-compare | tee "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            bench/baseline.json
            target/criterion/
          if-no-files-found: warn

  rust-heavy:
    name: rust heavy off-gate tests (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-nextest
      - name: Heavy off-gate Rust tests (corpus_parity_heavy_offgate et al.)
        run: make maint-rust-heavy
