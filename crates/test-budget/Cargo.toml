[package]
name = "gmeow-test-budget"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Post-run JUnit per-test duration budget gate for the Rust suite (#1045)."
readme = "README.md"

[[bin]]
name = "gmeow-test-budget"
path = "src/main.rs"

[dependencies]
# Handled failures surface through the shared console Reporter as Error-grade
# diagnostics (never a bare stderr write); the OK product line stays on stdout.
# Acyclic: cli-core depends only on gmeow-errors.
gmeow-cli-core = { path = "../cli-core" }
gmeow-errors = { path = "../errors" }
