[package]
name = "gmeow-errors"
description = "GMEOW errors and diagnostics substrate: first-class model and renderers, exposed to Python via PyO3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["diagnostics", "sarif", "validation", "reporting", "gmeow"]

[lib]
# rlib-only: this crate no longer ships a standalone PyO3 extension. Its bindings
# are linked into the single `gmeow_native` cdylib (crates/native).
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py313"], optional = true }
purrdf = "0.4"
blake3 = "1"

[dev-dependencies]
# insta: whole-output snapshot goldens for the five renderers. The
# renderers are pure functions of the Report and the fingerprint is a content
# hash, so the output is fully deterministic — snapshots carry it verbatim, no
# redaction. Pinned to match crates/docs / crates/logic.
insta = { version = "1.48", features = ["json"] }
# static_assertions: compile-time negative trait-bound checks (macro_rules, not a
# proc-macro; no brittle stderr goldens). Guards `Diag: !std::error::Error`
# (the blanket-From coherence invariant) and `Diag: !Serialize` (lowering is the
# only serialization surface).
static_assertions = "1"
