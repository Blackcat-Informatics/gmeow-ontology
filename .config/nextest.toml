[profile.default]
# Always-on per-test budget (#1045): every test on this profile must complete under
# 25 s real wall time, enforced AFTER the run by the JUnit duration gate
# (`cargo run -p gmeow-test-budget`, wired into `make rust-test`/`rust-gate`). Tests
# that are still over budget are carved out of this profile via `default-filter`
# below and run on the `maint-heavy` profile instead — so the gate has NO
# legitimate >25 s test to allowlist. Correctness failures stay in the normal
# profile even when they were discovered during maint-heavy evaluation.
# The slow-timeout stays at the original 120 s terminate cliff purely as a
# runaway/hang backstop; the 25 s POLICY is the JUnit gate, not this timeout.
#
# `default-filter` is the set of tests run when no filter is given on the CLI. Keep
# this expression as the single source of truth for what the always-on gate excludes;
# `maint-heavy` re-includes everything. Each excluded group MUST be justified here and
# in AGENTS.md's test-budget section (the off-gate allowlist). The post-run JUnit
# budget gate verifies nothing >25 s slipped THROUGH this filter onto the gate.
#
# Off-gate groups (reevaluated 2026-06-29 via `make maint-rust-heavy`; #1045).
# Most former exclusions now pass well under the 25 s policy and are back on the
# default/ci profile. The remaining exclusions are still over budget:
#   - gmeow-validate deep_surfaces_entailed_inconsistency..._heavy_offgate:
#     30.705 s locally; the consumer `gmeow validate --deep` AC1 test reasons over
#     user data merged with the WHOLE bundled TBox via the native Nemo chase. Fast
#     per-commit coverage stays with the tiny-TBox gmeow-logic unit tests plus the
#     on-gate deep_pass_failure_* / deep_false_* validate tests.
#   - gmeow-pipeline fold_parity binary:
#     32.231 s locally; this is the full real-repo terminal sink vs committed
#     `generated/dist/gmeow.gts` fold-isomorphism oracle.
#   - gmeow-pipeline end_to_end binary:
#     82.351 s in CI shard 1; it runs the real production spine through
#     `stage-snapshot`, which is full-DAG / ontology-size work. Focused per-stage
#     and carrier tests keep the failure modes covered on-gate.
#   - gmeow-foundation-corpus imported_graph_conforms_to_shapes:
#     26.065 s in CI shard 2; it validates the importer output unioned with the
#     WHOLE merged ontology (every slices/*/*/module.ttl) against the ENTIRE SHACL
#     shape corpus — genuinely-irreducible whole-ontology conformance. The H8
#     migration folded 9 new sh:sparql constraint shapes (each a full-graph scan)
#     into that corpus, nudging it just past budget. No coverage class leaves the
#     gate: the importer's graph-shape parity stays on-gate via the four sibling
#     SPARQL acceptance tests (scores/roles/trajectory) in the same file, and
#     whole-ontology SHACL conformance stays on-gate via the ~35 fixture-only
#     domain conformance_* validate tests (the four whole-ontology-union
#     conformance binaries join this off-gate group — see next entry — for the
#     same reason).
#   - gmeow-validate conformance_{finance,agentic,ai_claims,music_analysis}:
#     ~8.8 s locally / 24-26 s in CI. These are exactly the domain conformance
#     binaries whose cases use Case::with_ontology(): each unions its fixture with
#     the WHOLE merged ontology (every slices/*/*/module.ttl) and validates that
#     entire graph — not just the fixture — against the ENTIRE shape corpus, so it
#     carries the same H8 sh:sparql-constraint cost as imported_graph_conforms_to_shapes
#     above. Measured: fixture-only conformance cases run in ~0.05 s, so the whole
#     cost is the ontology-union validation and is independent of which fixture is
#     under test — the four ride the 25 s cliff together and CI jitter alone decides
#     which trip on a given run, so the whole class is carved out rather than the
#     cases that happened to trip. No coverage class leaves the gate: the ~35
#     fixture-only conformance_* domain tests stay on-gate against the same full
#     shape corpus, and the whole-ontology-union path stays covered on maint-heavy
#     alongside imported_graph_conforms_to_shapes.
#   - gmeow-validate conformance_math_producers: ~20 s per test in CI. Each of the
#     five tests validates a native math-flagship producer's emitted graph, merged
#     with the WHOLE base ontology, against the ENTIRE shape corpus via
#     validate_with_ontology() — the identical whole-ontology-union cost as the four
#     domain conformance binaries above, so it joins the same off-gate group. No
#     coverage leaves the per-commit gate: the five producers' pinned falsifiable
#     values are still RUN and asserted on-gate by
#     crates/pipeline/tests/math_flagship_discharge.rs (which executes each producer),
#     and this binary is the extra cross-crate proof that the producer output also
#     validates SHACL-clean — reevaluated on maint-heavy.
#   - gmeow-logic whole_bundle_coherence_gate_catches_injected_clash:
#     ~570 s locally; it imports the WHOLE committed `gmeow.gts` bundle and drives
#     the native Nemo chase over it twice (once benign, once with an injected
#     disjoint-class clash). This exclusion is budget-exempt, NOT gate-exempt: the
#     test still runs on every `make check` via the dedicated `coherence-gate-teeth`
#     target, which invokes it with `--ignore-default-filter` plus an explicit `-E`
#     selector (overriding this `default-filter`) and does not feed its JUnit output
#     into the 25 s budget gate.
#   - gmeow-pipeline fanout_parity binary + stages::superset::tests::
#     project_bundle_reconstructs_the_committed_tree_and_gate_is_clean:
#     20.4 s / 17.5 s / 16.8 s locally (24-30+ s in CI). These reconstruct the
#     whole `generated/` tree from the committed `gmeow.gts` bundle alone and
#     assert the superset gate is clean / the fanout is byte-reproducible and
#     idempotent — irreducibly O(bundle size), the same whole-committed-bundle
#     class as `fold_parity`/`end_to_end` above. The total-prose-lift surface
#     (a `lang:SurfaceForm` per distinct English literal) grew the bundle ~30 %,
#     nudging these three past budget; the cost is bundle-size, not fixture-
#     dependent. No coverage class leaves the gate: the superset reconstruction
#     gate and the fanout reproduction both run on every `make check` via
#     `make check-generated` (the `stage:superset`/`pipeline-reconcile` and
#     `fanout` stages, which hard-fail on any drift), and the whole class stays
#     on-gate on `maint-heavy`.
#   - gmeow-dev-cli cli_parity::build_writes_serializations + gmeow-cli
#     cli::export_respects_language_selector + cli::project_schema_org_view_filter:
#     6-8 s standalone but 25.5-27.5 s under full-parallelism CI contention. Each
#     drives the CLI to serialize / export / project-a-view over the WHOLE bundle,
#     so they are irreducibly O(bundle size) — the same whole-committed-bundle class
#     as fanout_parity / end_to_end above. The lang: projection surface (OntoLex /
#     CoNLL-U / SemAF forward projections) plus the native-chase logic growth nudged
#     these three past budget on bundle-size alone, not fixture cost. Coverage stays:
#     the written serializations are drift-gated on every `make check` via
#     `make check-generated`, and all three stay on-gate on `maint-heavy`.
#   - gmeow-pipeline projections::tests::up_project_recovers_message_superclass_via_prp_dom
#     + projections::tests::up_project_never_fabricates_subkind_or_sibling:
#     6.2 s each standalone but 26.9-27.3 s under full-parallelism contention. Each
#     folds the WHOLE committed `gmeow.gts` bundle and drives the real inverse-ingest
#     `up_project` over its mappings/cells archives (nextest's process-per-test model
#     means each pays the full fold despite the in-process `sioc_run` cache) —
#     irreducibly O(bundle size), the same whole-committed-bundle class as
#     fanout_parity / end_to_end above. The lang: GMN dialect graft grew the bundle
#     and nudged both past budget on bundle-size alone, not fixture cost. Coverage
#     stays: the up-projection surface keeps its fixture-scale on-gate tests in the
#     same module (up_project_lifts_consumer_vocab_to_gmeow,
#     harvest_reasoned_types_needs_world_colocation), and both bundle-scale tests
#     stay on-gate on `maint-heavy`.
#   - gmeow-docs extract_roundtrip::rendered_tree_is_disk_faithful: 32.6 s. It
#     drives the real `render::write_site` over the WHOLE (primed) documentation
#     site — writing every page to disk and reading each back to prove the on-disk
#     bytes equal the in-memory Site — so it is irreducibly O(site size), the same
#     whole-bundle class as the parity/superset tests above. The site render itself
#     is primed (not in the test's time); the cost is the per-file disk write+read
#     round-trip over the whole tree, which the lang: graft + correspondence-laws
#     surface grew past budget on page-count alone, not fixture cost. Coverage
#     stays: the write contract runs on every `make check` (the docs fanout is
#     drift-gated via `make check-generated`) and the test stays on-gate on
#     `maint-heavy`.
#   - gmeow-cli cli::project_unknown_view_fails + cli::describe_env_language_rejected_if_unknown
#     + gmeow-dev-cli cli_parity::project_view_over_the_snapshot:
#     3-5 s standalone but 27.5-32.2 s under full-parallelism CI contention. Each
#     drives the CLI to load / describe / project-a-view over the WHOLE committed
#     bundle before it reaches its (fast) reject/parity assertion, so they are
#     irreducibly O(bundle size) — the identical whole-committed-bundle class as
#     the build_writes_serializations / export / project_schema_org_view siblings
#     above. The lang: total-prose-lift + GMN-graft surface plus the conjecture-
#     library logic:/math: term growth grew the bundle and nudged these three
#     siblings over the same 25 s cliff on bundle-size alone, not fixture cost.
#     Coverage stays: the CLI project/describe surface keeps its fixture-scale
#     reject/parity coverage on-gate in the same binaries, the serializations are
#     drift-gated via `make check-generated`, and all three stay on-gate on
#     `maint-heavy`.
#   - gmeow-pipeline quality_assessment_graph_rides_the_self_description_carrier_heavy_offgate:
#     86.2 s. It builds the full self-description carrier, which scores every one of
#     the ~81 slices via `slice_quality::score_slice` to attach the
#     `graph/quality-assessment` named graph — irreducibly O(slice count), the same
#     whole-repo class as `end_to_end`/`fold_parity`. Coverage stays: the
#     attach↔fanout-path bijection and the N-Triples fold form are proven on-gate by
#     the fast sibling units
#     `stages::carrier::quality_assessment_tests::quality_assessment_fanout_path_is_registered_and_folds_as_ntriples`
#     and `stages::superset::tests::quality_assessment_nt_folds_as_ntriples_via_its_own_fanout_graph`,
#     the folded `generated/quality/gmeow.quality-assessment.nt` is drift-gated on every
#     `make check` via `make check-generated`, and the exhaustive real-carrier proof
#     stays on-gate on `maint-heavy`.
#   - gmeow-pipeline stages::carrier::term_entailments_tests::term_entailments_are_non_vacuous_on_the_real_repo
#     (F1, issue 1404): ~100 s locally. Proves the B3 entailment join is non-vacuous
#     against the REAL ontology by running the real `source_load` → `statements` /
#     `compile_logic` → `mappings` → `reason` stage chain (a full native-chase
#     reasoning pass over the whole EDB) and asserting `term_entailments` is
#     genuinely non-empty — irreducibly O(bundle size), the same whole-repo class
#     as `end_to_end`/`quality_assessment_graph_rides_the_self_description_carrier_heavy_offgate`.
#     Coverage stays: the join logic itself (reifier-bound quoted-triple resolution,
#     term matching, hard-fail-on-missing-artifact) is proven on-gate by the fast
#     fixture-only siblings
#     `term_entailments_from_explanations_populates_matching_term_only` and
#     `term_entailments_from_upstream_joins_and_hard_fails_on_missing_artifact` in the
#     same module, and the real-repo non-vacuity proof stays on-gate on `maint-heavy`.
#   - gmeow-pipeline stages::docs_render::tests::diagnostics_digest_total_is_non_vacuous_on_the_real_repo
#     (B1, issue 1404): ~105 s locally. The symmetric real-repo non-vacuity proof for
#     the diagnostics digest — runs the real `source_load` → `validate` /
#     `compile_logic` chain (whole-ontology SHACL validation + logic compile) and
#     asserts the folded finding `total` is non-zero, the same whole-repo cost class
#     as the conformance-union binaries above. Coverage stays: the term/slice join +
#     hard-fail-on-missing-upstream mechanism is proven on-gate by the fast synthetic
#     sibling `diagnostics_digest_joins_term_and_slice_and_hard_fails_on_missing_upstream`
#     in the same module, and the real-repo non-vacuity proof stays on-gate on `maint-heavy`.
default-filter = '''
  not (
    (package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/))
    | (package(gmeow-pipeline) & test(/projections::tests::up_project_(recovers_message_superclass_via_prp_dom|never_fabricates_subkind_or_sibling)/))
    | (package(gmeow-pipeline) & binary(fold_parity))
    | test(/corpus_conformance_heavy_offgate/)
    | test(/w3c_rdfc10_heavy_offgate/)
    | (package(gmeow-logic) & test(/whole_bundle_.*gate/))
    | (package(gmeow-pipeline) & binary(end_to_end))
    | (package(gmeow-pipeline) & binary(fanout_parity))
    | (package(gmeow-pipeline) & test(/stages::superset::tests::project_bundle_reconstructs_the_committed_tree_and_gate_is_clean/))
    | (package(gmeow-foundation-corpus) & test(/imported_graph_conforms_to_shapes/))
    | (package(gmeow-validate) & (binary(conformance_finance) | binary(conformance_agentic) | binary(conformance_ai_claims) | binary(conformance_music_analysis) | binary(conformance_math_producers)))
    | (package(gmeow-dev-cli) & binary(cli_parity) & (test(build_writes_serializations) | test(project_view_over_the_snapshot)))
    | (package(gmeow-cli) & binary(cli) & (test(export_respects_language_selector) | test(project_schema_org_view_filter) | test(project_unknown_view_fails) | test(describe_env_language_rejected_if_unknown)))
    | (package(gmeow-docs) & binary(extract_roundtrip) & test(rendered_tree_is_disk_faithful))
    | (package(gmeow-pipeline) & test(/quality_assessment_graph_rides_the_self_description_carrier_heavy_offgate/))
    | (package(gmeow-pipeline) & test(/stages::carrier::term_entailments_tests::term_entailments_are_non_vacuous_on_the_real_repo/))
    | (package(gmeow-pipeline) & test(/stages::docs_render::tests::diagnostics_digest_total_is_non_vacuous_on_the_real_repo/))
  )
'''
slow-timeout = { period = "60s", "terminate-after" = 2, "grace-period" = "30s" }
retries = { backoff = "fixed", count = 2, delay = "1s" }
# Output ergonomics (#871): surface the slowest tests in the final summary every
# run (previously invisible until they hit the slow-timeout terminate cliff).
# Passing runs stay quiet; a failing test's captured output shows inline AND is
# recapped at the end so it is not lost in a parallel run.
final-status-level = "slow"
success-output = "never"
failure-output = "immediate-final"

[profile.ci]
inherits = "default"
junit = { path = "junit.xml" }
fail-fast = false

# Maintainer lane (#1045): runs EVERYTHING, including the heavy tests the default/ci
# profiles carve out via `default-filter`. Used by `make maint-rust-heavy` so the
# off-gate parity / full-fold / codec coverage still runs (locally + on a CI schedule),
# just not on the per-commit gate. `default-filter = 'all()'` overrides the inherited
# exclusion; the JUnit budget gate is NOT applied to this profile.
[profile.maint-heavy]
inherits = "default"
default-filter = 'all()'
junit = { path = "junit.xml" }
fail-fast = false

# Engine memory cap (#871, sub-ask 3). The Nemo/Scryer reasoning engines are
# RAM-heavy: nextest runs EACH test in its own process, and the in-process
# `CHASE_LOCK` (nemo_engine.rs) / `SCRYER_LOCK` (scryer_engine.rs)
# process-global mutexes serialize only WITHIN a process — they do NOT cap how many multi-GB chase
# PROCESSES run at once. On the 16 GB CI runner the default thread count = nproc
# (4), so up to 4 concurrent chases could OOM-thrash (and the scryer nightly
# alloc-abort surfaces under parallelism). This group caps concurrent engine
# tests to 2; the fast leaf-crate tests (rdf/shacl/validate/docs/diagnostics) and
# the ~360 fast gmeow-logic unit tests stay fully parallel.
[test-groups]
engine = { max-threads = 2 }
mapping-stage = { max-threads = 1 }

[[profile.default.overrides]]
# The whole gmeow-conformance datatest harness (its foundation/* cases materialize
# via nemo's run_chase) plus EVERY gmeow-logic test that drives Nemo or Scryer:
# - Nemo (run_chase / run_reasoning): nemo_engine, materialize, reason, verify, certify
# - Scryer (run_scryer, directly or via dispatch_query): scryer_engine, dispatch,
#   profile_gate, counterfactual — so the scryer nightly alloc-abort insurance above
#   actually covers all scryer execution, not just the scryer_engine module.
# - The oracle boundary: `oracle` (the Nemo/Scryer adapter tests drive a real chase or
#   run_scryer) and `physical::parity` (the divergence harness runs an engine oracle
#   against the native core per fragment). Matched by module so membership is by design,
#   not by a test name happening to contain another module's substring.
# foundation/stablemodel unit tests use the NATIVE rust chase (no engine) and stay parallel.
filter = 'package(gmeow-conformance) | (package(gmeow-logic) & test(/nemo_engine|scryer_engine|materialize|reason|verify|certify|dispatch|profile_gate|counterfactual|oracle|parity/))'
test-group = 'engine'

[[profile.default.overrides]]
# gmeow-pipeline's executor / parity tests exercise full-DAG paths. Keep them
# serialized with engine work so full-DAG reasoning does not contend with
# concurrent chases. The over-budget full-fold / end-to-end binaries are
# off-gated via `default-filter`, but this override still applies in maint-heavy.
# fanout_parity stays ON-gate (~8 s standalone, not irreducible) but joins the
# serialized group: unserialized it piled onto concurrent Nemo chases in the
# shared shard and rode the 25 s cliff over on CI jitter (measured 27.9 s while a
# 20 s entailment chase ran alongside). Serializing it against engine work removes
# the contention without off-gating the fanout write-idempotence coverage — the
# bias is fix-not-off-gate for a test this cheap standalone.
filter = 'package(gmeow-pipeline) & binary(/fold_parity|end_to_end|dag_dogfood|fanout_parity/)'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

[[profile.default.overrides]]
# The #896 native reasoning-entailment harness (crates/logic/tests/ontology_entailments.rs)
# migrates the OWL/EL/DL reasoning pytest cluster: each test drives Nemo
# (rl_closure -> run_chase) over a scoped set of authored slice modules. These
# are now on-gate and under budget after the 2026-06-29 reevaluation, but they
# still share the `engine` group so multi-module closures do not OOM-thrash
# alongside other chases on the 16 GB runner. The longer timeout is only a
# runaway cliff; the JUnit budget gate still enforces the 25 s policy.
filter = 'package(gmeow-logic) & binary(ontology_entailments)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# The whole-ontology coherence-gate teeth tests (crates/logic/tests/coherence_gate.rs)
# drive the native DL consistency path (dl_consistency -> reason_closure -> Nemo chase),
# once over a minimal injected clash and once over the WHOLE committed gmeow.gts bundle.
# They share the `engine` memory group so the full-bundle chase does not OOM-thrash
# alongside other chases; the longer timeout is only a runaway cliff, the JUnit budget
# gate still enforces the 25 s policy.
#
# The whole-bundle chase is irreducibly O(bundle size × DL-rule-set) and measures
# ~520 s locally (was ~95 s). The cost is the DL rule set applied over the whole
# ~720k-quad bundle — dominated by the merged-in top-sortal disjointness axioms (the
# kernel's mutual owl:AllDisjointClasses TBox), which force a disjointness/owl:Nothing
# propagation across the whole individual set. This is NOT the validation-shape work:
# the SHACL/ShEx projection is a sidecar that never reaches the reasoner (only ~510
# shape-touching quads land in the core-prefixes projection graph, and SHACL shapes
# are not DL axioms), so deriving the closed-world validation fragment added no
# measurable chase cost. Raise the runaway cliff to 1200 s (300 s × 4) so this
# budget-exempt gate has margin over local + CI runtime jitter; the cliff is a
# terminate-after backstop, not the expected runtime.
filter = 'package(gmeow-logic) & binary(coherence_gate)'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 4, "grace-period" = "30s" }

[[profile.default.overrides]]
# The consumer `gmeow validate --deep` AC1 test reasons over the user data merged
# with the WHOLE bundled TBox via the native Nemo chase (~50s full-fold). It is
# off-gated via `default-filter` (so it runs only on maint-heavy), but the override
# still applies there (maint-heavy inherits default): serialize under the `engine`
# memory group so the full-fold chase does not OOM-thrash, and grant the long
# terminate cliff the other full-fold reasoning tests use.
filter = 'package(gmeow-validate) & test(/deep_surfaces_entailed_inconsistency.*heavy_offgate/)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# Full-carrier round-trip tests decode the committed `gmeow.gts` and re-emit /
# extract it back through the native gmeow-gts codecs. All are on-gate
# (the blob-input `gts_sink` serialization test rejoined the gate at ~0.3 s once
# its docs-model seam removed the whole-ontology discovery). Keep a longer runaway
# cliff because they are codec / I-O-bound and not protected by the `engine`
# memory group.
filter = 'package(gmeow-pipeline) & test(/gts_sink|stages::carrier::ustar_tests::build_docs_archive_packs_the_rendered_site|stages::carrier::native_assembly_tests::authored_default_assembles_natively/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# The docs "try-it" goldens (crates/pipeline/src/stages/carrier.rs, mod
# docs_try_it_golden) each drive the native Nemo chase (reason_over_dataset)
# to reason the reduced authored-default-world seed — and the reduced-vs-full-EDB
# equivalence golden reasons the full object-level EDB as well. They are on-gate
# lib unit tests, so keep them in the `engine` memory group (like the Nemo-driving
# binaries above): otherwise they over-parallelize with the other chases and
# OOM-thrash on the 16 GB runner. Each fixture is tiny, so the JUnit budget gate's
# 25 s policy still holds; the longer terminate cliff is only a runaway backstop.
filter = 'package(gmeow-pipeline) & test(/stages::carrier::docs_try_it_golden/)'
test-group = 'engine'
slow-timeout = { period = "180s", "terminate-after" = 3, "grace-period" = "30s" }

[[profile.default.overrides]]
# The B3 real-repo non-vacuity proof (F1, issue 1404) drives a full native-chase
# reasoning pass over the WHOLE object-level EDB via the real `ReasonStage`. It is
# off-gated via `default-filter` (runs only on `maint-heavy`), but the override
# still applies there: serialize under the `engine` memory group so it does not
# OOM-thrash alongside other chases, with a runaway-cliff timeout well over its
# measured ~100 s.
filter = 'package(gmeow-pipeline) & test(/stages::carrier::term_entailments_tests::term_entailments_are_non_vacuous_on_the_real_repo/)'
test-group = 'engine'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# The B1 real-repo non-vacuity proof (issue 1404) runs the whole-ontology SHACL
# validate + logic-compile chain (no Nemo chase, so no `engine` memory group — the
# same class as the off-gate `conformance_*` validate binaries). It is off-gated via
# `default-filter` (runs only on `maint-heavy`); grant a runaway cliff well over its
# measured ~105 s so CI jitter never trips the terminate backstop.
filter = 'package(gmeow-pipeline) & test(/stages::docs_render::tests::diagnostics_digest_total_is_non_vacuous_on_the_real_repo/)'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }

[[profile.default.overrides]]
# Mapping-stage integration tests run the full `compile_mappings` registry check.
# They are now on-gate and under budget, but concurrent full mapping compiles are
# redundant and can contend for the same cache/filesystem work. Keep them
# serialized; the JUnit budget gate still enforces the 25 s policy.
filter = 'package(gmeow-pipeline) & test(/stages::mappings::tests::(sssom_emits_and_overlaps_byte_identically_with_committed|edoal_and_sparql_emit_byte_identically_with_committed|standpoint_and_dsl_stats_emit_byte_identically_with_committed|fno_is_well_formed_ntriples|prefix_set_projections_are_emitted_and_parse|list_functions_are_emitted_and_parse)/)'
test-group = 'mapping-stage'
slow-timeout = { period = "300s", "terminate-after" = 2, "grace-period" = "30s" }
