[package]
name = "gmeow-conformance"
description = "GMEOW native logic-conformance harness: discovers and runs the logic conformance corpus under cargo-nextest, driving the crates/logic native engine directly (zero PyO3) and diffing against committed goldens via graph-isomorphism / canonical-JSON / cited-IRI-skeleton comparison. Replaces the Python logic_runner.py."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

# Release-as-evidence roll-up: run the corpus and materialize the
# per-case verdicts as one canonical-JSON artifact for folding into the signed
# release bundle. Driven by `make conformance-report`.
[[bin]]
name = "conformance-report"
path = "src/bin/conformance_report.rs"

# External-corpus ingestion CLI: ingest a TPTP SZS problem / W3C manifest.ttl
# and print the runner verdict, and the reproducible refresh entry point the
# corpus vendoring procedure follows.
[[bin]]
name = "ingest-external"
path = "src/bin/ingest_external.rs"

[dependencies]
# Dependency-free license-token policy classifier (RUST-FIRST single source of truth).
# The vendoring gate (vendored.rs) shares this exact algorithm with the Python
# LinkPolicy shim, which reaches it via the gmeow-validate PyO3 surface.
gmeow-license = { path = "../license" }
# The native logic engine: compile / certify / materialize / explain / foundation
# / native backward / stable-model / probabilistic cores. The harness calls these directly
# (the SAME functions py.rs wraps), so case outputs are identical by construction.
gmeow-logic = { path = "../logic" }
# The pure compiler surface (parse_logic_str / compile_program / projections /
# LedgerEntry) the harness drives, split out of gmeow-logic.
gmeow-logic-compile = { path = "../logic-compile" }
# The diagnostics model + the single gmeow:Finding RDF projection. External-corpus
# divergences ARE restricted Findings (diagnostics doctrine), so the divergence
# emitter reuses this model and `render::to_gmeow_rdf_in_graph` rather than minting
# a parallel vocabulary. `gmeow-logic` already depends on it — no new layering edge.
gmeow-errors = { path = "../errors" }
# The ingestion/report bins surface progress and handled failures through the
# shared console Reporter (Transient note witnesses / Error-grade diagnostics),
# never a bare stderr write. Acyclic: cli-core depends only on gmeow-errors.
gmeow-cli-core = { path = "../cli-core" }
# Native RDF text codecs + native flat RDFC-1.0: the comparator parses
# serialized RDF via `purrdf::parse_dataset` (oxigraph-free text ingress through the
# gmeow-gts codecs), canonicalizes via `purrdf::canonical_flat_nquads`, and buckets
# named graphs via `RdfDataset::project_named_graph` + `serialize_dataset` — all on the
# native, oxigraph-free path (no `oxigraph` feature). `gmeow-logic` already
# depends on this crate, so no new layering edge is created.
gmeow-ns = { path = "../ns" }
purrdf.workspace = true
# Canonical-JSON comparison (sorted keys) for verdicts / ledger / certification /
# budget / answers, and parsing the committed JSON goldens. NO `preserve_order`:
# the default BTreeMap-backed `Value` serializes keys in sorted order, which IS
# the canonical form the Python runner produced via `json.dumps(sort_keys=True)`.
serde_json.workspace = true
serde.workspace = true
# Content-addressed, blake3-keyed instance IRIs for the reified conformance
# comparison + agreement-tally individuals (the SAME hash the diagnostics finding
# IRIs are minted with in gmeow-errors), so the folded graph/conformance individuals
# are deterministic and blank-node-free.
blake3.workspace = true
[dev-dependencies]
gmeow-bundle-import = { path = "../bundle-import" }
# RAII temp directories/files for tests. Every scratch path a test creates is
# removed on drop — including on panic and early return — so a gate run never
# leaves `gmeow-*` litter behind in the system temp dir. Hand-rolling a path
# under `std::env::temp_dir()` is banned by the repo-static guard
# (`check_no_unmanaged_temp_dir` in crates/validate/src/repo_static.rs).
tempfile = "3"
# NOTE: `purrdf` is now a regular dependency (above) — the RDF comparator uses its
# native canonicalizer, and the native-DL gold lane parses curated OWL/gUFO
# fixtures into the frozen `RdfDataset` IR via the same dependency.
