[package]
name = "gmeow-logic"
description = "GMEOW reasoning engine core: world-indexed RDF 1.2 named-graph store for entailment queries, gated against the language-neutral conformance corpus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "rdf-star", "reasoning", "knowledge-graph"]

[lib]
# rlib-only: a pure-Rust engine crate consumed by the workspace.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# Shared RDF 1.2 adapter boundary for loading GTS/sidecar-aware datasets into
# world-indexed logic stores (#648, supports #630/#667). The world-store now holds
# the native `MutableDataset`/`RdfDataset` IR directly — oxigraph-free (EPIC #906).
purrdf.workspace = true
# The native SPARQL engine over `Arc<RdfDataset>` (#906): the world-store's `select`
# and the reasoned-graph governance/verify queries evaluate here, replacing the
# retired oxigraph `SparqlEvaluator`. A leaf-ish crate (rdf-core/sparql-algebra/xsd
# — no edge back to logic), so this introduces no layering cycle.
# First-class diagnostics model (Finding/Report) so the native verify lane builds
# its findings in Rust and hands Python a report via JSON (#695).
gmeow-errors = { path = "../errors" }
# SPARQL property-path algebra: the projection target for logic:PathShape (#1010).
# A leaf-ish crate (gmeow-iri/gmeow-xsd only) — no layering cycle.
# The pure, wasm-able logic compiler (#732): the runtime consumes its parse→IR→
# project surface (frontend / ir / projections) and bridges its IR into the runtime
# EvalRule via crate::lower; certify + the compile_logic entrypoint call into it.
gmeow-logic-compile = { path = "../logic-compile" }
serde_json = "1"
blake3 = "1"
# Delimited-data reader for the n-ary EDB loader (nary_rls): proper quoting/escaping
# and STRICT uniform-arity parsing of ChaseBench-family CSV/TSV corpora. Already in the
# workspace lock (a transitive dep), so this direct edge adds no new resolution.
csv = "1"
# gzip decoder for the n-ary EDB loader: ChaseBench-family corpora ship `.csv.gz`.
# Already in the workspace lock (transitive), so no new resolution — the existing dep.
flate2 = "1"
# foldhash: a fast, FIXED-seed hasher (`foldhash::fast::FixedState`) for the
# engine's lookup-only maps — replacing std's SipHash on the hot join/dedup plane
# (no std SipHash on hot paths). A required, always-on dependency (NOT optionality): determinism
# never comes from hasher order (it stays at the sorted round commit), so the seed
# is fixed and never persisted. Version matches the copy already resolved in the
# workspace lock (pulled transitively by hashbrown 0.15) so no re-resolution.
foldhash = "0.1"
# hashbrown: the raw-entry / `HashTable` + `entry_ref` borrowed-key probe surface
# so the interner dedup and relation-store inserts never clone an owned key per
# probe (the borrowed-key raw-entry probe requirement — mechanical-sympathy
# doctrine). Direct, always-on dependency; version matches the copy
# petgraph already pins in the workspace lock.
hashbrown = "0.15"
# smallvec: the inline form the phase-scoped arena's inline small-vec requirement
# sanctions. A per-round argument tuple that fits inline (arity ≤ 4 — the
# binary engine's common case) stays on the stack; a larger n-ary tuple spills into
# the arena's contiguous backing buffer, truncated at each round boundary. Direct,
# always-on dependency; version matches the copy already resolved in the workspace
# lock.
smallvec = "1"
# petgraph: cycle detection (tarjan_scc) for the DAG-workflow profile certifier
# (crate::dag_profile), the single shared acyclicity certifier crates/pipeline's
# stage graph delegates to. default-features off — only the core graph + algo are
# needed. Same version as crates/pipeline so the workspace resolves one copy.
petgraph = { version = "0.8", default-features = false }
# rayon: data-parallel iterators for foundation multi-world chase.
# Worlds are independent: each `chase_world` call is pure and produces its own
# Vec<FoundationQuad> with no shared mutable state.  Only invoked when
# store.worlds().len() > 1 to avoid thread-pool overhead for single-world inputs.
rayon = "1"
sha1 = "0.10"
# sha2: the canonical-rdf12 projection mints content-stable reifier IRIs as
# sha256(sort_key)[:12], matching the Python compiler byte-for-byte.
sha2 = "0.10"
# chrono: xsd:dateTime PARSING ONLY (parse_from_rfc3339) for the logic:FreshnessGuard
# valid-time currency gate — comparing a datum's logic:datumRecordedAt against a
# logic:GateProbe's logic:decisionTime. default-features off + alloc only: the clock
# feature is deliberately excluded so no wall-clock/system-time enters the evaluator
# (determinism contract). The xsd:duration horizon is parsed by a local fixed-length
# parser (weeks/days/hours/minutes/seconds), not chrono.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Also a dev-dependency so the integration tests (tests/never_panic.rs,
# proptest_invariants.rs) can `use gmeow_logic_compile::` directly (#732).
gmeow-logic-compile = { path = "../logic-compile" }
proptest = "1"
serde_json = "1"
# insta: snapshot goldens for the projection back-ends + explanation prose (T8,
# #789). The `.snap` files ARE the byte-exact unit goldens (the native
# crates/conformance harness owns cross-engine corpus parity). Pinned to match
# crates/docs. `json` feature drives `assert_json_snapshot!` where used.
insta = { version = "1.48", features = ["json"] }
# Acceleration-program baselines (#630, Phase 0). Light feature set: criterion's
# plotters/rayon defaults are off so `make bench` builds fast; the cargo-bench
# stdout summary is all the baseline needs.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# iai-callgrind: the DETERMINISTIC instruction-count backend for the engine bench
# (benches/engines_iai.rs). It counts retired instructions under Valgrind Callgrind
# — a machine-independent, run-to-run stable metric — as external corroboration for
# the on-gate steps+alloc+peak-live cost gate. MAINT-ONLY: it needs the `valgrind`
# binary and the out-of-tree `iai-callgrind-runner` (installed via
# `cargo install iai-callgrind-runner --version 0.16.1`, which MUST match this pin),
# so it is wired only into `make maint-bench-instructions`, never `make check`.
# Default features only (the `#[library_benchmark]` / `main!` surface, which the
# crate gates behind its `default` feature): the heavier `client_requests` /
# `cachegrind` sets stay off, so the dev-dep surface (and its build RAM) is minimal
# — same build-RAM rationale as the criterion pin above.
iai-callgrind = "0.16.1"

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "probabilistic"
harness = false

[[bench]]
name = "reduct"
harness = false

[[bench]]
name = "reason"
harness = false

[[bench]]
name = "engines_iai"
harness = false
