[package]
name = "gmeow-rdf"
description = "GMEOW RDF 1.2 kernel: PyO3-free model, diagnostics, store traits, and GTS/oxigraph adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "rdf-12", "gts", "oxigraph", "diagnostics"]

[lib]
# rlib-only: this crate no longer ships a standalone PyO3 extension. Under the
# `python` feature its bindings are linked into the single `gmeow_native` cdylib
# (crates/native, #630); without it the kernel rlib stays PyO3-free.
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
default = ["gts"]
# `gts` is now DECOUPLED from oxigraph (#885 / purrdf P2b): it enables the GTS
# adapter surface (re-exported from the ring-fenced `gmeow-rdf-core` kernel via
# `gmeow-rdf-core/gts`) plus the Ed25519 signer, but no longer pulls oxigraph.
# The native RDF text codecs (#909, EPIC #906 S3) ride `gts` so they are always-on
# for every Rust consumer (`.goals` no-optionality). `rdf-codecs` pulls only the
# WASM-clean oxttl/oxrdfxml/oxrdf/oxsdatatypes subset — no oxigraph Store — so the
# `--no-default-features --features gts` build parses/serializes RDF text with no
# Store dependency.
gts = ["dep:ciborium", "dep:gmeow-gts", "gmeow-gts/rdf-codecs", "dep:gmeow-rdf-events", "dep:ed25519-dalek", "gmeow-rdf-core/gts"]
# The oxigraph Store adapter now folds parsed quads through the native `gts`-side
# statement-layer helper (`native_codecs::fold_statement_layer`, #909), so it
# requires `gts`. This is a one-directional dep (oxigraph→gts); `gts` itself stays
# oxigraph-free per the #885 ring-fence.
oxigraph = ["gts", "dep:oxigraph", "dep:gmeow-rdf-events", "dep:gmeow-sparql-eval"]
# `python` builds the `gmeow_rdf` PyO3 extension (the native statement codec).
# It is OFF by default so the kernel rlib stays PyO3-free for its Rust consumers
# (gmeow-logic / gmeow-shacl / gmeow-validate); only maturin enables it. This is
# the standard extension-module switch, not a degraded fallback — the Rust
# functionality is identical with or without it (#648, #667).
# `python` builds the GTS producer + statement-codec surface, so it pulls in the
# `gts` feature (gmeow-gts + the Ed25519 signer the snapshot signing path uses —
# now owned by `gts` since the pyo3-free compose core links it, #861 P6).
# The PyO3 surface adds the JSON-LD-star (`yaml-ld`) + RDF/XML (`rdf-codecs`)
# gmeow-gts codecs the compat `Graph.serialize/parse` route through (#834); these
# stay OFF for the non-python Rust consumers (logic/shacl/validate) to keep them lean.
# `rdf-codecs` now rides the always-on `gts` feature (#909), so `python` no longer
# names it here; it keeps only the JSON-LD-star (`yaml-ld`) codec the compat
# `Graph.serialize/parse` route uses.
python = ["dep:pyo3", "gts", "oxigraph", "gmeow-gts/yaml-ld"]

[dependencies]
# The ring-fenced, oxigraph-free kernel (#885 / purrdf P2b): owns the IR, value
# model, diagnostics, store traits, loss ledger, provenance, FnO/SSSOM codecs,
# the content store, and the oxigraph-free GTS reader path. Non-optional —
# gmeow-rdf always re-exports its always-on modules — with default features off
# so the `gts`-only modules stay behind gmeow-rdf's own `gts` feature.
gmeow-rdf-core = { path = "../rdf-core", default-features = false }
# The native, zero-dependency XSD value space (#906): non-optional, so gmeow-rdf's
# always-on native codec path can reach W3C-canonical literal canonicalization
# without any feature gate (#1132 carrier-purity — `.goals` forbids optional
# components). The python-gated py_store value comparator also uses it.
gmeow-xsd = { path = "../xsd" }
ciborium = { version = "0.2", optional = true }
gmeow-gts = { version = "0.9.10", optional = true, features = ["duckdb"] }
gmeow-rdf-events = { path = "../rdf-events", optional = true }
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"], optional = true }
# pyo3 is pulled ONLY by the `python` feature (maturin). Same version/abi3 as the
# sibling extension crates (validate/shacl/logic/diagnostics).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"], optional = true }
# The snapshot signing path constructs a SigningKey from the 32 raw Ed25519 bytes
# the Python `gts.Signer` carries; same major as gmeow-gts links. python-only.
ed25519-dalek = { version = "2", optional = true }
# The native SPARQL evaluator (purrdf S6, #912). Pulled ONLY by the `oxigraph`
# feature: it is the sanity-check engine for the maintainer-only golden-capture
# binary (`src/bin/capture_sparql_goldens.rs`, EPIC #906 Task 2), which freezes
# the oxigraph oracle's outputs as committed goldens. The native engine's own crate
# stays oxigraph-free; this is a one-directional dev/maint dep (capture→native).
gmeow-sparql-eval = { path = "../sparql-eval", optional = true }

# Maintainer-only golden-capture binary (EPIC #906 Task 2). Freezes the oxigraph
# SPARQL oracle over the corpus as committed goldens under
# crates/sparql-conformance/tests/goldens/. Requires the oxigraph oracle present;
# `oxigraph` already implies `gts`.
[[bin]]
name = "capture_sparql_goldens"
path = "src/bin/capture_sparql_goldens.rs"
required-features = ["oxigraph"]

[dev-dependencies]
# Rich colored line-diffs on assert_eq! failure (#871). Drop-in: a shadowing
# `use pretty_assertions::assert_eq;` per test file; identical on pass.
pretty_assertions = "1"
ciborium = "0.2"
gmeow-gts = "0.9.10"
# Same oxigraph build the kernel links (rdf-12, no extra codecs) so proptest
# round-trips drive the identical engine the production codecs use.
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
proptest = "1"
# Acceleration-program baselines (#630/#819 C1 Task 7); light feature set matching
# the sibling crates (logic/shacl/validate): criterion's plotters/rayon defaults are
# off so `make bench` builds fast and the cargo-bench stdout summary is all we need.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
