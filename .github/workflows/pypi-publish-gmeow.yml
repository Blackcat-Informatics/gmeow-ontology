name: Publish gmeow to PyPI

# Manual release of the gmeow five-minute client. This workflow uses PyPI
# trusted publishing (OIDC); the repository environment `pypi-gmeow` must be
# configured in the PyPI project before the first run.
#
# The client depends on the `gmeow-gts` engine, so `pypi-publish-gmeow-gts.yml`
# must have completed and the engine package must be live on PyPI before this
# workflow is triggered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Build gmeow wheel and sdist
        run: uv build --package gmeow --out-dir dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gmeow-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-gmeow
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: gmeow-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f0e5dc6e69f11983ef94dada120 # v1.12.4

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5b534516314117b702b1de8c4fd9844f # v5.5.0
        with:
          python-version: "3.13"

      - name: PyPI smoke test — five-minute client quickstart
        run: python scripts/pypi_smoke.py
        timeout-minutes: 10
